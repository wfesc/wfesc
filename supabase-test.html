<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFESC - Supabase Key Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#eee;
    font-family:Arial,Tahoma,sans-serif;
    padding:20px;
}

.box{
    max-width:600px;
    margin:50px auto;
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:25px;
}

h1{
    text-align:center;
    margin-top:0;
}

.status{
    padding:16px;
    border-radius:12px;
    background:#080808;
    border:1px solid #292929;
    white-space:pre-wrap;
    line-height:1.8;
    word-break:break-word;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#fff;
    color:#000;
}

button:disabled{
    opacity:.5;
}

.ok{
    color:#5cff8d;
}

.error{
    color:#ff6868;
}

.info{
    color:#ddd;
}
</style>
</head>

<body>

<div class="box">

    <h1>WFESC Supabase Test</h1>

    <div id="status" class="status info">
        جاري تجهيز الاختبار...
    </div>

    <button id="testButton" type="button">
        اختبار Publishable Key
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =====================================================
   بيانات مشروع WFESC
===================================================== */

const SUPABASE_URL =
    "https://mcgbzfgbaxwmutniorlw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5b7pTBiGY2D6vDLRsWgVzA_X926lBeM";


const statusBox =
    document.getElementById("status");

const testButton =
    document.getElementById("testButton");


/* =====================================================
   فحص المكتبة
===================================================== */

if (!window.supabase) {

    statusBox.className = "status error";

    statusBox.textContent =
        "❌ مكتبة Supabase لم يتم تحميلها.";

} else {

    statusBox.className = "status ok";

    statusBox.textContent =
        "✓ مكتبة Supabase تم تحميلها\n\n" +
        "✓ رابط المشروع موجود\n" +
        "✓ Publishable Key موجود\n\n" +
        "اضغط زر الاختبار.";

}


/* =====================================================
   اختبار المفتاح
===================================================== */

testButton.addEventListener("click", async function(){

    testButton.disabled = true;

    statusBox.className = "status info";

    statusBox.textContent =
        "جاري اختبار Publishable Key...";

    try {

        const client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ---------------------------------------------
           اختبار الاتصال بـ Auth
        --------------------------------------------- */

        const authResult =
            await client.auth.getSession();


        if (authResult.error) {

            statusBox.className =
                "status error";

            statusBox.textContent =
                "❌ فشل اختبار Supabase\n\n" +
                authResult.error.message;

            return;
        }


        /* ---------------------------------------------
           اختبار الوصول إلى profiles
        --------------------------------------------- */

        const dbResult =
            await client
            .from("profiles")
            .select("id")
            .limit(1);


        if (dbResult.error) {

            statusBox.className =
                "status error";

            statusBox.textContent =
                "⚠️ المفتاح وصل إلى Supabase\n\n" +
                "لكن اختبار جدول profiles فشل:\n\n" +
                dbResult.error.message;

            return;
        }


        /* ---------------------------------------------
           نجاح كامل
        --------------------------------------------- */

        statusBox.className =
            "status ok";

        statusBox.textContent =
            "✅ Publishable Key يعمل بنجاح\n\n" +
            "✓ Supabase URL صحيح\n" +
            "✓ Publishable Key مقبول\n" +
            "✓ Auth يعمل\n" +
            "✓ جدول profiles قابل للوصول\n\n" +
            "المفتاح المستخدم هو Publishable فقط.";

    } catch(error){

        statusBox.className =
            "status error";

        statusBox.textContent =
            "❌ حدث خطأ أثناء الاختبار\n\n" +
            error.message;

    } finally {

        testButton.disabled = false;

    }

});
</script>

</body>
</html>
