<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WFESC - Supabase Auth Test</title>

<style>
body{
    background:#050505;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
    padding:25px;
}

.box{
    max-width:600px;
    margin:auto;
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    border:1px solid #444;
    background:#050505;
    color:#fff;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#fff;
    color:#000;
    font-weight:bold;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#050505;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="box">

<h2>اختبار Supabase Auth</h2>

<p>
هذا الاختبار يفحص الاتصال بالمصادقة فقط.
</p>

<input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
>

<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
>

<button id="login">
تسجيل الدخول للاختبار
</button>

<button id="session">
فحص الجلسة
</button>

<button id="logout">
تسجيل الخروج
</button>

<div id="result">
جاري تجهيز الاختبار...
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


const SUPABASE_URL =
    "https://mcgbzfgbaxwmutniorlw.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5b7pTBiGY2D6vDLRsWgVzA_X926lBeM";


const result =
    document.getElementById("result");


function show(text){

    result.textContent = text;

}


if(!window.supabase){

    show("❌ مكتبة Supabase لم يتم تحميلها.");

}else{

    show(
        "✓ مكتبة Supabase تم تحميلها\n\n" +
        "جاري إنشاء الاتصال..."
    );


    const client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    show(
        "✓ مكتبة Supabase تعمل\n" +
        "✓ تم إنشاء عميل Supabase\n\n" +
        "الآن اضغط «فحص الجلسة»."
    );


    document
    .getElementById("session")
    .addEventListener("click", async function(){

        show("جاري فحص الجلسة...");

        const response =
            await client.auth.getSession();


        if(response.error){

            show(
                "❌ فشل Auth\n\n" +
                response.error.message
            );

            return;
        }


        if(response.data.session){

            show(
                "✓ Auth يعمل\n\n" +
                "User ID:\n" +
                response.data.session.user.id
            );

        }else{

            show(
                "✓ الاتصال بـ Auth يعمل\n\n" +
                "لا توجد جلسة تسجيل دخول حالياً."
            );

        }

    });


    document
    .getElementById("login")
    .addEventListener("click", async function(){

        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        if(!email || !password){

            show(
                "⚠️ اكتب البريد وكلمة المرور أولاً."
            );

            return;
        }


        show("جاري اختبار تسجيل الدخول...");


        const response =
            await client.auth.signInWithPassword({

                email: email,

                password: password

            });


        if(response.error){

            show(
                "❌ فشل تسجيل الدخول\n\n" +
                response.error.message
            );

            return;
        }


        show(
            "✓ تسجيل الدخول يعمل\n\n" +
            "User ID:\n" +
            response.data.user.id
        );

    });


    document
    .getElementById("logout")
    .addEventListener("click", async function(){

        const response =
            await client.auth.signOut();


        if(response.error){

            show(
                "❌ فشل تسجيل الخروج\n\n" +
                response.error.message
            );

            return;
        }


        show(
            "✓ تم تسجيل الخروج بنجاح."
        );

    });

}

</script>

</body>
</html>
