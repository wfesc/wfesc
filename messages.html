<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>الرسائل | WFESC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

:root{
    --bg:#030303;
    --glass:rgba(255,255,255,.055);
    --glass-2:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.11);
    --border-light:rgba(255,255,255,.17);
    --text:#f5f5f5;
    --muted:#929292;
    --green:#36e27b;
    --green-soft:rgba(54,226,123,.14);
    --danger:#ff5252;
    --shadow:0 20px 70px rgba(0,0,0,.55);
    --keyboard-height:0px;
    --navigation-height:82px;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%,rgba(255,255,255,.055),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(90,90,90,.08),transparent 25%),
        linear-gradient(180deg,#050505 0%,#020202 100%);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
    overflow-x:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

/* =========================
   MAIN
========================= */

.messages-page{
    width:100%;
    max-width:980px;
    margin:auto;
    min-height:100vh;
    padding:20px 14px 125px;
    position:relative;
}

/* =========================
   TOP HEADER
========================= */

.top-header{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.title-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.title-icon{
    width:48px;
    height:48px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 12px 35px rgba(0,0,0,.3);
    font-size:22px;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

.title-text h1{
    font-size:23px;
    font-weight:800;
    letter-spacing:-.4px;
}

.title-text p{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.activity-button,
.notifications-open-button{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:40px;
    min-width:40px;
    padding:0 12px;
    color:#ddd;
    border-radius:14px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    transition:
        transform .16s ease,
        background .2s ease,
        border-color .2s ease;
}

.activity-button:hover,
.notifications-open-button:hover{
    background:rgba(255,255,255,.08);
}

.activity-button:active,
.notifications-open-button:active{
    transform:scale(.94);
}

.activity-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#666;
    box-shadow:none;
    transition:.2s ease;
}

.activity-dot.active{
    background:var(--green);
    box-shadow:0 0 12px rgba(54,226,123,.75);
    animation:activityPulse 1.8s infinite;
}

@keyframes activityPulse{
    0%,100%{
        box-shadow:0 0 7px rgba(54,226,123,.35);
    }
    50%{
        box-shadow:0 0 15px rgba(54,226,123,.85);
    }
}

.notifications-open-button{
    position:relative;
    font-size:17px;
}

.notification-badge{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:17px;
    height:17px;
    padding:0 4px;
    display:none;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-size:9px;
    font-weight:800;
    border:2px solid #080808;
}

.notification-badge.show{
    display:flex;
    animation:badgePop .22s ease;
}

@keyframes badgePop{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   GLASS
========================= */

.glass{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 18px 60px rgba(0,0,0,.38);
    backdrop-filter:blur(28px) saturate(130%);
    -webkit-backdrop-filter:blur(28px) saturate(130%);
}

/* =========================
   SEARCH
========================= */

.search-section{
    position:relative;
    z-index:15;
    margin-bottom:15px;
}

.search-box{
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px;
    border-radius:19px;
}

.search-icon{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:17px;
}

.search-input{
    flex:1;
    min-width:0;
    height:42px;
    border:0;
    outline:0;
    color:#fff;
    background:transparent;
    font-size:14px;
}

.search-input::placeholder{
    color:#777;
}

.search-mode{
    display:flex;
    gap:5px;
    padding:4px;
    border-radius:14px;
    background:rgba(0,0,0,.24);
    border:1px solid rgba(255,255,255,.055);
}

.search-mode button{
    color:#888;
    background:transparent;
    padding:8px 11px;
    border-radius:10px;
    font-size:11px;
    transition:.2s ease;
}

.search-mode button.active{
    color:#fff;
    background:rgba(255,255,255,.1);
}

/* =========================
   LIST
========================= */

.main-list{
    position:relative;
    z-index:5;
}

.list-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:12px 4px 10px;
}

.list-title strong{
    font-size:14px;
}

.list-title span{
    color:#777;
    font-size:11px;
}

.conversation-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.conversation-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:13px;
    min-height:76px;
    color:#fff;
    text-align:right;
    border-radius:20px;
    overflow:hidden;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 12px 38px rgba(0,0,0,.28);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    opacity:0;
    transform:translateY(13px);
    animation:conversationIn .42s cubic-bezier(.2,.8,.2,1) forwards;
    transition:
        background .22s ease,
        border-color .22s ease;
}

.conversation-card:hover{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.1),
            rgba(255,255,255,.035)
        );
}

.conversation-card.existing-card{
    opacity:1;
    transform:none;
    animation:none;
}

@keyframes conversationIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar-wrap{
    position:relative;
    width:50px;
    height:50px;
    flex:0 0 50px;
}

.avatar{
    width:100%;
    height:100%;
    border-radius:16px;
    object-fit:cover;
    background:#101010;
    border:1px solid rgba(255,255,255,.1);
}

.avatar-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    border-radius:16px;
    background:
        linear-gradient(145deg,#1d1d1d,#090909);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    font-weight:800;
}

.online-dot{
    position:absolute;
    left:-2px;
    bottom:-2px;
    width:12px;
    height:12px;
    border-radius:50%;
    border:2px solid #080808;
    background:#555;
    transition:.2s ease;
}

.online-dot.active{
    background:var(--green);
    box-shadow:0 0 10px rgba(54,226,123,.65);
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:#777;
    font-size:10px;
    white-space:nowrap;
}

.conversation-preview{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
    color:#8c8c8c;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-badge{
    min-width:19px;
    height:19px;
    padding:0 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-size:10px;
    font-weight:800;
    flex:0 0 auto;
}

.card-menu{
    width:32px;
    height:35px;
    border-radius:11px;
    color:#777;
    background:transparent;
    font-size:19px;
}

.card-menu:hover{
    color:#fff;
    background:rgba(255,255,255,.07);
}

/* =========================
   EMPTY / LOGIN
========================= */

.empty-state{
    padding:40px 20px;
    border-radius:22px;
    text-align:center;
    color:#888;
}

.empty-icon{
    font-size:35px;
    margin-bottom:12px;
}

.empty-state strong{
    display:block;
    color:#ddd;
    margin-bottom:7px;
}

.empty-state p{
    font-size:12px;
    line-height:1.7;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
    display:none;
    flex-direction:column;
    gap:9px;
}

.search-results.visible{
    display:flex;
}

.search-result{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px;
    min-height:70px;
    border-radius:19px;
    color:#fff;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    animation:conversationIn .35s ease both;
}

.result-info{
    min-width:0;
    flex:1;
}

.result-name{
    font-size:13px;
    font-weight:700;
}

.result-preview{
    margin-top:6px;
    color:#8b8b8b;
    font-size:11px;
    line-height:1.5;
    overflow:hidden;
}

.result-username{
    color:#666;
    direction:ltr;
    text-align:right;
}

.match-count{
    padding:5px 8px;
    border-radius:10px;
    color:#bbb;
    background:rgba(255,255,255,.06);
    font-size:10px;
    white-space:nowrap;
}

/* =========================
   FULL CHAT
========================= */

.chat-view{
    position:relative;
    z-index:30;
    display:none;
    min-height:calc(100vh - 30px);
    flex-direction:column;
    padding-bottom:92px;
    animation:chatOpen .28s ease both;
}

.chat-view.open{
    display:flex;
}

@keyframes chatOpen{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.messages-page.chat-active .top-header,
.messages-page.chat-active .search-section,
.messages-page.chat-active .main-list,
.messages-page.chat-active .search-results{
    display:none;
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
    position:relative;
    z-index:50;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:67px;
    padding:8px;
    border-radius:21px;
    flex:0 0 auto;
}

.back-button{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border-radius:14px;
    color:#fff;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.09);
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chat-person{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    cursor:pointer;
}

.chat-avatar-wrap{
    position:relative;
    width:43px;
    height:43px;
    flex:0 0 43px;
}

.chat-person-info{
    min-width:0;
}

.chat-person-name{
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-person-status{
    margin-top:4px;
    color:#777;
    font-size:10px;
}

.chat-actions{
    display:flex;
    gap:5px;
}

.chat-action{
    width:40px;
    height:40px;
    border-radius:13px;
    color:#aaa;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.065);
    font-size:16px;
}

.chat-action:hover{
    color:#fff;
    background:rgba(255,255,255,.08);
}

/* =========================
   CHAT BODY
========================= */

.chat-body{
    position:relative;
    flex:1;
    min-height:0;
    margin-top:10px;
    border-radius:23px;
    overflow:hidden;
}

.chat-messages{
    height:100%;
    min-height:calc(100vh - 235px);
    max-height:calc(100vh - 235px);
    overflow-y:auto;
    padding:18px 12px 125px;
    display:flex;
    flex-direction:column;
    gap:7px;
    scroll-behavior:smooth;
}

.chat-messages::-webkit-scrollbar{
    width:4px;
}

.chat-messages::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

/* =========================
   MESSAGE
========================= */

.message-row{
    display:flex;
    width:100%;
    animation:messageIn .3s cubic-bezier(.2,.8,.2,1) both;
}

.message-row.mine{
    justify-content:flex-start;
}

.message-row.theirs{
    justify-content:flex-end;
}

.message-row.optimistic{
    opacity:.72;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(12px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.message-bubble{
    max-width:min(76%,600px);
    padding:9px 13px;
    border-radius:999px;
    position:relative;
    box-shadow:0 7px 25px rgba(0,0,0,.2);
}

.mine .message-bubble{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.07)
        );
    border:1px solid rgba(255,255,255,.1);
}

.theirs .message-bubble{
    background:
        linear-gradient(
            145deg,
            rgba(54,226,123,.13),
            rgba(255,255,255,.045)
        );
    border:1px solid rgba(54,226,123,.12);
}

.message-content{
    font-size:13px;
    line-height:1.5;
    color:#f0f0f0;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-time{
    margin-top:2px;
    color:#676767;
    font-size:8px;
    line-height:1;
    text-align:center;
    direction:ltr;
    user-select:none;
}

.message-row.highlight-message .message-bubble{
    animation:messageHighlight .9s ease;
}

@keyframes messageHighlight{
    0%,100%{
        box-shadow:0 7px 25px rgba(0,0,0,.2);
    }
    50%{
        box-shadow:
            0 0 0 3px rgba(54,226,123,.16),
            0 8px 30px rgba(54,226,123,.18);
    }
}

/* =========================
   SEARCH NAVIGATOR
========================= */

.search-match-navigator{
    position:absolute;
    z-index:95;
    left:12px;
    top:78px;
    display:none;
    align-items:center;
    gap:5px;
    padding:5px;
    border-radius:15px;
    background:rgba(10,10,10,.88);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.search-match-navigator.show{
    display:flex;
    animation:menuIn .2s ease;
}

.search-match-navigator button{
    width:31px;
    height:31px;
    border-radius:9px;
    color:#ddd;
    background:rgba(255,255,255,.06);
}

.search-match-navigator button:hover{
    background:rgba(255,255,255,.11);
}

.search-match-count{
    min-width:45px;
    color:#888;
    font-size:9px;
    text-align:center;
}

/* =========================
   TYPING
========================= */

.typing-indicator{
    position:absolute;
    right:13px;
    bottom:73px;
    z-index:75;
    display:none;
    align-items:center;
    gap:5px;
    width:max-content;
    padding:8px 11px;
    border-radius:15px;
    color:#888;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.typing-indicator.show{
    display:flex;
    animation:typingIn .18s ease;
}

@keyframes typingIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.typing-text{
    font-size:10px;
}

.typing-dots{
    display:flex;
    gap:3px;
}

.typing-dots i{
    width:4px;
    height:4px;
    border-radius:50%;
    background:#aaa;
    animation:typingDot 1s infinite;
}

.typing-dots i:nth-child(2){
    animation-delay:.15s;
}

.typing-dots i:nth-child(3){
    animation-delay:.3s;
}

@keyframes typingDot{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-3px);
        opacity:1;
    }
}

/* =========================
   COMPOSER
========================= */

.chat-composer{
    position:absolute;
    z-index:80;
    right:10px;
    left:10px;
    bottom:10px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:7px;
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.94),
            rgba(8,8,8,.91)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 15px 45px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    transform:translateY(calc(var(--keyboard-height) * -1));
    transition:transform .08s linear;
}

.message-input{
    flex:1;
    min-width:0;
    max-height:100px;
    min-height:43px;
    resize:none;
    outline:none;
    border:0;
    color:#fff;
    background:transparent;
    padding:11px 10px;
    line-height:1.5;
    font-size:13px;
}

.message-input::placeholder{
    color:#666;
}

.send-button{
    width:45px;
    height:43px;
    flex:0 0 45px;
    border-radius:14px;
    color:#000;
    background:#fff;
    font-size:17px;
    transition:.18s ease;
}

.send-button:hover{
    transform:translateY(-1px);
}

.send-button:active{
    transform:scale(.94);
}

.send-button.sending{
    animation:sendPulse .7s infinite;
}

@keyframes sendPulse{
    50%{
        opacity:.55;
        transform:scale(.94);
    }
}

/* =========================
   MODALS
========================= */

.modal-layer{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.modal-layer.show{
    display:flex;
}

.modal{
    width:min(430px,100%);
    padding:18px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            rgba(28,28,28,.95),
            rgba(8,8,8,.96)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:var(--shadow);
    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(8px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.modal h3{
    font-size:17px;
    margin-bottom:8px;
}

.modal p{
    color:#999;
    font-size:12px;
    line-height:1.7;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:17px;
}

.modal-actions button{
    flex:1;
    height:43px;
    border-radius:13px;
    color:#fff;

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(dateValue){

    if(!dateValue){
        return "";
    }

    const date =
        new Date(dateValue);

    if(Number.isNaN(date.getTime())){
        return "";
    }

    const now =
        new Date();

    if(date.toDateString() === now.toDateString()){

        return date.toLocaleTimeString(
            "ar-IQ",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }

    return date.toLocaleDateString(
        "ar-IQ",
        {
            day:"numeric",
            month:"short"
        }
    );
}

    if(

    if(

    try{

                .select("show_activity")

        activityEnabled =

        activityEnabled = true;

      تحديث الواجهة فوراً حتى لا يشعر المستخدم
      أن الزر متأخر.
    */

    const next =
        !activityEnabled;

    updateActivityUI(
        next,
        true
    );

    try{

        const {error} =
            await client
                .from("profiles")
                .update({
                    show_activity:next
                })
                .eq("id",currentUser.id);

        if(error){
            throw error;
        }

        await client.rpc(
            "set_my_presence",
            {
                online:next
            }
        );

    }catch(error){

        console.error(
            "toggleActivity",
            error
        );

        /*
          إذا فشل الحفظ نرجع الحالة السابقة.
        */

        updateActivityUI(
            !next,
            true
        );

        alert(
            "تعذر تحديث حالة النشاط."
        );
    }
}

    conversationList.innerHTML = "";

        conversationList.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">💬</div>

/* =====================================================
   UPDATE EXISTING CARD
===================================================== */

function updateConversationCard(
    card,
    conversation,
    contact
){

    card._contact =
        contact;

    card._conversation =
        conversation;

    const name =
        conversation.type === "support"
            ? SUPPORT_NAME
            : getDisplayName(contact);

    const preview =
        conversation.last_message ||
        "لا توجد رسائل بعد";

    const unread =
        Number(
            conversation.unread_count ||
            0
        );

    const online =
        contact.show_activity !== false &&
        contact.is_online === true;

    const nameNode =
        card.querySelector(
            ".conversation-name"
        );

    const timeNode =
        card.querySelector(
            ".conversation-time"
        );

    const previewNode =
        card.querySelector(
            ".conversation-preview > span"
        );

    const badge =
        card.querySelector(
            ".unread-badge"
        );

    const avatar =
        card.querySelector(
            ".avatar"
        );

    const dot =
        card.querySelector(
            ".online-dot"
        );

    if(nameNode){
        nameNode.textContent =
            name;
    }

    if(timeNode){
        timeNode.textContent =
            formatTime(
                conversation.last_message_at ||
                conversation.updated_at
            );
    }

    if(previewNode){
        previewNode.textContent =
            preview;
    }

    if(avatar){

        showImage(
            avatar,
            avatarUrl(contact)
        );
    }

    if(dot){

        dot.classList.toggle(
            "active",
            online
        );
    }

    if(
        unread > 0 &&
        !badge
    ){

        const newBadge =
            document.createElement("span");

        newBadge.className =
            "unread-badge";

        newBadge.textContent =
            unread > 99
                ? "99+"
                : String(unread);

        card
            .querySelector(".conversation-preview")
            ?.appendChild(
                newBadge
            );

    }else if(
        unread <= 0 &&
        badge
    ){

        badge.remove();

    }else if(badge){

        badge.textContent =
            unread > 99
                ? "99+"
                : String(unread);
    }
}


/* =====================================================
   CREATE CONVERSATION CARD
===================================================== */

async function createConversationCard(
    conversation
){

    const contact =
        await getConversationContact(
            conversation.conversation_id,
            conversation.type
        );

    if(!contact){
        return null;
    }

    const card =
        document.createElement("div");

    card.className =
        "conversation-card";

    card.dataset.conversationId =
        conversation.conversation_id;

    card._contact =
        contact;

    card._conversation =
        conversation;

    const online =
        contact.show_activity !== false &&
        contact.is_online === true;

    const unread =
        Number(
            conversation.unread_count ||
            0
        );

    const name =
        conversation.type === "support"
            ? SUPPORT_NAME
            : getDisplayName(contact);

    const preview =
        conversation.last_message ||
        "لا توجد رسائل بعد";

    card.innerHTML = `

        <div class="avatar-wrap">

            <img
                class="avatar"
                src="${escapeHtml(
                    avatarUrl(contact)
                )}"
                alt="">

            <span
                class="online-dot ${online ? "active" : ""}">
            </span>

        </div>

        <div class="conversation-info">

            <div class="conversation-top">

                <span class="conversation-name">
                    ${escapeHtml(name)}
                </span>

                <span class="conversation-time">
                    ${escapeHtml(
                        formatTime(
                            conversation.last_message_at ||
                            conversation.updated_at
                        )
                    )}
                </span>

            </div>

            <div class="conversation-preview">

                <span style="overflow:hidden;text-overflow:ellipsis;">
                    ${escapeHtml(preview)}
                </span>

                ${
                    unread > 0
                    ? `
                        <span class="unread-badge">
                            ${unread > 99 ? "99+" : unread}
                        </span>
                    `
                    : ""
                }

            </div>

        </div>

        <button
            type="button"
            class="card-menu"
            aria-label="خيارات">
            ⋮
        </button>
    `;

    const image =
        card.querySelector(".avatar");

    image.addEventListener(
        "error",
        function(){

            image.src =
                DEFAULT_AVATAR;
        }
    );

    const menuButton =
        card.querySelector(".card-menu");

    menuButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            openContextMenu(
                event,
                conversation.conversation_id
            );
        }
    );

    image.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            openProfile(
                contact.user_id
            );
        }
    );

    card.addEventListener(
        "click",
        function(){

            openConversation(
                conversation.conversation_id,
                contact,
                conversation.type
            );
        }
    );

    return card;
}


/* =====================================================
   SILENT LIST SYNC
   لا نمسح القائمة ولا نعيد الـAnimation
===================================================== */

async function syncConversationList(){

    if(
        page.classList.contains("chat-active") ||
        searchInput.value.trim()
    ){
        return;
    }

    const cards =
        new Map();

    conversationList
        .querySelectorAll(
            ".conversation-card"
        )
        .forEach(function(card){

            cards.set(
                card.dataset.conversationId,
                card
            );
        });

    const empty =
        conversationList.querySelector(
            ".empty-state"
        );

    if(empty){
        empty.remove();
    }

    if(!conversations.length){

        if(
            !conversationList.querySelector(
                ".empty-state"
            )
        ){

            conversationList.innerHTML = `
                <div class="empty-state glass">
                    <div class="empty-icon">💬</div>
                    <strong>لا توجد محادثات بعد</strong>
                    <p>
                        ابدأ محادثة جديدة من البحث عن المستخدمين.
                    </p>
                </div>
            `;
        }

        return;
    }

    for(
        const conversation of conversations
    ){

        let card =
            cards.get(
                conversation.conversation_id
            );

        const contact =
            await getConversationContact(
                conversation.conversation_id,
                conversation.type
            );

        if(!contact){
            continue;
        }

        if(!card){

            card =
                await createConversationCard(
                    conversation
                );

            if(!card){
                continue;
            }

            card.classList.add(
                "existing-card"
            );
        }else{

            updateConversationCard(
                card,
                conversation,
                contact
            );
        }

        /*
          appendChild لعنصر موجود ينقله فقط
          بدون إنشاء Animation أو Reset.
        */
        conversationList.appendChild(
            card
        );
    }

    conversationCount.textContent =
        String(conversations.length);
}

/* =====================================================
   MESSAGE ELEMENT
===================================================== */

function createMessageElement(
    message,
    isNew
){

    const mine =
        message.sender_id ===
        currentUser?.id;

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (mine ? "mine" : "theirs");

    if(isNew){

        row.classList.add(
            "message-new"
        );
    }

    if(message.optimistic){

        row.classList.add(
            "optimistic"
        );

        row.dataset.optimistic =
            "true";
    }

    row.dataset.messageId =
        message.message_id ||
        message.id ||
        "";

    const wrapper =
        document.createElement("div");

    wrapper.style.display =
        "flex";

    wrapper.style.flexDirection =
        "column";

    wrapper.style.alignItems =
        mine
            ? "flex-start"
            : "flex-end";

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        message.content || "";

    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.created_at
        );

    bubble.appendChild(
        content
    );

    wrapper.appendChild(
        bubble
    );

    /*
      الوقت عنصر منفصل خارج الفقاعة.
    */

    wrapper.appendChild(
        time
    );

    row.appendChild(
        wrapper
    );

    return row;
}


/* =====================================================

===================================================== */

function appendOptimisticMessage(
    content
){

    const empty =
        chatMessages.querySelector(
            ".empty-state"
        );

    if(empty){
        empty.remove();
    }

    const optimisticId =
        "temp-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2);

    const message = {

        message_id:
            optimisticId,

        id:
            optimisticId,

        conversation_id:
            currentConversationId,

        sender_id:
            currentUser.id,

        content:
            content,

        created_at:
            new Date().toISOString(),

        optimistic:true
    };

    const row =
        createMessageElement(
            message,
            true
        );

    row.dataset.optimisticContent =
        content;

    chatMessages.appendChild(
        row
    );

    requestAnimationFrame(
        function(){

            scrollChatToBottom(
                true
            );

        }
    );

    return {
        id:optimisticId,
        row:row
    };
}


/* =====================================================
   RECONCILE OPTIMISTIC
===================================================== */

function reconcileOptimisticMessage(
    realMessage
){

    const optimistic =
        Array.from(
            chatMessages.querySelectorAll(
                '.message-row[data-optimistic="true"]'
            )
        ).find(function(row){

            return (
                row.dataset.optimisticContent ===
                String(realMessage.content || "")
            );

        });

    if(!optimistic){

        const exists =
            currentMessages.some(
                item =>
                    (
                        item.message_id ||
                        item.id
                    ) ===
                    realMessage.id
            );

        if(!exists){

            currentMessages.push({
                message_id:
                    realMessage.id,
                id:
                    realMessage.id,
                conversation_id:
                    realMessage.conversation_id,
                sender_id:
                    realMessage.sender_id,
                content:
                    realMessage.content,
                created_at:
                    realMessage.created_at,
                edited_at:
                    realMessage.edited_at,
                deleted_at:
                    realMessage.deleted_at
            });

            currentMessages.sort(
                (a,b) =>
                    new Date(a.created_at) -
                    new Date(b.created_at)
            );

            const row =
                createMessageElement(
                    realMessage,
                    true
                );

            chatMessages.appendChild(
                row
            );
        }

        return;
    }

    optimistic.classList.remove(
        "optimistic"
    );

    optimistic.removeAttribute(
        "data-optimistic"
    );

    optimistic.dataset.messageId =
        realMessage.id;

    optimistic
        .querySelector(
            ".message-time"
        )
        .textContent =
        formatTime(
            realMessage.created_at
        );

    const index =
        currentMessages.findIndex(
            item =>
                item.optimistic === true &&
                item.content ===
                    realMessage.content
        );

    if(index >= 0){

        currentMessages[index] = {

            message_id:
                realMessage.id,

            id:
                realMessage.id,

            conversation_id:
                realMessage.conversation_id,

            sender_id:
                realMessage.sender_id,

            content:
                realMessage.content,

            created_at:
                realMessage.created_at,

            edited_at:
                realMessage.edited_at,

            deleted_at:
                realMessage.deleted_at
        };
    }
}


/* =====================================================
   APPEND INCOMING MESSAGE
===================================================== */

function appendIncomingMessage(
    message
){

    if(
        !message ||
        message.conversation_id !==
            currentConversationId
    ){
        return;
    }

    /*
      رسالتنا نحن:
      لا نتجاهلها، بل نستبدل الفقاعة المؤقتة.
    */

    if(
        message.sender_id ===
        currentUser?.id
    ){

        reconcileOptimisticMessage(
            message
        );

        scrollChatToBottom(
            true
        );

        return;
    }

    const exists =
        currentMessages.some(
            item =>
                (
                    item.message_id ||
                    item.id
                ) ===
                message.id
        );

    if(exists){
        return;
    }

    const empty =
        chatMessages.querySelector(
            ".empty-state"
        );

    if(empty){
        empty.remove();
    }

    const normalized = {

        message_id:
            message.id,

        id:
            message.id,

        conversation_id:
            message.conversation_id,

        sender_id:
            message.sender_id,

        content:
            message.content,

        created_at:
            message.created_at,

        edited_at:
            message.edited_at,

        deleted_at:
            message.deleted_at
    };

    currentMessages.push(
        normalized
    );

    currentMessages.sort(
        (a,b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
    );

    const row =
        createMessageElement(
            normalized,
            true
        );

    chatMessages.appendChild(
        row
    );

    scrollChatToBottom(
        true
    );

    markConversationRead();
}

async function sendCurrentMessage(){

    if(
        isSending ||
        !currentConversationId ||
        !currentUser
    ){
        return;
    }

    const content =
        messageInput.value.trim();

    if(!content){
        return;
    }

    /*
      الرسالة تظهر فوراً قبل انتظار Supabase.
    */

    const optimistic =
        appendOptimisticMessage(
            content
        );

    messageInput.value = "";

    autoResizeTextarea();

    isSending = true;

    sendButton.disabled = true;

    sendButton.classList.add(
        "sending"
    );

    const original =
        sendButton.textContent;

    sendButton.textContent =
        "…";

    try{

        const {data,error} =
            await client.rpc(
                "send_message",
                {
                    target_conversation_id:
                        currentConversationId,

                    message_content:
                        content
                }
            );

        if(error){
            throw error;
        }

        /*
          بعض نسخ RPC ترجع البيانات
          وبعضها لا ترجع شيئاً.
        */

        if(data){

            const message =
                Array.isArray(data)
                    ? data[0]
                    : data;

            if(message){

                reconcileOptimisticMessage({
                    ...message,

                    id:
                        message.id ||
                        message.message_id,

                    conversation_id:
                        currentConversationId,

                    sender_id:
                        currentUser.id,

                    content:
                        message.content ||
                        content,

                    created_at:
                        message.created_at ||
                        new Date().toISOString()
                });
            }
        }

        /*
          تأكيد الرسالة من قاعدة البيانات
          حتى إذا كان RPC لا يرجع الرسالة.
        */

        setTimeout(
            async function(){

                if(
                    !document.body.contains(
                        optimistic.row
                    )
                ){
                    return;
                }

                try{

                    const {data:rows,error:fetchError} =
                        await client.rpc(
                            "get_conversation_messages",
                            {
                                target_conversation_id:
                                    currentConversationId,
                                message_limit:20
                            }
                        );

                    if(fetchError){
                        throw fetchError;
                    }

                    const latest =
                        (rows || [])
                            .slice()
                            .reverse()
                            .find(
                                row =>
                                    row.sender_id ===
                                        currentUser.id &&
                                    row.content ===
                                        content
                            );

                    if(latest){

                        reconcileOptimisticMessage(
                            latest
                        );
                    }

                }catch(error){

                    console.warn(
                        "message confirmation",
                        error
                    );
                }

            },
            250
        );

        await stopTyping();

        /*
          تحديث القائمة بدون مسحها.
        */

        refreshConversationListSilently();

    }catch(error){

        console.error(
            "sendCurrentMessage",
            error
        );

        /*
          فشل الإرسال:
          نحذف الفقاعة المؤقتة فقط.
        */

        if(
            optimistic.row &&
            optimistic.row.parentNode
        ){

            optimistic.row.animate(
                [
                    {
                        opacity:1,
                        transform:"translateX(0)"
                    },
                    {
                        opacity:0,
                        transform:"translateX(-20px)"
                    }
                ],
                {
                    duration:180,
                    easing:"ease-in"
                }
            ).onfinish =
                function(){

                    optimistic.row.remove();

                };
        }

        messageInput.value =
            content;

        autoResizeTextarea();

        alert(
            error.message ||
            "تعذر إرسال الرسالة."
        );

    }finally{

        isSending = false;

        sendButton.disabled = false;

        sendButton.classList.remove(
            "sending"
        );

        sendButton.textContent =
            original;
    }
}

===================================================== */

function removeTypingRealtime(){

    if(typingChannel){

        try{

            client.removeChannel(
                typingChannel
            );

        }catch(error){}

        typingChannel = null;
    }

    typingIndicator.classList.remove(
        "show"
    );
}


function subscribeTypingRealtime(){

    removeTypingRealtime();

    if(!currentConversationId){
        return;
    }

    typingChannel =
        client
            .channel(
                "typing-" +
                currentConversationId +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"typing_status",
                    filter:
                        "conversation_id=eq." +
                        currentConversationId
                },
                function(payload){

                    const row =
                        payload.new;

                    if(
                        !row ||
                        row.user_id ===
                            currentUser?.id
                    ){
                        return;
                    }

                    typingIndicator.classList.toggle(
                        "show",
                        row.is_typing === true
                    );

                }
            )
            .subscribe();

    clearInterval(
        typingCleanupTimer
    );

    typingCleanupTimer =
        setInterval(
            function(){

                client.rpc(
                    "cleanup_stale_typing_status"
                ).catch(
                    () => {}
                );

            },
            5000
        );
}

}


function subscribePresenceRealtime(){

    removePresenceRealtime();

    if(!currentConversationContact?.user_id){
        return;
    }

    const targetId =
        currentConversationContact.user_id;

    presenceChannel =
        client
            .channel(
                "presence-" +
                targetId +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"user_presence",
                    filter:
                        "user_id=eq." +
                        targetId
                },
                function(payload){

                    const row =
                        payload.new;

                    if(!row){
                        return;
                    }

                    const active =
                        row.show_activity === true &&
                        row.is_online === true;

                    currentConversationContact.is_online =
                        active;

                    currentConversationContact.show_activity =
                        row.show_activity === true;

                    chatOnlineDot.classList.toggle(
                        "active",
                        active
                    );

                    chatStatus.textContent =
                        active
                            ? "نشط الآن"
                            : "غير نشط";

                }
            )
            .subscribe();
}

async function searchMessages(text){

    if(!currentUser){
        return;
    }

    mainList.style.display =
        "none";

    searchResults.classList.add(
        "visible"
    );

    setLoading(
        searchResults,
        "جاري البحث"
    );

    try{

        const {data,error} =
            await client.rpc(
                "search_messages",
                {
                    search_text:text
                }
            );

        if(error){
            throw error;
        }

        searchResults.innerHTML = "";

        const rows =
            Array.isArray(data)
                ? data
                : [];

        if(!rows.length){

            searchResults.innerHTML = `
                <div class="empty-state glass">
                    <div class="empty-icon">🔎</div>
                    <strong>لا توجد نتائج</strong>
                    <p>
                        لم يتم العثور على هذه الكلمة في محادثاتك.
                    </p>
                </div>
            `;

            return;
        }

        const grouped =
            new Map();

        rows.forEach(function(row){

            if(
                !grouped.has(
                    row.conversation_id
                )
            ){

                grouped.set(
                    row.conversation_id,
                    []
                );
            }

            grouped
                .get(
                    row.conversation_id
                )
                .push(row);

        });

        let index = 0;

        for(
            const [
                conversationId,
                matches
            ] of grouped
        ){

            let contact = null;

            let conversationType =
                "direct";

            try{

                const result =
                    await client.rpc(
                        "get_conversation_contacts",
                        {
                            target_conversation_id:
                                conversationId
                        }
                    );

                contact =
                    Array.isArray(result.data)
                        ? result.data[0]
                        : result.data;

            }catch(error){}

            if(!contact){
                continue;
            }

            const conversation =
                conversations.find(
                    item =>
                        item.conversation_id ===
                        conversationId
                );

            if(
                conversation?.type ===
                "support"
            ){

                conversationType =
                    "support";

                contact = {
                    ...contact,
                    is_support:true,
                    display_name:
                        SUPPORT_NAME,
                    avatar_url:
                        SUPPORT_AVATAR
                };
            }

            const first =
                matches[0];

            const result =
                document.createElement("div");

            result.className =
                "search-result";

            result.style.animationDelay =
                Math.min(index * 55,600) +
                "ms";

            result.innerHTML = `

                <div class="avatar-wrap">

                    <img
                        class="avatar"
                        src="${escapeHtml(
                            avatarUrl(contact)
                        )}"
                        alt="">

                </div>

                <div class="result-info">

                    <div class="result-name">
                        ${escapeHtml(
                            getDisplayName(contact)
                        )}
                    </div>

                    <div class="result-preview">
                        ${escapeHtml(
                            first.content
                        )}
                    </div>

                </div>

                <div class="match-count">
                    ${matches.length} تطابق
                </div>
            `;

            const img =
                result.querySelector(
                    "img"
                );

            img.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    openProfile(
                        contact.user_id
                    );

                }
            );

            result.addEventListener(
                "click",
                async function(){

                    await openConversation(
                        conversationId,
                        contact,
                        conversationType
                    );

                    /*
                      بعد فتح المحادثة نحدد كل الرسائل
                      التي تحتوي على البحث نفسه.
                    */

                    setTimeout(
                        function(){

                            setSearchMatches(
                                text
                            );

                        },
                        150
                    );

                }
            );

            searchResults.appendChild(
                result
            );

            index++;
        }

    }catch(error){

        console.error(
            "searchMessages",
            error
        );

        searchResults.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">⚠️</div>
                <strong>تعذر البحث</strong>
                <p>
                    ${escapeHtml(error.message || "")}
                </p>
            </div>
        `;
    }
}


/* =====================================================
   SEARCH USERS
===================================================== */

async function searchUsers(text){

    if(!currentUser){
        return;
    }

    mainList.style.display =
        "none";

    searchResults.classList.add(
        "visible"
    );

    setLoading(
        searchResults,
        "جاري البحث عن المستخدمين"
    );

    try{

        /*
          RPC يدعم البحث بالـILIKE.
          نرسل النص كما كتبه المستخدم، لذلك
          العربي يعمل أيضاً.
        */

        const {data,error} =
            await client.rpc(
                "search_users",
                {
                    search_text:text
                }
            );

        if(error){
            throw error;
        }

        let rows =
            Array.isArray(data)
                ? data
                : [];

        /*
          حماية إضافية من اختلاف التطابق العربي.
        */

        const normalizedQuery =
            normalizeArabic(text);

        rows =
            rows.filter(function(user){

                const display =
                    normalizeArabic(
                        user.display_name || ""
                    );

                const username =
                    normalizeArabic(
                        user.username || ""
                    );

                return (
                    display.includes(
                        normalizedQuery
                    ) ||
                    username.includes(
                        normalizedQuery
                    )
                );

            });

        searchResults.innerHTML = "";

        if(!rows.length){

            searchResults.innerHTML = `
                <div class="empty-state glass">
                    <div class="empty-icon">👤</div>
                    <strong>لا يوجد مستخدم</strong>
                    <p>
                        جرّب الاسم أو اسم المستخدم.
                    </p>
                </div>
            `;

            return;
        }

        rows.forEach(
            function(user,index){

                const item =
                    document.createElement("div");

                item.className =
                    "search-result";

                item.style.animationDelay =
                    Math.min(index * 55,600) +
                    "ms";

                const displayName =
                    user.display_name &&
                    String(
                        user.display_name
                    ).trim()
                        ? user.display_name
                        : "بدون اسم";

                item.innerHTML = `

                    <div class="avatar-wrap">

                        <img
                            class="avatar"
                            src="${escapeHtml(
                                user.avatar_url ||
                                DEFAULT_AVATAR
                            )}"
                            alt="">

                    </div>

                    <div class="result-info">

                        <div class="result-name">
                            ${escapeHtml(
                                displayName
                            )}
                        </div>

                        <div class="result-preview result-username">
                            ${
                                user.username
                                    ? "@" +
                                      escapeHtml(
                                          user.username
                                      )
                                    : ""
                            }
                        </div>

                    </div>
                `;

                const img =
                    item.querySelector(
                        "img"
                    );

                img.addEventListener(
                    "click",
                    function(event){

                        event.stopPropagation();

                        openProfile(
                            user.user_id
                        );

                    }
                );

                item.addEventListener(
                    "click",
                    async function(){

                        try{

                            const {data,error} =
                                await client.rpc(
                                    "get_or_create_direct_conversation",
                                    {
                                        target_user_id:
                                            user.user_id
                                    }
                                );

                            if(error){
                                throw error;
                            }

                            await openConversation(
                                data,
                                user,
                                "direct"
                            );

                        }catch(error){

                            console.error(
                                error
                            );

                            alert(
                                error.message ||
                                "تعذر فتح المحادثة."
                            );
                        }

                    }
                );

                searchResults.appendChild(
                    item
                );
            }
        );

    }catch(error){

        console.error(
            "searchUsers",
            error
        );

        searchResults.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">⚠️</div>
                <strong>تعذر البحث</strong>
                <p>
                    ${escapeHtml(error.message || "")}
                </p>
            </div>
        `;
    }
}


/* =====================================================
   SEARCH MATCHES
===================================================== */

function setSearchMatches(
    query
){

    const wanted =
        normalizeArabic(query);

    searchMatches =
        Array.from(
            chatMessages.querySelectorAll(
                ".message-row"
            )
        ).filter(function(row){

            const content =
                row.querySelector(
                    ".message-content"
                );

            return (
                content &&
                normalizeArabic(
                    content.textContent
                ).includes(
                    wanted
                )
            );

        });

    searchMatchIndex =
        searchMatches.length
            ? 0
            : -1;

    if(
        searchMatches.length
    ){

        searchMatchNavigator.classList.add(
            "show"
        );

        updateSearchMatchCounter();

        scrollToSearchMatch();

    }else{

        searchMatchNavigator.classList.remove(
            "show"
        );
    }
}


function updateSearchMatchCounter(){

    if(
        searchMatchIndex < 0 ||
        !searchMatches.length
    ){

        searchMatchCount.textContent =
            "0 / 0";

        return;
    }

    searchMatchCount.textContent =
        (
            searchMatchIndex + 1
        ) +
        " / " +
        searchMatches.length;
}


function scrollToSearchMatch(){

    if(
        searchMatchIndex < 0 ||
        !searchMatches.length
    ){
        return;
    }

    searchMatches.forEach(
        row =>
            row.classList.remove(
                "highlight-message"
            )
    );

    const row =
        searchMatches[
            searchMatchIndex
        ];

    if(!row){
        return;
    }

    row.classList.add(
        "highlight-message"
    );

    row.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    updateSearchMatchCounter();
}


function moveSearchMatch(
    direction
){

    if(!searchMatches.length){
        return;
    }

    searchMatchIndex +=
        direction;

    if(
        searchMatchIndex >=
        searchMatches.length
    ){

        searchMatchIndex = 0;

    }else if(
        searchMatchIndex < 0
    ){

        searchMatchIndex =
            searchMatches.length - 1;
    }

    scrollToSearchMatch();
}

/* =====================================================
   MUTE
===================================================== */

document.getElementById(
    "muteConversationButton"
).addEventListener(
    "click",
    async function(){

        const id =
            contextConversationId;

        closeContextMenu();

        if(!id || !currentUser){
            return;
        }

        try{

            const {data,error} =
                await client
                    .from(
                        "notification_settings"
                    )
                    .select("muted")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "conversation_id",
                        id
                    )
                    .maybeSingle();

            if(error){
                throw error;
            }

            const muted =
                !(data?.muted === true);

            const result =
                await client
                    .from(
                        "notification_settings"
                    )
                    .upsert({
                        user_id:
                            currentUser.id,

                        conversation_id:
                            id,

                        muted:

                            muted,

                        updated_at:
                            new Date().toISOString()

                    },{
                        onConflict:
                            "user_id,conversation_id"
                    });

            if(result.error){
                throw result.error;
            }

            /*
              أيضاً نحفظها في عضوية المحادثة.
            */

            await client
                .from(
                    "conversation_members"
                )
                .update({
                    muted:muted
                })
                .eq(

/* =====================================================
   NOTIFICATION HELPERS
===================================================== */

function notificationIcon(
    type
){

    const icons = {

        message:"💬",

        profile_visit:"👤",

        comment:"💬",

        like:"❤️",

        follow:"➕",

        friend:"🤝",

        system:"🔔",

        default:"🔔"
    };

    return (
        icons[type] ||
        icons.default
    );
}


function updateNotificationBadge(
    rows
){

    const unread =
        rows.filter(
            row =>
                !row.is_read
        ).length;

    if(unread > 0){

        notificationBadge.textContent =
            unread > 99
                ? "99+"
                : String(unread);

        notificationBadge.classList.add(
            "show"
        );

    }else{

        notificationBadge.classList.remove(
            "show"
        );
    }
}


/* =====================================================
   LOAD NOTIFICATIONS
===================================================== */

async function loadNotifications(){

    if(!currentUser){
        return;
    }

    try{

        const {data,error} =
            await client
                .from("notifications")
                .select(
                    "id,actor_id,type,message,is_read,created_at,conversation_id"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                )
                .limit(50);

        if(error){
            throw error;
        }

        notificationsRows =
            Array.isArray(data)
                ? data
                : [];

        updateNotificationBadge(
            notificationsRows
        );

        renderNotifications(
            notificationsRows
        );

    }catch(error){

        console.error(
            "notifications",
            error
        );
    }
}


/* =====================================================
   RENDER NOTIFICATIONS
===================================================== */

function renderNotifications(
    rows
){

    notificationsList.innerHTML = "";

    if(!rows.length){

        notificationsList.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🔔</div>
                <strong>لا توجد إشعارات</strong>
                <p>
                    لا توجد إشعارات جديدة حالياً.
                </p>
            </div>
        `;

        return;
    }

    rows.forEach(
        function(row,index){

            const item =
                document.createElement("div");

            item.className =
                "notification-item " +
                (
                    row.is_read
                        ? ""
                        : "unread"
                );

            item.style.animation =
                "conversationIn .28s ease both";

            item.style.animationDelay =
                Math.min(
                    index * 35,
                    400
                ) + "ms";

            item.innerHTML = `

                <div class="notification-icon">
                    ${notificationIcon(row.type)}
                </div>

                <div class="notification-content">

                    ${escapeHtml(
                        row.message
                    )}

                    <span class="notification-time">
                        ${escapeHtml(
                            formatTime(
                                row.created_at
                            )
                        )}
                    </span>

                </div>

                <button
                    type="button"
                    class="notification-delete"
                    aria-label="حذف">
                    ×
                </button>
            `;

            item.querySelector(
                ".notification-delete"
            ).addEventListener(
                "click",
                async function(event){

                    event.stopPropagation();

                    try{

                        await client.rpc(
                            "delete_my_notification",
                            {
                                target_notification_id:
                                    row.id
                            }
                        );

                        notificationsRows =
                            notificationsRows.filter(
                                item =>
                                    item.id !==
                                    row.id
                            );

                        item.remove();

                        updateNotificationBadge(
                            notificationsRows
                        );

                    }catch(error){

                        console.error(
                            error
                        );
                    }

                }
            );

            item.addEventListener(
                "click",
                async function(){

                    if(!row.is_read){

                        await client.rpc(
                            "mark_notification_read",
                            {
                                target_notification_id:
                                    row.id
                            }
                        );

                        row.is_read =
                            true;

                        item.classList.remove(
                            "unread"
                        );

                        updateNotificationBadge(
                            notificationsRows
                        );
                    }

                    /*
                      إشعار رسالة:
                      نفتح المحادثة مباشرة.
                    */

                    if(
                        row.conversation_id
                    ){

                        try{

                            const conversation =
                                conversations.find(
                                    item =>
                                        item.conversation_id ===
                                        row.conversation_id
                                );

                            const contact =
                                await getConversationContact(
                                    row.conversation_id,
                                    conversation?.type
                                );

                            if(contact){

                                notificationsPanel.classList.remove(
                                    "show"
                                );

                                await openConversation(
                                    row.conversation_id,
                                    contact,
                                    conversation?.type ||
                                    "direct"
                                );
                            }

                        }catch(error){

                            console.error(
                                "notification conversation",
                                error
                            );
                        }

                    }else if(
                        row.actor_id
                    ){

                        /*
                          الإشعارات المستقبلية مثل:
                          زيارة الملف، تعليق، متابعة...
                        */

                        openProfile(
                            row.actor_id
                        );
                    }

                }
            );

            notificationsList.appendChild(
                item
            );
        }
    );
}

/* =====================================================
   REALTIME NOTIFICATIONS
===================================================== */

function subscribeNotifications(){

    if(notificationChannel){

        try{

            client.removeChannel(
                notificationChannel
            );

        }catch(error){}
    }

    if(!currentUser){
        return;
    }

    notificationChannel =
        client
            .channel(
                "notifications-" +
                currentUser.id +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                function(){

                    loadNotifications();

                }
            )
            .subscribe();
}


/* =====================================================

===================================================== */

async function openSupport(){

    if(!currentUser){
        return;
    }

    try{

        const supportId =
            await ensureSupportConversation();

        if(!supportId){
            throw new Error(
                "تعذر إنشاء محادثة الدعم."
            );
        }

        const contact =
            await getConversationContact(
                supportId,
                "support"
            );

        if(contact){

            await openConversation(
                supportId,
                contact,
                "support"
            );
        }

    }catch(error){

        console.error(
            "support",
            error
        );

        alert(
            error.message ||
            "تعذر فتح دعم WFESC."
        );
    }
}


/* =====================================================
   CHAT NOTIFICATION BUTTON
===================================================== */

document.getElementById(
    "chatNotificationButton"
).addEventListener(
    "click",
    async function(){

        if(
            !currentConversationId ||
            !currentUser
        ){
            return;
        }

        /*
          زر سريع لكتم/إلغاء كتم المحادثة.
        */

        try{

            const {data,error} =
                await client
                    .from(
                        "notification_settings"
                    )
                    .select("muted")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "conversation_id",
                        currentConversationId
                    )
                    .maybeSingle();

            if(error){
                throw error;
            }

            const muted =
                !(data?.muted === true);

            const result =
                await client
                    .from(
                        "notification_settings"
                    )
                    .upsert({
                        user_id:
                            currentUser.id,

                        conversation_id:
                            currentConversationId,

                        muted:
                            muted,

                        updated_at:
                            new Date().toISOString()

                    },{
                        onConflict:
                            "user_id,conversation_id"
                    });

            if(result.error){
                throw result.error;
            }

        }catch(error){

            console.error(
                "chat notification",
                error
            );
        }
    }
);

/* =====================================================
   KEYBOARD / VISUAL VIEWPORT
===================================================== */

function updateKeyboardPosition(){

    if(!window.visualViewport){
        return;
    }

    const viewport =
        window.visualViewport;

    /*
      نحسب ارتفاع الكيبورد فقط.
      لا نغيّر navigation هنا.
      حقل الإرسال وحده يتحرك.
    */

    const keyboardHeight =
        Math.max(
            0,
            window.innerHeight -
            viewport.height -
            Math.max(
                0,
                viewport.offsetTop
            )
        );

    const meaningfulKeyboard =
        keyboardHeight > 80
            ? keyboardHeight
            : 0;

    document.documentElement.style
        .setProperty(
            "--keyboard-height",
            meaningfulKeyboard +
            "px"
        );
}


if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        updateKeyboardPosition
    );

    window.visualViewport.addEventListener(
        "scroll",
        updateKeyboardPosition
    );
}

window.addEventListener(
    "resize",
    updateKeyboardPosition
);

updateKeyboardPosition();


/* =====================================================
   AUTH STATE
===================================================== */

function subscribeAuth(){

    client.auth.onAuthStateChange(
        async function(
            event,
            session
        ){

            currentUser =
                session?.user ||
                null;

            if(!currentUser){

                page.classList.remove(
                    "chat-active"
                );

                chatView.classList.remove(
                    "open"
                );

                currentConversationId =
                    null;

                currentConversationContact =
                    null;

                removeMessageRealtime();

                removeTypingRealtime();

                removePresenceRealtime();

                updateActivityUI(
                    false,
                    true
                );

                notificationsRows =
                    [];

                updateNotificationBadge(
                    []
                );

                await loadConversations();

                return;
            }

            await loadActivity();

            await ensureSupportConversation();

            await loadConversations();

            await loadNotifications();

            subscribeNotifications();

        }
    );
}

   VISIBILITY
===================================================== */

        if(
            document.visibilityState ===
            "visible"
        ){

            if(currentUser){

        }else{

            if(currentUser){

                try{

                    await client.rpc(

                }catch(error){}
            }

    }
);

                    online:false
                }
            ).catch(

);


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

    if(initialized){
        return;
    }

    initialized = true;

    currentUser =
        await getSession();

    if(currentUser){

        await loadActivity();

        /*
          إنشاء الدعم فوراً بعد وجود جلسة.
          هذا يجعل محادثة الدعم تظهر بالقائمة.
        */

        await ensureSupportConversation();

        await loadConversations();

        await loadNotifications();

        subscribeNotifications();

    }else{

        await loadConversations();
    }

    subscribeAuth();

    updateKeyboardPosition();
}


/* =====================================================
   START
===================================================== */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initialize,
        {
            once:true
        }
    );

}else{

    initialize();

}
