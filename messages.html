<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>الرسائل | WFESC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

:root{
    --bg:#030303;
    --glass:rgba(255,255,255,.055);
    --glass-2:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.11);
    --border-light:rgba(255,255,255,.17);
    --text:#f5f5f5;
    --muted:#929292;
    --green:#36e27b;
    --green-soft:rgba(54,226,123,.14);
    --danger:#ff5252;
    --shadow:0 20px 70px rgba(0,0,0,.55);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%,rgba(255,255,255,.055),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(90,90,90,.08),transparent 25%),
        linear-gradient(180deg,#050505 0%,#020202 100%);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
    overflow-x:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

/* =========================
   MAIN
========================= */

.messages-page{
    width:100%;
    max-width:980px;
    margin:auto;
    min-height:100vh;
    padding:20px 14px 125px;
    position:relative;
}

/* =========================
   TOP HEADER
========================= */

.top-header{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.title-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.title-icon{
    width:48px;
    height:48px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 12px 35px rgba(0,0,0,.3);
    font-size:22px;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

.title-text h1{
    font-size:23px;
    font-weight:800;
    letter-spacing:-.4px;
}

.title-text p{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.activity-button{
    display:flex;
    align-items:center;
    gap:7px;
    min-height:40px;
    padding:0 13px;
    color:#ddd;
    border-radius:14px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    transition:.2s ease;
}

.activity-button:hover{
    background:rgba(255,255,255,.08);
}

.activity-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#666;
    box-shadow:none;
    transition:.25s ease;
}

.activity-dot.active{
    background:var(--green);
    box-shadow:0 0 12px rgba(54,226,123,.75);
}

/* =========================
   GLASS
========================= */

.glass{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 18px 60px rgba(0,0,0,.38);
    backdrop-filter:blur(28px) saturate(130%);
    -webkit-backdrop-filter:blur(28px) saturate(130%);
}

/* =========================
   SEARCH
========================= */

.search-section{
    position:relative;
    z-index:15;
    margin-bottom:15px;
}

.search-box{
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px;
    border-radius:19px;
}

.search-icon{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:17px;
}

.search-input{
    flex:1;
    min-width:0;
    height:42px;
    border:0;
    outline:0;
    color:#fff;
    background:transparent;
    font-size:14px;
}

.search-input::placeholder{
    color:#777;
}

.search-mode{
    display:flex;
    gap:5px;
    padding:4px;
    border-radius:14px;
    background:rgba(0,0,0,.24);
    border:1px solid rgba(255,255,255,.055);
}

.search-mode button{
    color:#888;
    background:transparent;
    padding:8px 11px;
    border-radius:10px;
    font-size:11px;
    transition:.2s ease;
}

.search-mode button.active{
    color:#fff;
    background:rgba(255,255,255,.1);
}

/* =========================
   LIST
========================= */

.main-list{
    position:relative;
    z-index:5;
}

.list-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:12px 4px 10px;
}

.list-title strong{
    font-size:14px;
}

.list-title span{
    color:#777;
    font-size:11px;
}

.conversation-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.conversation-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:13px;
    min-height:76px;
    color:#fff;
    text-align:right;
    border-radius:20px;
    overflow:hidden;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    border:1px solid var(--border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 12px 38px rgba(0,0,0,.28);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    opacity:0;
    transform:translateY(13px);
    animation:conversationIn .42s cubic-bezier(.2,.8,.2,1) forwards;
    transition:.22s ease;
}

.conversation-card:hover{
    transform:translateY(-2px);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.1),
            rgba(255,255,255,.035)
        );
}

@keyframes conversationIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar-wrap{
    position:relative;
    width:50px;
    height:50px;
    flex:0 0 50px;
}

.avatar{
    width:100%;
    height:100%;
    border-radius:16px;
    object-fit:cover;
    background:#101010;
    border:1px solid rgba(255,255,255,.1);
}

.avatar-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    border-radius:16px;
    background:
        linear-gradient(145deg,#1d1d1d,#090909);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    font-weight:800;
}

.online-dot{
    position:absolute;
    left:-2px;
    bottom:-2px;
    width:12px;
    height:12px;
    border-radius:50%;
    border:2px solid #080808;
    background:#555;
}

.online-dot.active{
    background:var(--green);
    box-shadow:0 0 10px rgba(54,226,123,.65);
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:#777;
    font-size:10px;
    white-space:nowrap;
}

.conversation-preview{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
    color:#8c8c8c;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-badge{
    min-width:19px;
    height:19px;
    padding:0 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-size:10px;
    font-weight:800;
}

.card-menu{
    width:32px;
    height:35px;
    border-radius:11px;
    color:#777;
    background:transparent;
    font-size:19px;
}

.card-menu:hover{
    color:#fff;
    background:rgba(255,255,255,.07);
}

/* =========================
   EMPTY / LOGIN
========================= */

.empty-state{
    padding:40px 20px;
    border-radius:22px;
    text-align:center;
    color:#888;
}

.empty-icon{
    font-size:35px;
    margin-bottom:12px;
}

.empty-state strong{
    display:block;
    color:#ddd;
    margin-bottom:7px;
}

.empty-state p{
    font-size:12px;
    line-height:1.7;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
    display:none;
    flex-direction:column;
    gap:9px;
}

.search-results.visible{
    display:flex;
}

.search-result{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px;
    min-height:70px;
    border-radius:19px;
    color:#fff;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    animation:conversationIn .35s ease both;
}

.result-info{
    min-width:0;
    flex:1;
}

.result-name{
    font-size:13px;
    font-weight:700;
}

.result-preview{
    margin-top:6px;
    color:#8b8b8b;
    font-size:11px;
    line-height:1.5;
    overflow:hidden;
}

.match-count{
    padding:5px 8px;
    border-radius:10px;
    color:#bbb;
    background:rgba(255,255,255,.06);
    font-size:10px;
}

/* =========================
   FULL CHAT
========================= */

.chat-view{
    position:relative;
    z-index:30;
    display:none;
    min-height:calc(100vh - 30px);
    flex-direction:column;
    animation:chatOpen .28s ease both;
}

.chat-view.open{
    display:flex;
}

@keyframes chatOpen{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.messages-page.chat-active .top-header,
.messages-page.chat-active .search-section,
.messages-page.chat-active .main-list,
.messages-page.chat-active .search-results{
    display:none;
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
    position:relative;
    z-index:50;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:67px;
    padding:8px;
    border-radius:21px;
    flex:0 0 auto;
}

.back-button{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border-radius:14px;
    color:#fff;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.09);
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chat-person{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    cursor:pointer;
}

.chat-avatar-wrap{
    position:relative;
    width:43px;
    height:43px;
    flex:0 0 43px;
}

.chat-person-info{
    min-width:0;
}

.chat-person-name{
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-person-status{
    margin-top:4px;
    color:#777;
    font-size:10px;
}

.chat-actions{
    display:flex;
    gap:5px;
}

.chat-action{
    width:40px;
    height:40px;
    border-radius:13px;
    color:#aaa;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.065);
    font-size:16px;
}

.chat-action:hover{
    color:#fff;
    background:rgba(255,255,255,.08);
}

/* =========================
   CHAT BODY
========================= */

.chat-body{
    position:relative;
    flex:1;
    min-height:0;
    margin-top:10px;
    border-radius:23px;
    overflow:hidden;
}

.chat-messages{
    height:100%;
    min-height:calc(100vh - 235px);
    max-height:calc(100vh - 235px);
    overflow-y:auto;
    padding:18px 12px 110px;
    display:flex;
    flex-direction:column;
    gap:8px;
    scroll-behavior:smooth;
}

.chat-messages::-webkit-scrollbar{
    width:4px;
}

.chat-messages::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

/* =========================
   MESSAGE
========================= */

.message-row{
    display:flex;
    width:100%;
    animation:messageIn .3s cubic-bezier(.2,.8,.2,1) both;
}

.message-row.mine{
    justify-content:flex-start;
}

.message-row.theirs{
    justify-content:flex-end;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(12px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.message-bubble{
    max-width:min(76%,600px);
    padding:10px 13px 8px;
    border-radius:18px;
    position:relative;
    box-shadow:0 7px 25px rgba(0,0,0,.2);
}

.mine .message-bubble{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.07)
        );
    border:1px solid rgba(255,255,255,.1);
    border-bottom-right-radius:6px;
}

.theirs .message-bubble{
    background:
        linear-gradient(
            145deg,
            rgba(54,226,123,.13),
            rgba(255,255,255,.045)
        );
    border:1px solid rgba(54,226,123,.12);
    border-bottom-left-radius:6px;
}

.message-content{
    font-size:13px;
    line-height:1.65;
    color:#f0f0f0;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-time{
    margin-top:4px;
    color:#777;
    font-size:9px;
    text-align:left;
}

/* =========================
   TYPING
========================= */

.typing-indicator{
    display:none;
    align-items:center;
    gap:5px;
    width:max-content;
    padding:9px 12px;
    margin:0 7px 8px;
    border-radius:15px;
    color:#888;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
}

.typing-indicator.show{
    display:flex;
}

.typing-text{
    font-size:10px;
}

.typing-dots{
    display:flex;
    gap:3px;
}

.typing-dots i{
    width:4px;
    height:4px;
    border-radius:50%;
    background:#aaa;
    animation:typingDot 1s infinite;
}

.typing-dots i:nth-child(2){
    animation-delay:.15s;
}

.typing-dots i:nth-child(3){
    animation-delay:.3s;
}

@keyframes typingDot{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-3px);
        opacity:1;
    }
}

/* =========================
   COMPOSER
========================= */

.chat-composer{
    position:absolute;
    z-index:80;
    right:10px;
    left:10px;
    bottom:10px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:7px;
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.94),
            rgba(8,8,8,.91)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 15px 45px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
}

.message-input{
    flex:1;
    min-width:0;
    max-height:100px;
    min-height:43px;
    resize:none;
    outline:none;
    border:0;
    color:#fff;
    background:transparent;
    padding:11px 10px;
    line-height:1.5;
    font-size:13px;
}

.message-input::placeholder{
    color:#666;
}

.send-button{
    width:45px;
    height:43px;
    flex:0 0 45px;
    border-radius:14px;
    color:#000;
    background:#fff;
    font-size:17px;
    transition:.18s ease;
}

.send-button:hover{
    transform:translateY(-1px);
}

.send-button:active{
    transform:scale(.94);
}

/*
  مساحة حماية من شريط التنقل الذي يحقنه navigation-loader
*/
.chat-view{
    padding-bottom:92px;
}

/* =========================
   MODALS
========================= */

.modal-layer{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.modal-layer.show{
    display:flex;
}

.modal{
    width:min(430px,100%);
    padding:18px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            rgba(28,28,28,.95),
            rgba(8,8,8,.96)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:var(--shadow);
    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(8px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.modal h3{
    font-size:17px;
    margin-bottom:8px;
}

.modal p{
    color:#999;
    font-size:12px;
    line-height:1.7;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:17px;
}

.modal-actions button{
    flex:1;
    height:43px;
    border-radius:13px;
    color:#fff;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
}

.modal-actions .danger{
    background:rgba(255,82,82,.12);
    color:#ff7777;
    border-color:rgba(255,82,82,.16);
}

/* =========================
   ACTIVITY
========================= */

.activity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px;
    margin-top:14px;
    border-radius:17px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
}

.activity-info strong{
    display:block;
    font-size:13px;
}

.activity-info span{
    display:block;
    color:#777;
    font-size:10px;
    margin-top:4px;
}

.switch{
    position:relative;
    width:48px;
    height:27px;
    border-radius:20px;
    background:#303030;
    transition:.2s;
}

.switch::after{
    content:"";
    position:absolute;
    top:4px;
    right:4px;
    width:19px;
    height:19px;
    border-radius:50%;
    background:#888;
    transition:.2s;
}

.switch.on{
    background:rgba(54,226,123,.28);
}

.switch.on::after{
    right:25px;
    background:var(--green);
}

/* =========================
   CONTEXT MENU
========================= */

.context-menu{
    position:fixed;
    z-index:10000;
    display:none;
    width:205px;
    padding:7px;
    border-radius:17px;
    background:rgba(20,20,20,.96);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 18px 50px rgba(0,0,0,.65);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.context-menu.show{
    display:block;
    animation:menuIn .18s ease;
}

@keyframes menuIn{
    from{
        opacity:0;
        transform:scale(.96);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.context-menu button{
    display:block;
    width:100%;
    padding:11px;
    text-align:right;
    color:#ddd;
    background:transparent;
    border-radius:11px;
    font-size:12px;
}

.context-menu button:hover{
    background:rgba(255,255,255,.07);
}

.context-menu button.danger{
    color:#ff6b6b;
}

/* =========================
   NOTIFICATIONS
========================= */

.notifications-panel{
    position:fixed;
    z-index:9000;
    top:15px;
    left:15px;
    width:min(390px,calc(100% - 30px));
    max-height:75vh;
    overflow:auto;
    display:none;
    padding:12px;
    border-radius:23px;
    background:rgba(16,16,16,.96);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 70px rgba(0,0,0,.7);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
}

.notifications-panel.show{
    display:block;
    animation:menuIn .22s ease;
}

.notifications-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 5px 12px;
}

.notifications-head strong{
    font-size:14px;
}

.notifications-head button{
    color:#888;
    background:transparent;
    font-size:11px;
}

.notification-item{
    display:flex;
    gap:9px;
    padding:11px;
    border-radius:15px;
    background:rgba(255,255,255,.04);
    margin-bottom:7px;
    border:1px solid rgba(255,255,255,.05);
}

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(dateValue){

    if(!dateValue){
        return "";
    }

    const date =
        new Date(dateValue);

    if(Number.isNaN(date.getTime())){
        return "";
    }

    const now =
        new Date();

    const diff =
        now.getTime() - date.getTime();

    if(diff < 60000){
        return "الآن";
    }

    if(diff < 3600000){
        return Math.floor(diff / 60000) + " د";
    }

    if(date.toDateString() === now.toDateString()){

        return date.toLocaleTimeString(
            "ar-IQ",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }

    return date.toLocaleDateString(
        "ar-IQ",
        {
            day:"numeric",
            month:"short"
        }
    );
}


function getDisplayName(contact){

    if(!contact){
        return "مستخدم";

    return (
        contact.display_name ||
        "مستخدم"
    );
}


function avatarUrl(contact){

    if(!contact){
        return DEFAULT_AVATAR;

    if(
        contact.avatar_url &&
        String(contact.avatar_url).trim()
    ){
        return contact.avatar_url;
    }

    if(contact.is_support){
        return SUPPORT_AVATAR;
    }

    return DEFAULT_AVATAR;
}


function showImage(img,url){

    img.onerror = function(){

        img.onerror = null;

    };

}

}


/* =====================================================
   ACTIVITY
===================================================== */

async function loadActivity(){

    if(!currentUser){
        return;
    }

    try{

        const {data,error} =
            await client
                .from("profiles")
                .select("show_activity")
                .eq("id",currentUser.id)
                .maybeSingle();

        if(error){
            throw error;
        }

        const enabled =
            data?.show_activity !== false;

        updateActivityUI(enabled);

        await client.rpc(
            "set_my_presence",
            {
                online:enabled
            }
        );

    }catch(error){

        console.error(
            "loadActivity",
            error
        );

        updateActivityUI(true);
    }
}


function updateActivityUI(enabled){

    activitySwitch.classList.toggle(
        "on",
        enabled
    );

    topActivityDot.classList.toggle(
        "active",
        enabled
    );

    activityText.textContent =
        enabled
            ? "نشط"
            : "غير نشط";
}


async function toggleActivity(){

    if(!currentUser){
        return;
    }

    const enabled =
        !activitySwitch.classList.contains("on");

    try{

        const {error} =
            await client
                .from("profiles")
                .update({
                    show_activity:enabled
                })
                .eq("id",currentUser.id);

        if(error){
            throw error;
        }

        await client.rpc(
            "set_my_presence",
            {
                online:enabled
            }
        );

        updateActivityUI(enabled);

    }catch(error){

        console.error(
            "toggleActivity",

        );

        alert(
            "تعذر تحديث حالة النشاط."
        );
    }
}


/* =====================================================
   CONVERSATIONS
===================================================== */

async function loadConversations(){

    if(!currentUser){

        conversationList.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">🔐</div>
                <strong>سجّل الدخول أولاً</strong>
                <p>
                    الرسائل والمحادثات الخاصة تظهر بعد تسجيل الدخول.
                </p>
            </div>
        `;

        conversationCount.textContent = "0";

        return;
    }

    setLoading(
        conversationList,
        "جاري تحميل المحادثات"
    );

    try{

        const {data,error} =
            await client.rpc(
                "get_my_conversations"
            );

        if(error){
            throw error;
        }

        conversations =
            Array.isArray(data)
                ? data
                : [];

        conversations.sort(function(a,b){

            return (
                new Date(b.updated_at || b.last_message_at || 0)
                -
                new Date(a.updated_at || a.last_message_at || 0)
            );

        });

        conversationCount.textContent =
            String(conversations.length);

        await renderConversationsProgressively();

    }catch(error){

        console.error(
            "loadConversations",
            error
        );

        conversationList.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">⚠️</div>

                    ${escapeHtml(error.message || "حدث خطأ غير معروف")}
                </p>
            </div>
        `;
    }
}


/* =====================================================
   PROGRESSIVE CONVERSATIONS
===================================================== */

async function renderConversationsProgressively(){

    conversationList.innerHTML = "";

    if(!conversations.length){

        conversationList.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">💬</div>
                <strong>لا توجد محادثات بعد</strong>
                <p>
                    ابدأ محادثة جديدة من البحث عن المستخدمين.
                </p>
            </div>
        `;

        return;
    }

    for(
        let index = 0;
        index < conversations.length;
        index++
    ){

        const conversation =
            conversations[index];

        const card =
            await createConversationCard(
                conversation
            );

        if(!card){
            continue;
        }

        card.style.animationDelay =
            Math.min(index * 65,700) + "ms";

        conversationList.appendChild(card);

        /*
          هذا التأخير هو الذي يجعل العناصر
          تظهر واحداً وراء الآخر.
        */
        await new Promise(
            resolve => setTimeout(
                resolve,
                55
            )
        );
    }
}


/* =====================================================
   CONVERSATION CARD
===================================================== */

async function createConversationCard(conversation){

    let contact = null;

    try{

        const {data,error} =
            await client.rpc(
                "get_conversation_contacts",
                {
                    target_conversation_id:
                        conversation.conversation_id
                }
            );

        if(error){
            throw error;
        }

        contact =
            Array.isArray(data)
                ? data[0]
                : data;

    }catch(error){

        console.error(
            "get contact",
            error
        );

        return null;
    }

    if(!contact){
        return null;
    }

    if(conversation.type === "support"){

        contact.is_support = true;

        if(
            !contact.avatar_url ||
            contact.avatar_url === DEFAULT_AVATAR
        ){
            contact.avatar_url =
                SUPPORT_AVATAR;
        }
    }

    const card =
        document.createElement("div");

    card.className =
        "conversation-card";

    card.dataset.conversationId =
        conversation.conversation_id;

    card._contact =
        contact;

    card._conversation =
        conversation;

    const unread =
        Number(conversation.unread_count || 0);

    const online =
        contact.show_activity !== false &&
        contact.is_online === true;

    const preview =
        conversation.last_message ||
        "لا توجد رسائل بعد";

    card.innerHTML = `

        <div class="avatar-wrap">

            <img
                class="avatar"
                src="${escapeHtml(avatarUrl(contact))}"
                alt="">

            <span
                class="online-dot ${online ? "active" : ""}">
            </span>

        </div>

        <div class="conversation-info">

            <div class="conversation-top">

                <span class="conversation-name">
                    ${escapeHtml(
                        conversation.type === "support"
                            ? "دعم WFESC"
                            : getDisplayName(contact)
                    )}
                </span>

                <span class="conversation-time">
                    ${escapeHtml(
                        formatTime(
                            conversation.last_message_at ||
                            conversation.updated_at
                        )
                    )}
                </span>

            </div>

            <div class="conversation-preview">

                <span style="overflow:hidden;text-overflow:ellipsis;">
                    ${escapeHtml(preview)}
                </span>

                ${
                    unread > 0
                    ? `
                        <span class="unread-badge">
                            ${unread > 99 ? "99+" : unread}
                        </span>
                    `
                    : ""
                }

            </div>

        </div>

        <button
            type="button"
            class="card-menu"
            aria-label="خيارات">
            ⋮
        </button>
    `;

    const image =
        card.querySelector(".avatar");

    image.addEventListener(
        "error",
        function(){
            image.src = DEFAULT_AVATAR;
        }
    );

    const menuButton =
        card.querySelector(".card-menu");

    menuButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            openContextMenu(
                event,
                conversation.conversation_id
            );
        }
    );

    image.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            openProfile(
                contact.user_id
            );
        }
    );

    card.addEventListener(
        "click",
        function(){

            openConversation(
                conversation.conversation_id,
                contact,
                conversation.type
            );

        }
    );

    return card;
}


/* =====================================================

async function openConversation(
    conversationId,
    contact,
    type
){

    if(!currentUser){
        return;
    }

    currentConversationId =
        conversationId;

    currentConversationContact =
        contact || {};

    if(type === "support"){

        currentConversationContact.is_support =
            true;

        currentConversationContact.avatar_url =
            SUPPORT_AVATAR;
    }

    /*
      هنا نخفي كل الصفحة الرئيسية
      ونترك المحادثة فقط.
    */

    page.classList.add(
        "chat-active"

    chatView.classList.add(
        "open"

    updateChatHeader();

    setLoading(
        chatMessages,

    await loadConversationMessages();

    await markConversationRead();

    subscribeMessageRealtime();

    subscribeTypingRealtime();

    subscribePresenceRealtime();

    scrollChatToBottom(false);

async function loadConversationMessages(){

        return;
    }

    try{

        const {data,error} =
            await client.rpc(
                "get_conversation_messages",
                {
                    target_conversation_id:

/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

    chatMessages.innerHTML = "";

    if(!currentMessages.length){

        chatMessages.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">👋</div>
                <strong>ابدأ المحادثة</strong>
                <p>
                    اكتب أول رسالة من الأسفل.
                </p>
            </div>
        `;

        return;
    }

    currentMessages.forEach(
        function(message,index){

            const row =
                createMessageElement(
                    message,
                    false
                );

            row.style.animationDelay =
                Math.min(index * 18,350) + "ms";

            chatMessages.appendChild(row);
        }
    );
}


/* =====================================================
   MESSAGE ELEMENT
===================================================== */

function createMessageElement(
    message,
    isNew
){

    const mine =
        message.sender_id ===
        currentUser?.id;

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (mine ? "mine" : "theirs");

    if(isNew){
        row.classList.add(
            "message-new"
        );
    }

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        message.content || "";

    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.created_at
        );

    bubble.appendChild(content);
    bubble.appendChild(time);

    row.appendChild(bubble);

    return row;
}


/* =====================================================
   APPEND MESSAGE WITHOUT RELOAD
===================================================== */

function appendIncomingMessage(message){

    if(
        !message ||
        message.conversation_id !==
        currentConversationId
    ){
        return;
    }

    const exists =
        currentMessages.some(
            item =>
                item.message_id ===
                message.message_id ||
                item.id === message.id
        );

    if(exists){
        return;
    }

    /*
      إزالة رسالة "ابدأ المحادثة"
    */
    const empty =
        chatMessages.querySelector(
            ".empty-state"
        );

    if(empty){
        empty.remove();
    }

    currentMessages.push(
        message
    );

    currentMessages.sort(
        function(a,b){

            return (
                new Date(a.created_at) -
                new Date(b.created_at)
            );

        }
    );

    const row =
        createMessageElement(
            message,
            true
        );

    chatMessages.appendChild(row);

    scrollChatToBottom(true);

    markConversationRead();
}


/* =====================================================
   SEND MESSAGE
===================================================== */

messageForm.addEventListener(
    "submit",
    async function(event){

        /*
          أهم إصلاح:
          منع المتصفح من عمل reload.
        */

        event.preventDefault();

        event.stopPropagation();

        await sendCurrentMessage();

    }
);


async function sendCurrentMessage(){

    if(
        isSending ||
        !currentConversationId ||
        !currentUser
    ){
        return;
    }

    const content =
        messageInput.value.trim();

    if(!content){
        return;
    }

    isSending = true;

    sendButton.disabled = true;

    const original =
        sendButton.textContent;

    sendButton.textContent =
        "…";

    try{

        const {data,error} =
            await client.rpc(
                "send_message",
                {
                    target_conversation_id:
                        currentConversationId,

                    message_content:
                        content
                }
            );

        if(error){
            throw error;
        }

        /*
          إذا رجع RPC الرسالة نضيفها مباشرة.
          وإذا كان Realtime سيصل بها أيضاً،
          appendIncomingMessage يمنع التكرار.
        */

        if(data){

            const message =
                Array.isArray(data)
                    ? data[0]
                    : data;

            if(message){

                appendIncomingMessage({

                    ...message,

                    conversation_id:
                        currentConversationId,

                    sender_id:
                        currentUser.id,

                    content:
                        message.content || content,

                    created_at:
                        message.created_at ||
                        new Date().toISOString()

                });

            }

        }

        messageInput.value = "";

        autoResizeTextarea();

        await stopTyping();

        /*
          تحديث القائمة في الخلفية فقط.
          لا نعيد تحميل الصفحة.
        */

        refreshConversationListSilently();

    }catch(error){

        console.error(
            "sendCurrentMessage",
            error
        );

        alert(
            error.message ||
            "تعذر إرسال الرسالة."
        );

    }finally{

        isSending = false;

        sendButton.disabled = false;

        sendButton.textContent =
            original;
    }
}

function removeTypingRealtime(){

    if(typingChannel){

        try{

            client.removeChannel(
                typingChannel
            );

        typingChannel = null;
    }
}


function subscribeTypingRealtime(){

    removeTypingRealtime();

    if(!currentConversationId){
        return;
    }

    typingChannel =
        client
            .channel(
                "typing-" +
                currentConversationId +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"typing_status",
                    filter:
                        "conversation_id=eq." +
                        currentConversationId
                },
                function(payload){

                    const row =
                        payload.new;

                    if(
                        !row ||
                        row.user_id ===
                        currentUser?.id
                    ){
                        return;
                    }

                    typingIndicator.classList.toggle(
                        "show",
                        row.is_typing === true
                    );

                }
            )
            .subscribe();

    clearInterval(
        typingCleanupTimer
    );

    typingCleanupTimer =
        setInterval(
            function(){

                client.rpc(
                    "cleanup_stale_typing_status"
                ).catch(
                    () => {}
                );

            },
            5000
        );
}

function removeMessageRealtime(){

        try{

    }
}


function subscribeMessageRealtime(){

    removeMessageRealtime();

    if(!currentConversationId){
        return;
    }

    messageChannel =
        client
            .channel(
                "messages-" +
                currentConversationId +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        currentConversationId
                },
                function(payload){

                    const message =
                        payload.new;

                        message_id:

                        created_at:

                        edited_at:

                            message.deleted_at
                    });

/* =====================================================
   SEARCH MESSAGES
===================================================== */

async function searchMessages(text){

    if(!currentUser){
        return;
    }

    mainList.style.display =
        "none";

    searchResults.classList.add(
        "visible"
    );

    setLoading(
        searchResults,
        "جاري البحث"
    );

    try{

        const {data,error} =
            await client.rpc(
                "search_messages",
                {
                    search_text:text
                }
            );

        if(error){
            throw error;
        }

        searchResults.innerHTML = "";

        const rows =
            Array.isArray(data)
                ? data
                : [];

        if(!rows.length){

            searchResults.innerHTML = `
                <div class="empty-state glass">
                    <div class="empty-icon">🔎</div>
                    <strong>لا توجد نتائج</strong>
                    <p>
                        لم يتم العثور على هذه الكلمة في محادثاتك.
                    </p>
                </div>
            `;

            return;
        }

        /*
          تجميع النتائج حسب المحادثة
        */

        const grouped =
            new Map();

        rows.forEach(function(row){

            if(!grouped.has(row.conversation_id)){

                grouped.set(
                    row.conversation_id,
                    []
                );
            }

            grouped.get(
                row.conversation_id
            ).push(row);

        });

        let index = 0;

        for(
            const [
                conversationId,
                matches
            ] of grouped
        ){

            let contact = null;

            try{

                const result =
                    await client.rpc(
                        "get_conversation_contacts",
                        {
                            target_conversation_id:
                                conversationId
                        }
                    );

                contact =
                    Array.isArray(result.data)
                        ? result.data[0]
                        : result.data;

            }catch(error){}

            if(!contact){
                continue;
            }

            const first =
                matches[0];

            const result =
                document.createElement("div");

            result.className =
                "search-result";

            result.style.animationDelay =
                Math.min(index * 55,600) +
                "ms";

            result.innerHTML = `

                <div class="avatar-wrap">

                    <img
                        class="avatar"
                        src="${escapeHtml(
                            avatarUrl(contact)
                        )}"
                        alt="">

                </div>

                <div class="result-info">

                    <div class="result-name">
                        ${escapeHtml(
                            getDisplayName(contact)
                        )}
                    </div>

                    <div class="result-preview">
                        ${escapeHtml(
                            first.content
                        )}
                    </div>

                </div>

                <div class="match-count">
                    ${matches.length} تطابق
                </div>
            `;

            const img =
                result.querySelector("img");

            img.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    openProfile(
                        contact.user_id
                    );

                }
            );

            result.addEventListener(
                "click",
                async function(){

                    await openConversation(
                        conversationId,
                        contact,
                        "direct"
                    );

                    /*
                      نذهب إلى أول نتيجة
                    */

                    setTimeout(
                        function(){

                            focusSearchMatch(
                                first.content
                            );

                        },
                        250
                    );

                }
            );

            searchResults.appendChild(
                result
            );

            index++;
        }

    }catch(error){

        console.error(
            "searchMessages",
            error
        );

        searchResults.innerHTML = `
            <div class="empty-state glass">
                <div class="empty-icon">⚠️</div>
                <strong>تعذر البحث</strong>
                <p>
                    ${escapeHtml(error.message || "")}
                </p>
            </div>
        `;
    }
}

/* =====================================================
   SEARCH MATCH
===================================================== */

function focusSearchMatch(text){

    const nodes =
        chatMessages.querySelectorAll(
            ".message-content"
        );

    for(
        const node of nodes
    ){

        if(
            node.textContent
                .toLowerCase()
                .includes(
                    String(text)
                        .toLowerCase()
                )
        ){

            node.closest(
                ".message-row"
            )?.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

            break;
        }
    }
}


/* =====================================================
   REFRESH LIST WITHOUT PAGE RELOAD
===================================================== */

async function refreshConversationListSilently(){

    if(
        page.classList.contains(
            "chat-active"
        )
    ){
        /*
          لا نلمس واجهة المحادثة.
          فقط نحدّث البيانات بالذاكرة.
        */
    }

    try{

        const {data,error} =
            await client.rpc(
                "get_my_conversations"
            );

        if(error){
            throw error;
        }

        conversations =
            Array.isArray(data)
                ? data
                : [];

        conversations.sort(
            function(a,b){

                return (
                    new Date(
                        b.updated_at ||
                        b.last_message_at ||
                        0
                    )
                    -
                    new Date(
                        a.updated_at ||
                        a.last_message_at ||
                        0
                    )
                );
            }
        );

        /*
          إذا كنا في القائمة، نعيد ترتيبها
          بدون إعادة تحميل الصفحة.
        */

        if(
            !page.classList.contains(
                "chat-active"
            )
            &&
            searchInput.value.trim() === ""
        ){

            await renderConversationsProgressively();
        }

    }catch(error){

        console.warn(
            "silent refresh",
            error
        );
    }
}

    contextMenu.style.top =
        Math.max(8,y) + "px";
}


function closeContextMenu(){

    contextMenu.classList.remove(
        "show"
    );

    contextConversationId =
        null;
}


document.addEventListener(
    "click",
    function(event){

        if(
            !contextMenu.contains(event.target) &&
            !event.target.closest(".card-menu")
        ){
            closeContextMenu();
        }

    }
);


/* =====================================================
   MUTE
===================================================== */

document.getElementById(
    "muteConversationButton"
).addEventListener(
    "click",
    async function(){

        const id =
            contextConversationId;

        closeContextMenu();

        if(!id){
            return;
        }

        try{

            const {data,error} =
                await client
                    .from("notification_settings")
                    .select("muted")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "conversation_id",
                        id
                    )
                    .maybeSingle();

            if(error){
                throw error;
            }

            const muted =
                !(data?.muted === true);

            const result =
                await client
                    .from("notification_settings")
                    .upsert({
                        user_id:
                            currentUser.id,
                        conversation_id:
                            id,
                        muted:muted,
                        updated_at:
                            new Date().toISOString()
                    },{
                        onConflict:
                            "user_id,conversation_id"
                    });

            if(result.error){
                throw result.error;
            }

        }catch(error){

            console.error(
                "mute",
                error
            );

            alert(
                "تعذر تغيير إعداد الإشعارات."
            );
        }

    }
);


/* =====================================================
   HIDE
===================================================== */

document.getElementById(
    "hideConversationButton"
).addEventListener(
    "click",
    function(){

        const id =
            contextConversationId;

        closeContextMenu();

        if(!id){
            return;
        }

        showConfirm(
            "إخفاء المحادثة",
            "سيتم إخفاء المحادثة من قائمتك فقط ولن يتم حذف رسائل الطرف الآخر.",
            async function(){

                try{

                    const {error} =
                        await client.rpc(
                            "hide_my_conversation",
                            {
                                target_conversation_id:
                                    id
                            }
                        );

                    if(error){
                        throw error;
                    }

                    if(
                        id ===
                        currentConversationId
                    ){

                        backChatButton.click();

                    }else{

                        await loadConversations();
                    }

                }catch(error){

                    console.error(
                        "hide",
                        error
                    );

                    alert(
                        error.message ||
                        "تعذر إخفاء المحادثة."
                    );
                }

            }
        );

    }
);

===================================================== */

function showConfirm(

    text,
    action
){

    confirmText.textContent =
        text;

    pendingConfirmAction =
        action;

    confirmModal.classList.add(

}


confirmCancel.addEventListener(
    "click",
    function(){

        pendingConfirmAction =

        confirmModal.classList.remove(

);


confirmOk.addEventListener(
    "click",
    async function(){

/* =====================================================
   NOTIFICATIONS
===================================================== */

async function loadNotifications(){

    if(!currentUser){
        return;
    }

    try{

        const {data,error} =
            await client
                .from("notifications")
                .select(
                    "id,actor_id,type,message,is_read,created_at,conversation_id"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                )
                .limit(50);

        if(error){
            throw error;
        }

        renderNotifications(
            data || []
        );

    }catch(error){

        console.error(
            "notifications",
            error
        );
    }
}


function renderNotifications(rows){

    notificationsList.innerHTML = "";

    if(!rows.length){

        notificationsList.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🔔</div>
                <strong>لا توجد إشعارات</strong>
                <p>لا توجد إشعارات جديدة حالياً.</p>
            </div>
        `;

        return;
    }

    rows.forEach(function(row){

        const item =
            document.createElement("div");

        item.className =
            "notification-item " +
            (
                row.is_read
                    ? ""
                    : "unread"
            );

        item.innerHTML = `

            <div class="notification-content">

                ${escapeHtml(row.message)}

                <span class="notification-time">
                    ${escapeHtml(
                        formatTime(
                            row.created_at
                        )
                    )}
                </span>

            </div>

            <button
                type="button"
                class="notification-delete">
                ×
            </button>
        `;

        item.querySelector(
            ".notification-delete"
        ).addEventListener(
            "click",
            async function(event){

                event.stopPropagation();

                try{

                    await client.rpc(
                        "delete_my_notification",
                        {
                            target_notification_id:
                                row.id
                        }
                    );

                    item.remove();

                }catch(error){

                    console.error(
                        error
                    );
                }

            }
        );

        item.addEventListener(
            "click",
            async function(){

                if(!row.is_read){

                    await client.rpc(
                        "mark_notification_read",
                        {
                            target_notification_id:
                                row.id
                        }
                    );

                    item.classList.remove(
                        "unread"
                    );
                }

                if(row.conversation_id){

                    const {data} =
                        await client.rpc(
                            "get_conversation_contacts",
                            {
                                target_conversation_id:
                                    row.conversation_id
                            }
                        );

                    const contact =
                        Array.isArray(data)
                            ? data[0]
                            : data;

                    if(contact){

                        notificationsPanel.classList.remove(
                            "show"
                        );

                        await openConversation(
                            row.conversation_id,
                            contact,
                            "direct"
                        );
                    }
                }

            }
        );

        notificationsList.appendChild(
            item
        );
    });
}

/* =====================================================
   SUPPORT
===================================================== */

async function openSupport(){

    if(!currentUser){
        return;
    }

    try{

        const {data,error} =
            await client.rpc(
                "get_or_create_support_conversation"
            );

        if(error){
            throw error;
        }

        const supportId =
            data;

        const contactResult =
            await client.rpc(
                "get_conversation_contacts",
                {
                    target_conversation_id:
                        supportId
                }
            );

        const contact =
            Array.isArray(contactResult.data)
                ? contactResult.data[0]
                : contactResult.data;

        if(contact){

            contact.is_support =
                true;

            contact.avatar_url =
                SUPPORT_AVATAR;

            await openConversation(
                supportId,
                contact,
                "support"
            );
        }

    }catch(error){

        console.error(
            "support",
            error
        );

        alert(
            error.message ||
            "تعذر فتح دعم WFESC."
        );
    }
}


/* =====================================================
   REALTIME NOTIFICATIONS
===================================================== */

function subscribeNotifications(){

    if(notificationChannel){

        try{

            client.removeChannel(
                notificationChannel
            );

        }catch(error){}
    }

    if(!currentUser){
        return;
    }

    notificationChannel =
        client
            .channel(
                "notifications-" +
                currentUser.id
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                function(){

                    loadNotifications();

                }
            )
            .subscribe();
}


/* =====================================================
   GLOBAL PRESENCE
===================================================== */

async function updateOwnPresence(){

    if(!currentUser){
        return;
    }

    try{

        const enabled =
            activitySwitch.classList.contains(
                "on"
            );

        await client.rpc(
            "set_my_presence",
            {
                online:enabled
            }
        );

    }catch(error){

        console.warn(
            "presence",
            error
        );
    }
}


/* =====================================================
   AUTH STATE
===================================================== */

function subscribeAuth(){

    client.auth.onAuthStateChange(
        async function(event,session){

            currentUser =
                session?.user || null;

            if(!currentUser){

                page.classList.remove(
                    "chat-active"
                );

                chatView.classList.remove(
                    "open"
                );

                currentConversationId =
                    null;

                currentConversationContact =
                    null;

                removeMessageRealtime();

                removeTypingRealtime();

                removePresenceRealtime();

                updateActivityUI(false);

                await loadConversations();

                return;
            }

            await loadActivity();

            await loadConversations();

            await loadNotifications();

            subscribeNotifications();

        }
    );
}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

    if(initialized){
        return;
    }

    initialized = true;

    currentUser =
        await getSession();

    if(currentUser){

        await loadActivity();

        await loadConversations();

        await loadNotifications();

        subscribeNotifications();

        /*
          إنشاء/التأكد من محادثة الدعم
          بدون فتحها تلقائياً.
        */

        try{

            await client.rpc(
                "get_or_create_support_conversation"
            );

        }catch(error){

            console.warn(
                "support init",
                error
            );
        }

    }else{

        await loadConversations();
    }

    subscribeAuth();

    document.addEventListener(
        "visibilitychange",
        async function(){

            if(
                document.visibilityState ===
                "visible"
            ){

                await updateOwnPresence();

            }else{

                if(currentUser){

                    try{

                        await client.rpc(
                            "set_my_presence",
                            {
                                online:false
                            }
                        );

                    }catch(error){}
                }
            }

        }
    );

    window.addEventListener(
        "beforeunload",
        function(){

            if(currentUser){

                client.rpc(
                    "set_my_presence",
                    {
                        online:false
                    }
                ).catch(
                    () => {}
                );
            }

        }
    );

}


/* =====================================================
   START
===================================================== */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initialize,
        {
            once:true
        }
    );

}else{

    initialize();

}

    }

};
