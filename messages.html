<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرسائل | WFESC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 15% 10%,rgba(255,255,255,.055),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(255,255,255,.035),transparent 25%),
        #050505;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
    overflow-x:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   الصفحة
========================= */

.messages-page{
    width:100%;
    min-height:100vh;
    padding:22px;
    display:flex;
    justify-content:center;
}

.messages-shell{
    width:min(1100px,100%);
    min-height:calc(100vh - 44px);
    position:relative;
}

/* =========================
   Liquid Glass
========================= */

.glass{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

/* =========================
   الهيدر
========================= */

.main-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:16px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-icon{
    width:48px;
    height:48px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    font-size:23px;
}

.header-title h1{
    font-size:24px;
    margin-bottom:4px;
}

.header-title p{
    color:#8e8e8e;
    font-size:13px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-button{
    width:43px;
    height:43px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.045);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.icon-button:hover{
    background:rgba(255,255,255,.09);
    transform:translateY(-1px);
}

.activity-button{
    display:flex;
    align-items:center;
    gap:7px;
    min-height:43px;
    padding:0 13px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.045);
    color:#fff;
}

.activity-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.activity-dot.online{
    background:#36e06f;
    box-shadow:0 0 12px rgba(54,224,111,.7);
}

/* =========================
   البحث
========================= */

.search-panel{
    padding:14px;
    border-radius:22px;
    margin-bottom:15px;
}

.search-row{
    display:flex;
    gap:10px;
}

.search-box{
    position:relative;
    flex:1;
}

.search-box input{
    width:100%;
    height:48px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(0,0,0,.28);
    color:#fff;
    outline:none;
    padding:0 45px 0 15px;
}

.search-box input:focus{
    border-color:rgba(255,255,255,.22);
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
}

.search-modes{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.search-mode{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
    color:#999;
    padding:9px 13px;
    border-radius:12px;
    transition:.2s;
}

.search-mode.active{
    color:#fff;
    background:rgba(255,255,255,.10);
}

/* =========================
   قائمة الرسائل
========================= */

.messages-list-view{
    display:block;
}

.messages-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.conversation-card{
    width:100%;
    min-height:76px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.075);
    background:rgba(255,255,255,.035);
    transition:
        transform .2s,
        background .2s,
        border-color .2s;
    opacity:0;
    transform:translateY(15px);
    animation:conversationIn .38s ease forwards;
}

.conversation-card:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.065);
    border-color:rgba(255,255,255,.13);
}

@keyframes conversationIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar-wrap{
    position:relative;
    flex-shrink:0;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:17px;
    object-fit:cover;
    display:block;
    background:#111;
    border:1px solid rgba(255,255,255,.09);
}

.avatar-small{
    width:42px;
    height:42px;
    border-radius:14px;
}

.online-small{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#777;
    border:2px solid #080808;
    bottom:0;
    left:0;
}

.online-small.active{
    background:#36e06f;
    box-shadow:0 0 10px rgba(54,224,111,.6);
}

.conversation-info{
    min-width:0;
    flex:1;
}

.conversation-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.conversation-name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:#777;
    font-size:11px;
    white-space:nowrap;
}

.conversation-preview{
    color:#888;
    font-size:13px;
    margin-top:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-badge{
    min-width:21px;
    height:21px;
    padding:0 6px;
    border-radius:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:#000;
    font-size:11px;
    font-weight:bold;
}

/* =========================
   نتائج البحث
========================= */

.search-results{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    border-radius:19px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
    animation:conversationIn .35s ease forwards;
}

.search-result-content{
    flex:1;
    min-width:0;
}

.search-result-name{
    font-weight:bold;
}

.search-result-username{
    color:#777;
    font-size:12px;
    direction:ltr;
    text-align:right;
    margin-top:3px;
}

.search-result-snippet{
    color:#999;
    font-size:13px;
    margin-top:7px;
}

.search-result-count{
    font-size:11px;
    color:#aaa;
    white-space:nowrap;
}

/* =========================
   حالة فارغة
========================= */

.empty-state{
    min-height:220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
    gap:8px;
}

.empty-icon{
    font-size:38px;
    opacity:.55;
}

.empty-state strong{
    color:#aaa;
}

/* =========================
   شاشة المحادثة
========================= */

.chat-view{
    display:none;
    height:calc(100vh - 44px);
    min-height:500px;
    border-radius:26px;
    overflow:hidden;
    flex-direction:column;
}

.chat-view.open{
    display:flex;
    animation:chatOpen .28s ease;
}

@keyframes chatOpen{
    from{
        opacity:0;
        transform:translateX(12px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.chat-header{
    min-height:70px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
}

.back-button{
    width:42px;
    height:42px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#fff;
    font-size:20px;
}

.chat-user{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
}

.chat-user-info{
    min-width:0;
}

.chat-user-name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-user-status{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.chat-user-status.online{
    color:#45d976;
}

.chat-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:20px 14px;
    scroll-behavior:smooth;
}

.messages-container{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:850px;
    margin:auto;
}

.message-row{
    width:100%;
    display:flex;
    animation:messageIn .32s cubic-bezier(.2,.8,.2,1);
}

.message-row.mine{
    justify-content:flex-start;
}

.message-row.theirs{
    justify-content:flex-end;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.message-bubble{
    max-width:min(75%,600px);
    padding:11px 14px;
    border-radius:18px;
    line-height:1.55;
    word-break:break-word;
    position:relative;
}

.message-row.mine .message-bubble{
    background:#f1f1f1;
    color:#050505;
    border-bottom-right-radius:6px;
}

.message-row.theirs .message-bubble{
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    border-bottom-left-radius:6px;
}

.message-time{
    display:block;
    margin-top:5px;
    font-size:9px;
    opacity:.45;
    direction:ltr;
}

.message-highlight{
    animation:highlightMessage 1.5s ease;
}

@keyframes highlightMessage{
    0%,100%{
        box-shadow:none;
    }
    25%,70%{
        box-shadow:0 0 0 3px rgba(255,255,255,.14);
    }
}

/* =========================
   يكتب
========================= */

.typing-area{
    min-height:27px;
    padding:0 18px 4px;
    color:#888;
    font-size:12px;
}

.typing-indicator{
    display:flex;
    align-items:center;
    gap:4px;
}

.typing-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#aaa;
    animation:typingDot .8s infinite;
}

.typing-dot:nth-child(2){
    animation-delay:.15s;
}

.typing-dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typingDot{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* =========================
   إرسال
========================= */

.chat-input-area{
    padding:11px;
    border-top:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.025);
}

.chat-form{
    display:flex;
    align-items:flex-end;
    gap:9px;
}

.chat-input{
    flex:1;
    resize:none;
    min-height:45px;
    max-height:130px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(0,0,0,.3);
    color:#fff;
    padding:12px 14px;
    outline:none;
}

.chat-input:focus{
    border-color:rgba(255,255,255,.22);
}

.send-button{
    width:47px;
    height:47px;
    flex-shrink:0;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.13);
    background:#fff;
    color:#000;
    font-size:18px;
    transition:.2s;
}

.send-button:hover{
    transform:scale(1.04);
}

.send-button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   الإشعارات
========================= */

.notifications-panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.notifications-panel.open{
    display:flex;
}

.notifications-box{
    width:min(520px,100%);
    max-height:80vh;
    overflow:auto;
    border-radius:25px;
    padding:16px;
}

.notifications-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.notifications-actions{
    display:flex;
    gap:7px;
}

.small-action{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#aaa;
    border-radius:11px;
    padding:8px 10px;
    font-size:11px;
}

.notification-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px;
    border-radius:16px;
    margin-bottom:7px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.notification-item.unread{
    background:rgba(255,255,255,.07);
}

.notification-text{
    flex:1;
    color:#ddd;
    font-size:13px;
    line-height:1.5;
}

.notification-delete{
    border:0;
    background:transparent;
    color:#777;
    font-size:15px;
}

/* =========================
   مودال النشاط
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    z-index:110;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(450px,100%);
    border-radius:25px;
    padding:22px;
}

.modal-box h2{
    font-size:20px;
    margin-bottom:8px;
}

.modal-box p{
    color:#888;
    font-size:13px;
    line-height:1.6;
}

.activity-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:18px;
}

.activity-option{
    padding:14px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#aaa;
}

.activity-option.active{
    color:#fff;
    background:rgba(255,255,255,.1);
}

/* =========================
   Context menu
========================= */

.context-menu{
    position:fixed;
    z-index:200;
    min-width:190px;
    padding:7px;
    border-radius:16px;
    display:none;
}

.context-menu.open{
    display:block;
    animation:menuIn .16s ease;
}

@keyframes menuIn{
    from{
        opacity:0;
        transform:scale(.96);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.context-item{
    width:100%;
    text-align:right;
    border:0;
    background:transparent;
    color:#ddd;
    padding:11px;
    border-radius:11px;
}

.context-item:hover{
    background:rgba(255,255,255,.08);
}

.context-item.danger{
    color:#ff7777;
}

/* =========================
   رسالة تسجيل الدخول
========================= */

.auth-required{
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
}

.auth-required strong{
    color:#bbb;
}

/* =========================
   Responsive
========================= */

@media(max-width:700px){

    .messages-page{
        padding:10px;
    }

    .messages-shell{
        min-height:calc(100vh - 20px);
    }

    .header-title h1{
        font-size:20px;
    }

    .header-title p{
        display:none;
    }

    .activity-button{
        padding:0 10px;
    }

    .chat-view{
        height:calc(100vh - 20px);
        border-radius:20px;
    }

    .message-bubble{
        max-width:85%;
    }

    .search-mode{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="messages-page">

<div class="messages-shell">

    <!-- =========================
         القائمة الرئيسية
    ========================== -->

    <section id="messagesListView" class="messages-list-view">

        <header class="main-header">

            <div class="header-title">
                <div class="header-icon">💬</div>

                <div>
                    <h1>الرسائل</h1>
                    <p>محادثاتك وإشعاراتك</p>
                </div>
            </div>

            <div class="header-actions">

                <button
                    id="activityButton"
                    class="activity-button"
                    type="button">
                    <span id="activityDot" class="activity-dot"></span>
                    <span id="activityText">غير نشط</span>
                </button>

                <button
                    id="notificationsButton"
                    class="icon-button"
                    type="button">
                    🔔
                </button>

            </div>

        </header>


        <div class="search-panel glass">

            <div class="search-row">

                <div class="search-box">

                    <span class="search-icon">⌕</span>

                    <input
                        id="messageSearch"
                        type="search"
                        autocomplete="off"
                        placeholder="ابحث في الرسائل...">

                </div>

            </div>

            <div class="search-modes">

                <button
                    id="searchMessagesMode"
                    class="search-mode active"
                    type="button">
                    الرسائل
                </button>

                <button
                    id="searchUsersMode"
                    class="search-mode"
                    type="button">
                    المستخدمين
                </button>

            </div>

        </div>


        <div id="mainContent">

            <div
                id="messagesList"
                class="messages-list">
            </div>

            <div
                id="searchResults"
                class="search-results hidden">
            </div>

            <div
                id="emptyState"
                class="empty-state hidden">

                <div class="empty-icon">💬</div>
                <strong>لا توجد محادثات</strong>
                <span>ابدأ محادثة جديدة من البحث عن مستخدم.</span>

            </div>

            <div
                id="authRequired"
                class="auth-required hidden">

                <div>
                    <strong>يجب تسجيل الدخول</strong>
                    <p>سجل الدخول حتى تتمكن من استخدام الرسائل.</p>
                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         شاشة المحادثة
    ========================== -->

    <section
        id="chatView"
        class="chat-view glass">

        <header class="chat-header">

            <button
                id="backToMessages"
                class="back-button"
                type="button">
                ←
            </button>

            <div class="chat-user">

                <div class="avatar-wrap">

                    <img
                        id="chatAvatar"
                        class="avatar avatar-small"
                        src=""
                        alt="">

                    <span
                        id="chatOnlineDot"
                        class="online-small">
                    </span>

                </div>

                <div class="chat-user-info">

                    <div
                        id="chatUserName"
                        class="chat-user-name">
                        المستخدم
                    </div>

                    <div
                        id="chatUserStatus"
                        class="chat-user-status">
                        غير نشط
                    </div>

                </div>

            </div>

        </header>


        <div
            id="chatBody"
            class="chat-body">

            <div
                id="messagesContainer"
                class="messages-container">
            </div>

        </div>


        <div
            id="typingArea"
            class="typing-area">
        </div>


        <div class="chat-input-area">

            <form
                id="chatForm"
                class="chat-form">

                <textarea
                    id="chatInput"
                    class="chat-input"
                    rows="1"
                    maxlength="5000"
                    placeholder="اكتب رسالتك..."></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    type="submit">
                    ➤
                </button>

            </form>

        </div>

    </section>

</div>

</div>


<!-- =========================
     الإشعارات
========================== -->

<div
    id="notificationsPanel"
    class="notifications-panel">

    <div class="notifications-box glass">

        <div class="notifications-head">

            <h2>الإشعارات</h2>

            <div class="notifications-actions">

                <button
                    id="markAllNotifications"
                    class="small-action"
                    type="button">
                    قراءة الكل
                </button>

                <button
                    id="deleteAllNotifications"
                    class="small-action"
                    type="button">
                    حذف الكل
                </button>

                <button
                    id="closeNotifications"
                    class="icon-button"
                    type="button">
                    ×
                </button>

            </div>

        </div>

        <div id="notificationsList"></div>

    </div>

</div>


<!-- =========================
     النشاط
========================== -->

<div
    id="activityModal"
    class="modal">

    <div class="modal-box glass">

        <h2>حالة النشاط</h2>

        <p>

/* =========================================================
   الحصول على Supabase
========================================================= */

function getSupabaseClient(){

    if(window.WFESCSupabase){
        return window.WFESCSupabase;
    }

    if(window.supabase && window.WFESC_CONFIG){

        return window.supabase.createClient(
            window.WFESC_CONFIG.supabaseUrl,
            window.WFESC_CONFIG.supabaseKey
        );

    }

    return null;
}


/* =========================================================
   تشغيل النظام
========================================================= */

async function init(){

    if(initialized){
        return;
    }

    initialized = true;

    client = getSupabaseClient();

    if(!client){

        showAuthRequired(
            "تعذر الاتصال بنظام الحساب."
        );

        return;
    }

    bindEvents();

    await loadSession();

}


/* =========================================================
   الجلسة
========================================================= */

async function loadSession(){

    try{

        const {
            data:{
                session
            }
        } = await client.auth.getSession();

        if(session && session.user){

            currentUser =
                session.user;

            await startPrivateSystem();

        }else{

            showGuestState();

        }

        client.auth.onAuthStateChange(
            async (_event,sessionData)=>{

                if(sessionData && sessionData.user){

                    currentUser =
                        sessionData.user;

                    await startPrivateSystem();

                }else{

                    currentUser = null;

                    stopRealtime();

                    showGuestState();

                }

            }
        );

    }catch(error){

        console.error(
            "WFESC session error:",
            error
        );

        showAuthRequired(
            "حدث خطأ أثناء تحميل الحساب."
        );

    }

}


/* =========================================================
   بدء النظام الخاص
========================================================= */

async function startPrivateSystem(){

    hideElement(authRequired);

    await loadActivity();

    await loadConversations();

    await loadNotifications();

    subscribeRealtime();

    setMyPresence(true);

}


/* =========================================================
   حالة الضيف
========================================================= */

function showGuestState(){

    stopRealtime();

    messagesList.innerHTML = "";

    searchResults.innerHTML = "";

    hideElement(messagesList);

    hideElement(searchResults);

    hideElement(emptyState);

    showElement(authRequired);

    closeChat();

}


/* =========================================================
   حالة الدخول
========================================================= */

function showAuthRequired(text){

    authRequired.innerHTML =
        `<div>
            <strong>${escapeHtml(text)}</strong>
        </div>`;

    showElement(authRequired);

}


/* =========================================================
   تحميل المحادثات
========================================================= */

async function loadConversations(){

    if(!currentUser){
        return;
    }

    try{

        const {
            data,
            error
        } = await client.rpc(
            "get_my_conversations"
        );

        if(error){
            throw error;
        }

        conversations =
            Array.isArray(data)
                ? data
                : [];

        conversations.sort(
            (a,b)=>
                new Date(
                    b.last_message_at ||
                    b.updated_at ||
                    0
                ) -
                new Date(
                    a.last_message_at ||
                    a.updated_at ||
                    0
                )
        );

        await renderConversationsGradually();

    }catch(error){

        console.error(
            "load conversations:",
            error
        );

        messagesList.innerHTML = "";

        showEmpty(
            "تعذر تحميل المحادثات."
        );

    }

}


/* =========================================================
   عرض المحادثات تدريجياً
========================================================= */

async function renderConversationsGradually(){

    messagesList.innerHTML = "";

    showElement(messagesList);

    hideElement(searchResults);

    if(!conversations.length){

        showEmpty(
            "لا توجد محادثات حالياً."
        );

        return;

    }

    hideElement(emptyState);

    for(
        let index = 0;
        index < conversations.length;
        index++
    ){

        const conversation =
            conversations[index];

        await appendConversationCard(
            conversation,
            index
        );

    }

}


/* =========================================================
   بطاقة محادثة
========================================================= */

async function appendConversationCard(
    conversation,
    index
){

    let contact = null;

    try{

        const {
            data,
            error
        } = await client.rpc(
            "get_conversation_contacts",
            {
                target_conversation_id:
                    conversation.conversation_id
            }
        );

        if(!error &&
           Array.isArray(data) &&
           data.length){

            contact = data[0];

        }

    }catch(error){

        console.error(error);

    }


    if(!contact){

        contact = {
            user_id:null,
            display_name:
                conversation.type === "support"
                    ? "دعم WFESC"
                    : "مستخدم",
            username:"",
            avatar_url:
                conversation.type === "support"
                    ? SUPPORT_AVATAR
                    : DEFAULT_AVATAR,
            is_online:false,
            show_activity:true
        };

    }


    const card =
        document.createElement("div");

    card.className =
        "conversation-card";

    card.style.animationDelay =
        `${index * 70}ms`;

    card.dataset.conversationId =
        conversation.conversation_id;


    const avatar =
        conversation.type === "support"
            ? SUPPORT_AVATAR
            : (
                contact.avatar_url ||
                DEFAULT_AVATAR
            );


    const displayName =
        conversation.type === "support"
            ? "دعم WFESC"
            : (
                contact.display_name ||
                "مستخدم"
            );


    const online =
        contact.show_activity === true &&
        contact.is_online === true;


    const unread =
        Number(
            conversation.unread_count || 0
        );


    card.innerHTML = `

        <div class="avatar-wrap">

            <img
                class="avatar"
                src="${escapeAttribute(avatar)}"
                alt=""
                data-profile-id="${escapeAttribute(
                    contact.user_id || ""
                )}">

            <span
                class="online-small ${
                    online ? "active" : ""
                }">
            </span>

        </div>

        <div class="conversation-info">

            <div class="conversation-top">

                <div class="conversation-name">
                    ${escapeHtml(displayName)}
                </div>

                <div class="conversation-time">
                    ${formatTime(
                        conversation.last_message_at ||
                        conversation.updated_at
                    )}
                </div>

            </div>

            <div class="conversation-preview">
                ${escapeHtml(
                    conversation.last_message ||
                    "ابدأ المحادثة..."
                )}
            </div>

        </div>

        ${
            unread > 0
            ? `
                <div class="unread-badge">
                    ${unread > 99 ? "99+" : unread}
                </div>
            `
            : ""
        }

    `;


    const image =
        card.querySelector(
            "[data-profile-id]"
        );


    if(image){

        image.addEventListener(
            "click",
            function(event){

                event.stopPropagation();

                const id =
                    this.dataset.profileId;

                if(id){

                    openProfile(id);

                }

            }
        );

    }


    card.addEventListener(
        "click",
        function(){

            openConversation(
                conversation.conversation_id,
                contact,
                conversation
            );

        }
    );


    card.addEventListener(
        "contextmenu",
        function(event){

            event.preventDefault();

            openContextMenu(
                event,
                conversation.conversation_id
            );

        }
    );


    messagesList.appendChild(card);

    await wait(55);

}


/* =========================================================
   فتح محادثة
========================================================= */

async function openConversation(
    conversationId,
    contact,
    conversation
){

    if(!conversationId){
        return;
    }

    currentConversationId =

                "مستخدم"

    chatAvatar.alt = name;

    );

    typingArea.innerHTML = "";

    );

    );

    );

}

function closeChat(){

backToMessages.addEventListener(

/* =========================================================
   تحميل رسائل المحادثة
========================================================= */

async function loadConversationMessages(
    conversationId
){

    try{

        const {
            data,
            error
        } = await client.rpc(
            "get_conversation_messages",
            {
                target_conversation_id:
                    conversationId,
                message_limit:100
            }
        );

        if(error){
            throw error;
        }

        messagesContainer.innerHTML = "";

        const messages =
            Array.isArray(data)
                ? data
                : [];

        messages.forEach(
            (message)=>{
                appendMessage(
                    message,
                    false
                );
            }
        );

        scrollChatToBottom(
            false
        );

    }catch(error){

        console.error(
            "messages:",
            error
        );

        messagesContainer.innerHTML =
            `<div class="empty-state">
                تعذر تحميل الرسائل.
            </div>`;

    }

}


/* =========================================================
   إضافة رسالة
========================================================= */

function appendMessage(
    message,
    animate = true
){

    if(!message){
        return;
    }

    const messageId =
        message.message_id ||
        message.id;

    if(
        messageId &&
        document.querySelector(
            `[data-message-id="${cssEscape(messageId)}"]`
        )
    ){

        return;

    }


    const mine =
        String(message.sender_id) ===
        String(currentUser?.id);


    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            mine
                ? "mine"
                : "theirs"
        );


    if(messageId){

        row.dataset.messageId =
            messageId;

    }


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    if(message.deleted_at){

        bubble.innerHTML =
            `<em>تم حذف هذه الرسالة</em>`;

    }else{

        bubble.innerHTML =
            escapeHtml(
                message.content || ""
            )
            .replace(
                /\n/g,
                "<br>"
            );

    }


    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );


    bubble.appendChild(time);

    row.appendChild(bubble);

    messagesContainer.appendChild(row);


    if(animate){

        row.style.animation =
            "none";

        requestAnimationFrame(
            ()=>{
                row.style.animation =
                    "";
            }
        );

    }


    return row;

}


/* =========================================================
   إرسال الرسالة
========================================================= */

chatForm.addEventListener(
    "submit",
    async function(event){

        /*
         * مهم جداً:
         * منع reload الصفحة
         */

        event.preventDefault();

        event.stopPropagation();


        if(!currentUser){
            return;
        }

        if(!currentConversationId){
            return;
        }


        const content =
            chatInput.value.trim();


        if(!content){
            return;
        }


        if(content.length > 5000){
            return;
        }


        sendButton.disabled =
            true;


        /*
         * نخلي الحقل فارغ فوراً
         * بدون إعادة تحميل الصفحة
         */

        chatInput.value = "";

        autoResizeTextarea();


        try{

            const {
                data,
                error
            } = await client.rpc(
                "send_message",
                {
                    target_conversation_id:
                        currentConversationId,

                    message_content:
                        content
                }
            );


            if(error){
                throw error;
            }


            /*
             * إذا رجعت RPC الرسالة
             * نضيفها فوراً.
             */

            if(data){

                const sentMessage =
                    Array.isArray(data)
                        ? data[0]
                        : data;

                if(
                    sentMessage &&
                    (
                        sentMessage.message_id ||
                        sentMessage.id
                    )
                ){

                    appendMessage(
                        sentMessage,
                        true
                    );

                    scrollChatToBottom(
                        true
                    );

                }

            }


            /*
             * أحياناً RPC ترجع UUID فقط
             * لذلك Realtime سيضيف الرسالة
             * تلقائياً إذا لم تضف أعلاه.
             */

            stopTyping();

        }catch(error){

            console.error(
                "send message:",
                error
            );

            /*
             * نرجع النص فقط إذا فشل الإرسال
             */

            chatInput.value =
                content;

            autoResizeTextarea();

            alert(
                "تعذر إرسال الرسالة."
            );

        }finally{

            sendButton.disabled =
                false;

            chatInput.focus();

        }

    }
);


/* =========================================================
   الكتابة
========================================================= */

chatInput.addEventListener(
    "input",
    function(){

        autoResizeTextarea();

        if(!currentConversationId){
            return;
        }

        startTyping();

    }
);


chatInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            chatForm.requestSubmit();

        }

    }
);


function startTyping(){

    if(!currentConversationId){
        return;
    }

    if(!typingState){

        typingState = true;

        client.rpc(
            "set_typing_status",
            {
                target_conversation_id:
                    currentConversationId,

                typing:true
            }
        ).catch(console.error);

    }


    clearTimeout(
        typingTimer
    );


    typingTimer =
        setTimeout(
            stopTyping,
            1000
        );

}


function stopTyping(){

    clearTimeout(
        typingTimer
    );

    if(!typingState){
        return;
    }

    typingState = false;

    if(currentConversationId){

        client.rpc(
            "set_typing_status",
            {
                target_conversation_id:
                    currentConversationId,

                typing:false
            }
        ).catch(console.error);

    }

}


/* =========================================================
   Realtime typing
========================================================= */

function subscribeTyping(
    conversationId
){

    removeTypingSubscription();

    typingChannel =
        client
        .channel(
            "typing-" +
            conversationId +
            "-" +
            Date.now()
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"typing_status",
                filter:
                    "conversation_id=eq." +
                    conversationId
            },
            payload=>{

                const row =
                    payload.new ||
                    {};

                if(
                    String(row.user_id) ===
                    String(currentUser?.id)
                ){

                    return;

                }

                if(
                    row.is_typing === true
                ){

                    showTyping();

                }else{

                    hideTyping();

                }

            }
        )
        .subscribe();

}


function removeTypingSubscription(){

    if(
        typingChannel &&
        client
    ){

        client.removeChannel(
            typingChannel
        );

    }

    typingChannel =
        null;

    hideTyping();

}


function showTyping(){

    typingArea.innerHTML = `
        <div class="typing-indicator">
            <span>يكتب</span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    `;

}


function hideTyping(){

    typingArea.innerHTML =
        "";

}


/* =========================================================
   Realtime الرسائل
========================================================= */

function subscribeRealtime(){

    if(!client || !currentUser){
        return;
    }


    if(realtimeChannel){

        client.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        client
        .channel(
            "wfesc-messages-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"messages"
            },
            payload=>{

                handleRealtimeMessage(
                    payload.new
                );

            }
        )
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"messages"
            },
            payload=>{

                handleRealtimeMessageUpdate(
                    payload.new
                );

            }
        )
        .subscribe();


    if(notificationChannel){

        client.removeChannel(
            notificationChannel
        );

    }


    notificationChannel =
        client
        .channel(
            "wfesc-notifications-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"notifications",
                filter:
                    "user_id=eq." +
                    currentUser.id
            },
            payload=>{

                loadNotifications();

                /*
                 * إذا كنا بقائمة الرسائل
                 * نعيد ترتيبها بدون reload.
                 */

                if(!currentConversationId){

                    loadConversations();

                }

            }
        )
        .subscribe();

}


function handleRealtimeMessage(
    message
){

    if(!message){
        return;
    }


    /*
     * إذا الرسالة تخص المحادثة المفتوحة
     */

    if(
        currentConversationId &&
        String(message.conversation_id) ===
        String(currentConversationId)
    ){

        appendMessage(
            message,
            true
        );

        scrollChatToBottom(
            true
        );


        if(
            String(message.sender_id) !==
            String(currentUser?.id)
        ){

            markConversationRead(
                currentConversationId
            );

        }

    }


    /*
     * تحديث القائمة في الخلفية
     * بدون فتحها أو إعادة تحميل الصفحة.
     */

    updateConversationOrdering(
        message.conversation_id,
        message
    );

}


function handleRealtimeMessageUpdate(
    message
){

    if(
        currentConversationId &&
        String(message.conversation_id) ===
        String(currentConversationId)
    ){

        loadConversationMessages(
            currentConversationId
        );

    }

}


/* =========================================================
   تحديث ترتيب المحادثات
========================================================= */

function updateConversationOrdering(
    conversationId,
    message
){

    const index =
        conversations.findIndex(
            c =>
                String(c.conversation_id) ===
                String(conversationId)
        );


    if(index !== -1){

        conversations[index].last_message =
            message.content;

        conversations[index].last_message_at =
            message.created_at;

        conversations[index].updated_at =
            message.created_at;


        const conversation =
            conversations.splice(
                index,
                1
            )[0];


        conversations.unshift(
            conversation
        );


        if(!currentConversationId){

            loadConversations();

        }

    }else{

        if(!currentConversationId){

            loadConversations();

        }

    }

}

async function searchMessages(
    text
){

    const {
        data,
        error
    } = await client.rpc(
        "search_messages",
        {
            search_text:
                text
        }
    );


    if(error){
        throw error;
    }


    const results =
        Array.isArray(data)
            ? data
            : [];


    searchResults.innerHTML =
        "";


    if(!results.length){

        searchResults.innerHTML =
            `<div class="empty-state">
                <div class="empty-icon">⌕</div>
                <strong>لا توجد نتائج</strong>
                <span>لم يتم العثور على الكلمة داخل رسائلك.</span>
            </div>`;

        return;

    }


    for(
        let index = 0;
        index < results.length;
        index++
    ){

        const result =
            results[index];


        const contact =
            await getContactForConversation(
                result.conversation_id
            );


        const card =
            document.createElement("div");

        card.className =
            "search-result";

        card.style.animationDelay =
            `${index * 60}ms`;


        const avatar =
            contact?.avatar_url ||
            DEFAULT_AVATAR;


        const name =
            contact?.display_name ||
            "مستخدم";


        const snippet =
            highlightSearchText(
                result.content,
                text
            );


        card.innerHTML = `

            <div
                class="avatar-wrap"
                data-profile-id="${
                    escapeAttribute(
                        contact?.user_id || ""
                    )
                }">

                <img
                    class="avatar"
                    src="${escapeAttribute(
                        avatar
                    )}"
                    alt="">

            </div>

            <div class="search-result-content">

                <div class="search-result-name">
                    ${escapeHtml(name)}
                </div>

                <div class="search-result-snippet">
                    ${snippet}
                </div>

            </div>

            <div class="search-result-count">
                ${Number(
                    result.match_count || 1
                )} نتيجة
            </div>

        `;


        const profile =
            card.querySelector(
                "[data-profile-id]"
            );


        if(profile){

            profile.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    const id =
                        this.dataset.profileId;

                    if(id){

                        openProfile(id);

                    }

                }
            );

        }


        card.addEventListener(
            "click",
            async function(){

                const contactData =
                    contact || {
                        user_id:
                            result.sender_id
                    };


                await openConversation(
                    result.conversation_id,
                    contactData,
                    {
                        conversation_id:
                            result.conversation_id
                    }
                );


                focusMessage(
                    result.message_id
                );

            }
        );


        searchResults.appendChild(
            card
        );

        await wait(45);

    }

}

function focusMessage(
    messageId
){

    if(!messageId){
        return;
    }


    setTimeout(
        ()=>{
            const element =
                document.querySelector(
                    `[data-message-id="${cssEscape(messageId)}"]`
                );


            if(!element){
                return;
            }


            element.scrollIntoView({
                behavior:"smooth",
                block:"center"

            setTimeout(
                ()=>{

            );

        },
        250
    );

}

async function loadNotifications(){

    if(!currentUser){
        return;
    }


    try{

        const {
            data,
            error
        } = await client
            .from("notifications")
            .select(
                "id,actor_id,type,message,is_read,created_at,conversation_id"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(50);


        if(error){
            throw error;
        }


        renderNotifications(
            data || []
        );


    }catch(error){

        console.error(
            "notifications:",
            error
        );

    }

}


function renderNotifications(
    notifications
){

    notificationsList.innerHTML =
        "";


    if(!notifications.length){

        notificationsList.innerHTML =
            `<div class="empty-state">
                لا توجد إشعارات.
            </div>`;

        return;

    }


    notifications.forEach(
        notification=>{

            const item =
                document.createElement("div");

            item.className =
                "notification-item " +
                (
                    !notification.is_read
                        ? "unread"
                        : ""
                );


            item.innerHTML = `

                <div class="notification-text">

                    ${escapeHtml(
                        notification.message
                    )}

                    <div style="
                        margin-top:5px;
                        color:#666;
                        font-size:10px;
                    ">
                        ${formatTime(
                            notification.created_at
                        )}
                    </div>

                </div>

                <button
                    class="notification-delete"
                    type="button">
                    ×
                </button>

            `;


            item.querySelector(
                ".notification-delete"
            ).addEventListener(
                "click",
                async function(){

                    try{

                        await client.rpc(
                            "delete_my_notification",
                            {
                                notification_id:
                                    notification.id
                            }
                        );

                        item.remove();

                    }catch(error){

                        console.error(
                            error
                        );

                    }

                }
            );


            item.addEventListener(
                "click",
                async function(){

                    if(
                        !notification.is_read
                    ){

                        await client.rpc(
                            "mark_notification_read",
                            {
                                notification_id:
                                    notification.id
                            }
                        );

                    }


                    if(
                        notification.conversation_id
                    ){

                        const contact =
                            await getContactForConversation(
                                notification.conversation_id
                            );


                        closeNotifications();


                        await openConversation(
                            notification.conversation_id,
                            contact || {},
                            {
                                conversation_id:
                                    notification.conversation_id
                            }
                        );

                    }

                }
            );


            notificationsList.appendChild(
                item
            );

        }
    );

}

function formatTime(
    date
){

    if(!date){
        return "";
    }


    const value =
        new Date(date);


    if(
        Number.isNaN(
            value.getTime()
        )
    ){

        return "";

    }


    return value.toLocaleTimeString(
        "ar-IQ",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function formatMessageTime(
    date
){

    return formatTime(
        date
    );

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );

}


function cssEscape(
    value
){

    if(
        window.CSS &&
        CSS.escape
    ){

        return CSS.escape(
            value
        );

    }

    return String(
        value
    ).replace(
        /"/g,
        '\\"'
    );

}


function highlightSearchText(
    content,
    search
){

    const safeContent =
        escapeHtml(
            content
        );

    const safeSearch =
        escapeHtml(
            search
        );


    if(!safeSearch){
        return safeContent;
    }


    try{

        const regex =
            new RegExp(
                "(" +
                escapeRegExp(
                    safeSearch
                ) +
                ")",
                "gi"
            );


        return safeContent.replace(
            regex,
            "<mark style=\"" +
            "background:rgba(255,255,255,.22);" +
            "color:#fff;" +
            "border-radius:4px;" +
            "padding:1px 3px;" +
            "\">$1</mark>"
        );

    }catch(error){

        return safeContent;

    }

}


function escapeRegExp(
    value
){

    return String(
        value
    ).replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =========================================================
   إيقاف Realtime
========================================================= */

function stopRealtime(){

    if(
        !client
    ){
        return;
    }


    if(realtimeChannel){

        client.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;

    }


    if(notificationChannel){

        client.removeChannel(
            notificationChannel
        );

        notificationChannel =
            null;

    }


    removeTypingSubscription();

}


/* =========================================================
   عند إغلاق/إخفاء الصفحة
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!currentUser){
            return;
        }


        if(
            document.visibilityState ===
            "visible"
        ){

            setMyPresence(true);

        }else{

            setMyPresence(false);

        }

    }
);


window.addEventListener(
    "beforeunload",
    function(){

        if(currentUser){

            client.rpc(
                "set_my_presence",
                {
                    online:false
                }
            ).catch(
                ()=>{}
            );

        }

    }
);


/* =========================================================
   تشغيل
========================================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init,
        {
            once:true
        }
    );

}else{

    init();

}

})();
</script>
