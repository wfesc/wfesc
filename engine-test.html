<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WFESC ENGINE — TEST 02</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010205;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

/* =========================================================
   ENGINE SPLASH
========================================================= */

#engineBoot{
    position:fixed;
    inset:0;
    z-index:999999;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #0b1020 0%,
            #050812 28%,
            #02040a 62%,
            #010205 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        opacity .8s cubic-bezier(.16,1,.3,1),
        transform 1s cubic-bezier(.16,1,.3,1);
}

#engineBoot.hide{
    opacity:0;
    transform:scale(1.12);
    pointer-events:none;
}

/* =========================================================
   BACKGROUND GRID
========================================================= */

.bootGrid{
    position:absolute;
    inset:-50%;
    opacity:.17;

    background-image:
        linear-gradient(
            rgba(111,143,255,.14) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(111,143,255,.14) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    transform:
        perspective(550px)
        rotateX(67deg)
        translateY(25%);

    animation:gridMove 5s linear infinite;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            #000 25%,
            #000 72%,
            transparent
        );
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 60px;
    }

}

/* =========================================================
   BACKGROUND HALO
========================================================= */

.bootHalo{
    position:absolute;
    width:65vmax;
    height:65vmax;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(74,111,255,.14) 0%,
            rgba(74,111,255,.055) 27%,
            transparent 67%
        );

    filter:blur(20px);

    animation:
        haloPulse 2.8s ease-in-out infinite;
}

@keyframes haloPulse{

    0%,
    100%{
        transform:scale(.82);
        opacity:.55;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }

}

/* =========================================================
   PARTICLES
========================================================= */

#particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;

    background:#9eb5ff;

    box-shadow:
        0 0 7px rgba(130,160,255,.9);

    animation:
        particleRise linear infinite;

    opacity:0;
}

@keyframes particleRise{

    0%{
        transform:
            translate3d(0,80px,0)
            scale(.2);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    75%{
        opacity:.35;
    }

    100%{
        transform:
            translate3d(0,-230px,0)
            scale(1.1);

        opacity:0;
    }

}

/* =========================================================
   ENGINE CONTAINER
========================================================= */

.engineCore{
    position:relative;

    width:340px;
    height:340px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   OUTER ENERGY FIELD
========================================================= */

.energyField{
    position:absolute;

    width:330px;
    height:330px;

    border-radius:50%;

    border:
        1px solid
        rgba(105,139,255,.13);

    box-shadow:
        0 0 70px rgba(71,105,255,.04);

    animation:
        fieldRotate 22s linear infinite;
}

.energyField::before,
.energyField::after{
    content:"";

    position:absolute;

    inset:18px;

    border-radius:50%;

    border:
        1px dashed
        rgba(115,145,255,.18);
}

.energyField::after{
    inset:39px;

    border:
        1px solid
        rgba(255,255,255,.06);

    animation:
        fieldRotateReverse 13s linear infinite;
}

@keyframes fieldRotate{

    to{
        transform:rotate(360deg);
    }

}

@keyframes fieldRotateReverse{

    to{
        transform:rotate(-360deg);
    }

}

/* =========================================================
   RADAR RING
========================================================= */

.radar{
    position:absolute;

    width:285px;
    height:285px;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 285deg,
            rgba(112,145,255,.65) 300deg,
            transparent 315deg,
            transparent 360deg
        );

    -webkit-mask:
        radial-gradient(
            circle,
            transparent 0 48%,
            #000 49% 50%,
            transparent 51%
        );

    mask:
        radial-gradient(
            circle,
            transparent 0 48%,
            #000 49% 50%,
            transparent 51%
        );

    animation:
        radarSpin 3.5s linear infinite;
}

@keyframes radarSpin{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================================
   TECH TICKS
========================================================= */

.techRing{
    position:absolute;

    width:305px;
    height:305px;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(150,175,255,.55) 0deg 1deg,
            transparent 1deg 9deg
        );

    -webkit-mask:
        radial-gradient(
            circle,
            transparent 0 46%,
            #000 46.5% 48%,
            transparent 48.5%
        );

    mask:
        radial-gradient(
            circle,
            transparent 0 46%,
            #000 46.5% 48%,
            transparent 48.5%
        );

    opacity:.35;

    animation:
        fieldRotate 28s linear infinite;
}

/* =========================================================
   INNER ORBIT
========================================================= */

.orbit{
    position:absolute;

    width:245px;
    height:245px;

    border-radius:50%;

    border:
        1px solid
        rgba(120,145,255,.22);

    transform:rotateX(64deg);

    box-shadow:
        0 0 20px rgba(80,110,255,.05);

    animation:
        orbitPulse 2s ease-in-out infinite;
}

.orbit::before,
.orbit::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#a9bcff;

    box-shadow:
        0 0 14px #7895ff,
        0 0 28px #5575ff;
}

.orbit::before{
    top:-3px;
    left:50%;
}

.orbit::after{
    bottom:-3px;
    right:50%;
}

@keyframes orbitPulse{

    0%,
    100%{
        transform:
            rotateX(64deg)
            scale(.94);

        opacity:.45;
    }

    50%{
        transform:
            rotateX(64deg)
            scale(1.05);

        opacity:1;
    }

}

/* =========================================================
   CENTRAL REACTOR
========================================================= */

.reactor{
    position:absolute;

    width:175px;
    height:175px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #202d5d 0%,
            #0b1126 30%,
            #050916 55%,
            #02040a 76%,
            transparent 77%
        );

    box-shadow:
        0 0 35px rgba(65,100,255,.22),
        inset 0 0 35px rgba(90,120,255,.12);

    animation:
        reactorAppear 1.4s cubic-bezier(.16,1,.3,1) forwards,
        reactorPulse 2s 1.4s ease-in-out infinite;

    transform:scale(0);
}

@keyframes reactorAppear{

    to{
        transform:scale(1);
    }

}

@keyframes reactorPulse{

    0%,
    100%{
        filter:brightness(.9);
    }

    50%{
        filter:brightness(1.3);
    }

}

/* =========================================================
   REACTOR SHELL
========================================================= */

.reactorShell{
    position:absolute;

    inset:12px;

    border-radius:50%;

    border:
        1px solid
        rgba(146,169,255,.42);

    box-shadow:
        inset 0 0 20px rgba(96,126,255,.12);

    animation:
        shellSpin 8s linear infinite;
}

.reactorShell::before{
    content:"";

    position:absolute;

    inset:15px;

    border-radius:50%;

    border:
        1px dashed
        rgba(133,160,255,.3);
}

@keyframes shellSpin{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================================
   REACTOR CORE
========================================================= */

.core{
    position:absolute;

    width:74px;
    height:74px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #eef3ff 0%,
            #a8bbff 7%,
            #4b69c9 18%,
            #17234e 39%,
            #050914 68%
        );

    border:
        1px solid
        rgba(190,207,255,.8);

    box-shadow:
        0 0 18px rgba(117,148,255,.7),
        0 0 55px rgba(69,104,255,.4),
        inset 0 0 25px rgba(160,185,255,.45);

    display:flex;
    align-items:center;
    justify-content:center;

    animation:
        corePulse 1.4s ease-in-out infinite;
}

.core::before{
    content:"";

    position:absolute;

    inset:-14px;

    border-radius:50%;

    border:
        1px solid
        rgba(125,154,255,.25);

    animation:
        coreWave 1.8s ease-out infinite;
}

.core::after{
    content:"";

    position:absolute;

    inset:-29px;

    border-radius:50%;

    border:
        1px solid
        rgba(125,154,255,.08);

    animation:
        coreWave 1.8s .5s ease-out infinite;
}

.coreText{
    position:relative;
    z-index:2;

    font-size:12px;
    font-weight:900;

    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 12px rgba(180,200,255,.9);
}

@keyframes corePulse{

    0%,
    100%{
        transform:scale(.88);
    }

    50%{
        transform:scale(1.08);
    }

}

@keyframes coreWave{

    0%{
        transform:scale(.7);
        opacity:.9;
    }

    100%{
        transform:scale(1.5);
        opacity:0;
    }

}

/* =========================================================
   DATA LINES
========================================================= */

.dataLine{
    position:absolute;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(120,150,255,.7),
            transparent
        );

    opacity:0;

    animation:
        dataAppear .8s forwards;
}

.line1{
    width:130px;
    right:calc(50% + 150px);
    top:42%;
    animation-delay:1.1s;
}

.line2{
    width:100px;
    left:calc(50% + 150px);
    top:54%;
    animation-delay:1.3s;
}

.line3{
    width:75px;
    right:calc(50% + 160px);
    top:61%;
    animation-delay:1.5s;
}

@keyframes dataAppear{

    from{
        transform:scaleX(0);
        opacity:0;
    }

    to{
        transform:scaleX(1);
        opacity:.7;
    }

}

/* =========================================================
   SCANNER
========================================================= */

.scanner{
    position:absolute;

    width:260px;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(176,195,255,.95),
            transparent
        );

    filter:
        blur(.3px)
        drop-shadow(0 0 7px #718eff);

    animation:
        scan 2.4s ease-in-out infinite;
}

@keyframes scan{

    0%{
        transform:translateY(-120px);
        opacity:0;
    }

    20%{
        opacity:.9;
    }

    50%{
        transform:translateY(120px);
        opacity:.25;
    }

    80%{
        opacity:.8;
    }

    100%{
        transform:translateY(-120px);
        opacity:0;
    }

}

/* =========================================================
   BOOT TEXT
========================================================= */

.bootBrand{
    position:absolute;

    bottom:67px;

    left:0;
    right:0;

    text-align:center;
}

.powered{
    font-size:10px;

    letter-spacing:5px;

    color:#5d6980;

    margin-bottom:10px;

    opacity:0;

    animation:
        textIn .8s .5s forwards;
}

.wfesc{
    font-size:35px;

    font-weight:900;

    letter-spacing:9px;

    background:
        linear-gradient(
            90deg,
            #59657b,
            #fff,
            #8ea7ff,
            #fff,
            #59657b
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        textShine 2.5s linear infinite,
        textIn .8s .75s forwards;

    opacity:0;
}

.engineLabel{
    margin-top:8px;

    font-size:11px;

    letter-spacing:8px;

    color:#7b879b;

    opacity:0;

    animation:
        textIn .8s 1s forwards;
}

@keyframes textShine{

    to{
        background-position:250% center;
    }

}

@keyframes textIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =========================================================
   SYSTEM STATUS
========================================================= */

.systemStatus{
    position:absolute;

    left:25px;
    right:25px;
    bottom:27px;

    display:flex;

    justify-content:space-between;

    color:#3f4a5c;

    font-size:8px;

    letter-spacing:1.5px;
}

.statusCenter{
    color:#66758d;

    animation:
        statusPulse .8s ease-in-out infinite alternate;
}

@keyframes statusPulse{

    from{
        opacity:.35;
    }

    to{
        opacity:1;
    }

}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
    position:absolute;

    bottom:47px;

    left:50%;

    width:185px;
    height:2px;

    transform:translateX(-50%);

    background:
        rgba(255,255,255,.055);

    overflow:hidden;
}

.progressBar{
    width:0;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            #708cff,
            #fff
        );

    box-shadow:
        0 0 14px rgba(111,140,255,.9);

    animation:
        bootProgress 3.65s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes bootProgress{

    0%{
        width:0;
    }

    25%{
        width:18%;
    }

    47%{
        width:39%;
    }

    68%{
        width:64%;
    }

    86%{
        width:83%;
    }

    100%{
        width:100%;
    }

}

/* =========================================================
   FINAL FLASH
========================================================= */

.finalFlash{
    position:absolute;

    inset:0;

    background:#fff;

    opacity:0;

    pointer-events:none;

    animation:
        finalFlash .5s 3.7s ease-out forwards;
}

@keyframes finalFlash{

    0%{
        opacity:0;
    }

    18%{
        opacity:.11;
    }

    100%{
        opacity:0;
    }

}

/* =========================================================
   APP
========================================================= */

#app{
    position:fixed;
    inset:0;

    opacity:0;
    transform:scale(1.025);

    background:
        radial-gradient(
            circle at 50% 20%,
            #101827,
            #05070c 45%,
            #020305
        );

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
}

#app.show{
    opacity:1;
    transform:scale(1);
}

/* =========================================================
   MAIN CONTENT
========================================================= */

.content{
    position:absolute;

    inset:0;

    padding:
        28px
        18px
        105px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    transition:
        opacity .35s ease,
        transform .35s ease;
}

/* =========================================================
   POSTS VIEW
========================================================= */

.postsView{
    width:min(100%,520px);

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:14px;
}

/* =========================================================
   POSTS SECTION LABEL
========================================================= */

.postsLabel{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 4px;

    color:#7e8aa0;

    font-size:11px;

    letter-spacing:.8px;
}

.postsLabel strong{
    color:#fff;

    font-size:16px;
}

.postsLabel span{
    opacity:.7;
}

/* =========================================================
   POST CARD
========================================================= */

.postCard{
    width:100%;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(20,26,39,.94),
            rgba(7,9,14,.94)
        );

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.42),

        inset 0 1px 0
        rgba(255,255,255,.035);

    overflow:hidden;

    backdrop-filter:blur(25px);

    transform:translateY(0);

    transition:
        transform .3s ease,
        border-color .3s ease;
}

.postCard:hover{
    transform:translateY(-3px);

    border-color:
        rgba(130,155,255,.18);
}

/* =========================================================
   POST HEADER
========================================================= */

.postHeader{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:17px 17px 13px;
}

.postAuthor{
    display:flex;

    align-items:center;

    gap:11px;
}

.postAvatar{
    width:42px;
    height:42px;

    border-radius:14px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            145deg,
            #273657,
            #0b101c
        );

    border:
        1px solid
        rgba(150,170,255,.18);

    color:#fff;

    font-size:13px;
    font-weight:900;

    box-shadow:
        0 0 20px
        rgba(80,110,255,.1);
}

.postName{
    display:flex;
    flex-direction:column;

    gap:4px;
}

.postName strong{
    font-size:13px;
}

.postName span{
    font-size:9px;

    color:#687386;
}

.postMore{
    width:32px;
    height:32px;

    border:0;

    border-radius:11px;

    background:
        rgba(255,255,255,.045);

    color:#78849a;

    font-size:17px;
}

/* =========================================================
   POST TEXT
========================================================= */

.postText{
    padding:
        4px
        18px
        17px;

    color:#d8deea;

    font-size:14px;

    line-height:1.8;

    text-align:right;
}

.postText span{
    color:#8099ff;
}

/* =========================================================
   POST MEDIA
========================================================= */

.postMedia{
    position:relative;

    height:170px;

    margin:0 14px;

    border-radius:18px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(86,112,204,.35),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            #111a2c,
            #05070c
        );
}

.postMedia::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            135deg,
            transparent 0 38%,
            rgba(130,155,255,.09) 39% 40%,
            transparent 41% 62%,
            rgba(255,255,255,.035) 63% 64%,
            transparent 65%
        );

    opacity:.8;
}

.postMedia::after{
    content:"WFESC";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:29px;

    font-weight:900;

    letter-spacing:7px;

    color:
        rgba(255,255,255,.12);

    text-shadow:
        0 0 30px
        rgba(105,135,255,.3);
}

.mediaCorner{
    position:absolute;

    right:12px;
    top:12px;

    z-index:2;

    padding:6px 9px;

    border-radius:9px;

    background:
        rgba(0,0,0,.38);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:#8f9bb0;

    font-size:8px;
}

/* =========================================================
   POST ACTIONS
========================================================= */

.postActions{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        13px 17px 16px;
}

.actionGroup{
    display:flex;

    align-items:center;

    gap:7px;
}

.postAction{
    height:34px;

    padding:0 11px;

    border:0;

    border-radius:11px;

    background:
        rgba(255,255,255,.045);

    color:#79859a;

    font-size:11px;

    transition:.25s ease;
}

.postAction:hover{
    background:
        rgba(255,255,255,.08);

    color:#fff;
}

.postAction.primary{
    color:#dbe3ff;

    background:
        rgba(95,122,220,.12);
}

.postMeta{
    color:#566175;

    font-size:9px;
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.nav{
    position:absolute;

    bottom:14px;

    left:50%;

    transform:translateX(-50%);

    width:min(94%,500px);
    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(7,9,14,.82);

    backdrop-filter:blur(22px);

    border-radius:20px;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.35);
}

.nav button{
    width:58px;
    height:48px;

    border:0;

    background:transparent;

    color:#697384;

    border-radius:15px;

    font-size:21px;

    cursor:pointer;

    transition:
        color .25s ease,
        background .25s ease,
        transform .25s ease;
}

.nav button:active{
    transform:scale(.9);
}

.nav button.active{
    color:#fff;

    background:
        rgba(255,255,255,.07);

    box-shadow:
        0 0 20px
        rgba(100,130,255,.08);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .engineCore{
        width:315px;
        height:315px;
    }

    .energyField{
        width:305px;
        height:305px;
    }

    .techRing{
        width:282px;
        height:282px;
    }

    .radar{
        width:265px;
        height:265px;
    }

    .orbit{
        width:225px;
        height:225px;
    }

    .wfesc{
        font-size:29px;
        letter-spacing:7px;
    }

    .bootBrand{

<script>

/* =========================================================
   PARTICLES
========================================================= */

const particleContainer =
    document.getElementById("particles");

for(let i = 0; i < 65; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        (45 + Math.random() * 55) + "%";

    particle.style.animationDuration =
        (2.5 + Math.random() * 4.5) + "s";

    particle.style.animationDelay =
        (Math.random() * 4) + "s";

    const size =
        .5 + Math.random() * 1.7;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    particleContainer.appendChild(
        particle
    );

}


/* =========================================================
   BOOT SEQUENCE
========================================================= */

const boot =
    document.getElementById("engineBoot");

const app =
    document.getElementById("app");

setTimeout(() => {

    boot.classList.add("hide");

    setTimeout(() => {

        app.classList.add("show");

    },250);

},4000);


/* =========================================================
   NAVIGATION
========================================================= */

const content =
    document.getElementById("content");

const buttons =
    document.querySelectorAll(".nav button");


buttons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            buttons.forEach(btn => {

                btn.classList.remove("active");

            });

            button.classList.add("active");

            const pageName =
                button.dataset.page;


            content.style.opacity = "0";

            content.style.transform =
                "translateY(12px)";


            setTimeout(() => {

                /*
                 * المنشورات تبقى واجهة المنشورات
                 * أما باقي الصفحات حالياً فهي
                 * صفحات تجريبية مؤقتة.
                 */

                if(pageName === "المنشورات"){

                    content.innerHTML = `

                        <section class="postsView">

                            <div class="postsLabel">

                                <strong>
                                    المنشورات
                                </strong>

                                <span>
                                    WFESC
                                </span>

                            </div>


                            <article class="postCard">

                                <div class="postHeader">

                                    <div class="postAuthor">

                                        <div class="postAvatar">
                                            W
                                        </div>

                                        <div class="postName">

                                            <strong>
                                                اوفس WFESC
                                            </strong>

                                            <span>
                                                منذ لحظات · WFESC
                                            </span>

                                        </div>

                                    </div>

                                    <button
                                        class="postMore"
                                        type="button">

                                        ⋯

                                    </button>

                                </div>


                                <div class="postText">

                                    ذاكرة العراق...
                                    <span>بصورة مختلفة</span>

                                    <br>

                                    مساحة مخصصة لعرض منشورات
                                    ومحتوى WFESC داخل المحرك.

                                </div>


                                <div class="postMedia">

                                    <div class="mediaCorner">
                                        منشور WFESC
                                    </div>

                                </div>


                                <div class="postActions">

                                    <div class="actionGroup">

                                        <button
                                            class="postAction primary"
                                            type="button">

                                            ♡ إعجاب

                                        </button>

                                        <button
                                            class="postAction"
                                            type="button">

                                            💬 تعليق

                                        </button>

                                        <button
                                            class="postAction"
                                            type="button">

                                            ↗ مشاركة

                                        </button>

                                    </div>

                                    <span class="postMeta">
                                        0 تفاعل
                                    </span>

                                </div>

                            </article>

                        </section>

                    `;

                }else{

                    content.innerHTML = `

                        <section class="postsView">

                            <div class="postsLabel">

                                <strong>
                                    ${pageName}
                                </strong>

                                <span>
                                    WFESC
                                </span>

                            </div>

                            <article class="postCard">

                                <div class="postHeader">

                                    <div class="postAuthor">

                                        <div class="postAvatar">
                                            W
                                        </div>

                                        <div class="postName">

                                                WFESC ENGINE

                                    قيد البناء داخل
                                    <span>
                                        WFESC ENGINE

                            </article>

                        </section>

                    `;

                }


                content.style.transition =
                    "opacity .35s ease, transform .35s ease";

                content.style.opacity = "1";

                content.style.transform =
                    "translateY(0)";

            },180);

        }
    );

});
