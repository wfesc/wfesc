<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعدادات WFESC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    transition:.3s;
}

.settings{
    max-width:600px;
    margin:auto;
    padding:30px 20px;
}

.back{
    display:inline-block;
    color:#aaa;
    text-decoration:none;
    margin-bottom:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.box{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:20px;
}

.option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 5px;
    border-bottom:1px solid #222;
}

.option:last-child{
    border-bottom:none;
}

.option-text h3{
    font-size:18px;
    margin-bottom:6px;
}

.option-text p{
    color:#888;
    font-size:13px;
}

button{
    border:0;
    border-radius:12px;
    padding:11px 18px;
    cursor:pointer;
    font-size:14px;
    background:#222;
    color:#fff;
}

button.active{
    background:#fff;
    color:#000;
}

/* الوضع الأبيض */

body.light{
    background:#f5f5f5;
    color:#111;
}

body.light .back{
    color:#555;
}

body.light .box{
    background:#fff;
    border-color:#ddd;
}

body.light .option{
    border-color:#ddd;
}

body.light .option-text p{
    color:#666;
}

body.light button{
    background:#eee;
    color:#111;
}

body.light button.active{
    background:#111;
    color:#fff;
}
</style>
</head>

<body>

<div class="settings">

    <a href="index.html" class="back">← العودة إلى الموقع</a>

    <h1>إعدادات WFESC</h1>

    <div class="box">

        <div class="option">
            <div class="option-text">
                <h3>🌙 الوضع المظلم</h3>
                <p>استخدام المظهر الداكن للموقع</p>
            </div>

            <button id="darkBtn" onclick="setTheme('dark')">
                تفعيل
            </button>
        </div>

        <div class="option">
            <div class="option-text">
                <h3>☀️ الوضع العادي</h3>
                <p>استخدام المظهر الأبيض للموقع</p>
            </div>

            <button id="lightBtn" onclick="setTheme('light')">
                تفعيل
            </button>
        </div>

    </div>

</div>

<script>
function setTheme(theme){

    localStorage.setItem("wfesc-theme", theme);

    updateButtons();
}

function updateButtons(){

    const theme = localStorage.getItem("wfesc-theme") || "dark";

    document.body.classList.toggle("light", theme === "light");

    document.getElementById("darkBtn").classList.toggle(
        "active",
        theme === "dark"
    );

    document.getElementById("lightBtn").classList.toggle(
        "active",
        theme === "light"
    );
}

updateButtons();
</script>

</body>
</html>
