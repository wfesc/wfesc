<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الإعدادات - WFESC</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #eee;
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            padding-bottom: 100px;

            transition:
                background .35s ease,
                color .35s ease;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .settings-page {
            width: min(100%, 760px);
            margin: auto;
            padding: 25px 16px 40px;
        }

        .settings-header {
            margin-bottom: 25px;
        }

        .settings-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .settings-header p {
            color: #999;
            font-size: 14px;
        }

        .settings-section {
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 14px;
            color: #888;
            margin: 0 8px 9px;
        }

        .settings-card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, .18);

            transition:
                background .35s ease,
                border-color .35s ease,
                box-shadow .35s ease;
        }

        .setting-row {
            min-height: 72px;
            padding: 14px 17px;

            display: flex;
            align-items: center;
            gap: 14px;

            border-bottom: 1px solid #222;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;

            border-radius: 13px;
            background: #1b1b1b;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .setting-info {
            flex: 1;
            min-width: 0;
        }

        .setting-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .setting-description {
            color: #888;
            font-size: 12px;
            line-height: 1.5;
        }


        /* =========================
           SWITCH
        ========================== */

        .switch {
            position: relative;
            width: 48px;
            height: 27px;
            flex-shrink: 0;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #333;
            border-radius: 30px;

            cursor: pointer;

            transition: .25s ease;
        }

        .slider::before {
            content: "";

            position: absolute;

            width: 21px;
            height: 21px;

            top: 3px;
            right: 3px;

            background: #fff;
            border-radius: 50%;

            transition: .25s ease;
        }

        .switch input:checked + .slider {
            background: #fff;
        }

        .switch input:checked + .slider::before {
            transform: translateX(-21px);
            background: #050505;
        }


        /* =========================
           THEMES
        ========================== */

        .theme-buttons {
            display: flex;
            gap: 10px;
            padding: 15px;
        }

        .theme-button {
            flex: 1;

            border: 1px solid #292929;
            background: #171717;
            color: #ddd;

            border-radius: 14px;
            padding: 13px 10px;

            cursor: pointer;

            transition: .25s ease;
        }

        .theme-button:hover {
            background: #222;
        }

        .theme-button.active {
            background: #eee;
            color: #050505;
            border-color: #eee;
        }

        .theme-icon {
            display: block;
            font-size: 21px;
            margin-bottom: 6px;
        }

        .theme-text {
            font-size: 13px;
            font-weight: bold;
        }


        /* =========================
           ACCOUNT
        ========================== */

        .account-buttons {
            padding: 15px;

            display: grid;
            gap: 10px;
        }

        .account-button {
            width: 100%;
            min-height: 52px;

            border: 1px solid #292929;
            background: #171717;
            color: #eee;

            border-radius: 14px;

            cursor: pointer;

            font-size: 15px;
            font-weight: bold;

            transition: .25s ease;
        }

        .account-button:hover {
            background: #222;
        }

        .account-button.primary {
            background: #eee;
            color: #050505;
            border-color: #eee;
        }

        .account-button.primary:hover {
            background: #fff;
        }

        .account-button.forgot {
            color: #aaa;
            font-size: 13px;
            font-weight: normal;
        }


        /* =========================
           LOGGED IN ACCOUNT
        ========================== */

        .logged-in-account {
            display: none;
            padding: 18px;
        }

        .logged-in-profile {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 15px;
        }

        .logged-in-avatar-wrap {
            width: 68px;
            height: 68px;
            min-width: 68px;

            border-radius: 50%;

            overflow: hidden;

            background: #1b1b1b;

            border: 2px solid #333;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logged-in-avatar {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }

        .logged-in-avatar-fallback {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-weight: bold;

            color: #eee;
        }

        .logged-in-info {
            min-width: 0;
            flex: 1;
        }

        .logged-in-username {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 6px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logged-in-status {
            color: #999;
            font-size: 13px;
        }

        .logged-in-account .account-button {
            margin-top: 3px;
        }


        /* =========================
           STATUS
        ========================== */

        .settings-status {
            position: fixed;

            left: 50%;
            bottom: 92px;

            transform: translate(-50%, 20px);

            background: #eee;
            color: #050505;

            padding: 11px 17px;
            border-radius: 12px;

            font-size: 13px;

            opacity: 0;
            pointer-events: none;

            transition: .3s ease;

            z-index: 10000;

            white-space: nowrap;
        }

        .settings-status.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }


        /* =========================
           MODAL
        ========================== */

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .72);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition: .25s ease;

            z-index: 20000;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-box {
            width: min(100%, 430px);

            background: #111;

            border: 1px solid #292929;
            border-radius: 22px;

            padding: 22px;

            transform:
                translateY(20px)
                scale(.97);

            transition: .25s ease;
        }

        .modal.show .modal-box {
            transform:
                translateY(0)
                scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 21px;
        }

        .close-modal {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 50%;

            background: #222;
            color: #fff;

            font-size: 18px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #aaa;
            font-size: 13px;
        }

        .form-input {
            width: 100%;
            height: 48px;

            border: 1px solid #292929;
            border-radius: 13px;

            outline: none;

            background: #191919;
            color: #fff;

            padding: 0 14px;

            font-size: 14px;
        }

        .form-input:focus {
            border-color: #555;
        }

        .modal-action {
            width: 100%;
            height: 50px;

            margin-top: 6px;

            border: none;
            border-radius: 13px;

            background: #eee;
            color: #050505;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .modal-note {
            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 12px;

            line-height: 1.6;
        }


        /* =========================
           LIGHT MODE
        ========================== */

        html.wfesc-light-mode body {
            background: #f3f3f3;
            color: #111;
        }

        html.wfesc-light-mode .settings-header p {
            color: #666;
        }

        html.wfesc-light-mode .section-title {
            color: #666;
        }

        html.wfesc-light-mode .settings-card {
            background: #fff;
            border-color: #ddd;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, .07);
        }

        html.wfesc-light-mode .setting-row {
            border-color: #e8e8e8;
        }

        html.wfesc-light-mode .setting-icon {
            background: #f0f0f0;
        }

        html.wfesc-light-mode .setting-description {
            color: #777;
        }

        html.wfesc-light-mode .theme-button,
        html.wfesc-light-mode .account-button {
            background: #f5f5f5;
            color: #111;
            border-color: #ddd;
        }

        html.wfesc-light-mode .theme-button:hover,
        html.wfesc-light-mode .account-button:hover {
            background: #e9e9e9;
        }

        html.wfesc-light-mode .theme-button.active {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        html.wfesc-light-mode .account-button.primary {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        html.wfesc-light-mode .modal-box {
            background: #fff;
            color: #111;
            border-color: #ddd;
        }

        html.wfesc-light-mode .close-modal {
            background: #eee;
            color: #111;
        }

        html.wfesc-light-mode .form-input {
            background: #f5f5f5;
            color: #111;
            border-color: #ddd;
        }

        html.wfesc-light-mode .form-group label {
            color: #666;
        }

        html.wfesc-light-mode .logged-in-avatar-wrap {
            background: #f0f0f0;
            border-color: #ddd;
        }

        html.wfesc-light-mode .logged-in-avatar-fallback {
            color: #111;
        }


        /* =========================
           ANIMATION OFF
        ========================== */

        html.wfesc-animation-off *,
        html.wfesc-animation-off *::before,
        html.wfesc-animation-off *::after {
            animation-duration: 0s !important;
            animation-delay: 0s !important;

            transition-duration: 0s !important;

            scroll-behavior: auto !important;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            .settings-page {
                padding: 20px 12px 35px;
            }

            .settings-header h1 {
                font-size: 26px;
            }

            .setting-row {
                padding: 13px;
            }

            .setting-name {
                font-size: 15px;
            }

            .theme-buttons {
                gap: 7px;
                padding: 12px;
            }

            .theme-button {
                padding: 11px 6px;
            }

            .logged-in-account {
                padding: 15px;
            }

            .logged-in-avatar-wrap {
                width: 58px;
                height: 58px;
                min-width: 58px;
            }

            .logged-in-username {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

        <p>

<!-- =====================================================
     WFESC GLOBAL SETTINGS
     لا يوجد هنا اتصال بقاعدة البيانات
     ===================================================== -->

<script>

"use strict";

(function () {

    const ANIMATION_KEY =
        "wfesc_animation_enabled";

    const THEME_KEY =
        "wfesc_theme";


    function readAnimation() {

        const value =
            localStorage.getItem(
                ANIMATION_KEY
            );

        if (value === null) {
            return true;
        }

        return value === "true";
    }


    function readTheme() {

        const value =
            localStorage.getItem(
                THEME_KEY
            );

        if (
            value !== "light" &&
            value !== "dark"
        ) {
            return "dark";
        }

        return value;
    }


    function applyTheme(theme) {

        document.documentElement.classList.toggle(
            "wfesc-light-mode",
            theme === "light"
        );

    }


    function applyAnimation(enabled) {

        document.documentElement.classList.toggle(
            "wfesc-animation-off",
            !enabled
        );

    }


    window.WFESCGlobalSettings = {

        getAnimationEnabled: function () {

            return readAnimation();

        },


        setAnimationEnabled: function (enabled) {

            enabled = !!enabled;

            localStorage.setItem(
                ANIMATION_KEY,
                enabled
                    ? "true"
                    : "false"
            );

            applyAnimation(
                enabled
            );

            window.dispatchEvent(
                new CustomEvent(
                    "wfesc:settings-changed",
                    {
                        detail: {
                            type: "animation",
                            value: enabled
                        }
                    }
                )
            );

        },


        getTheme: function () {

            return readTheme();

        },


        setTheme: function (theme) {

            if (
                theme !== "light" &&
                theme !== "dark"
            ) {

                theme = "dark";

            }

            localStorage.setItem(
                THEME_KEY,
                theme
            );

            applyTheme(
                theme
            );

            window.dispatchEvent(
                new CustomEvent(
                    "wfesc:settings-changed",
                    {
                        detail: {
                            type: "theme",
                            value: theme
                        }
                    }
                )
            );

        },


        apply: function () {

            applyTheme(
                readTheme()
            );

            applyAnimation(
                readAnimation()
            );

        }

    };


    window.WFESCGlobalSettings.apply();

})();


/* =====================================================
   SETTINGS UI
===================================================== */

const animationToggle =
    document.getElementById(
        "animationToggle"
    );


const darkThemeButton =
    document.getElementById(
        "darkThemeButton"
    );


const lightThemeButton =
    document.getElementById(
        "lightThemeButton"
    );


const settingsStatus =
    document.getElementById(
        "settingsStatus"
    );


function showStatus(message) {

    settingsStatus.textContent =
        message;

    settingsStatus.classList.add(
        "show"
    );

    clearTimeout(
        window.__wfescSettingsStatusTimer
    );

    window.__wfescSettingsStatusTimer =
        setTimeout(
            function () {

                settingsStatus.classList.remove(
                    "show"
                );

            },
            2500
        );

}


function updateSettingsUI() {

    const animation =
        WFESCGlobalSettings
            .getAnimationEnabled();


    const theme =
        WFESCGlobalSettings
            .getTheme();


    animationToggle.checked =
        animation;


    darkThemeButton.classList.toggle(
        "active",
        theme === "dark"
    );


    lightThemeButton.classList.toggle(
        "active",
        theme === "light"
    );

}


/* =====================================================
   ANIMATION
===================================================== */

animationToggle.addEventListener(
    "change",
    function () {

        WFESCGlobalSettings
            .setAnimationEnabled(
                animationToggle.checked
            );


        showStatus(
            animationToggle.checked
                ? "تم تشغيل الأنميشن"
                : "تم إيقاف الأنميشن"
        );

    }
);


/* =====================================================
   THEME
===================================================== */

darkThemeButton.addEventListener(
    "click",
    function () {

        WFESCGlobalSettings
            .setTheme(
                "dark"
            );


        updateSettingsUI();


        showStatus(
            "تم تفعيل الوضع المظلم"
        );

    }
);


lightThemeButton.addEventListener(
    "click",
    function () {

        WFESCGlobalSettings
            .setTheme(
                "light"
            );


        updateSettingsUI();


        showStatus(
            "تم تفعيل الوضع العادي"
        );

    }
);


/* =====================================================
   OTHER TABS / PAGES
===================================================== */

window.addEventListener(
    "wfesc:settings-changed",
    function () {

        updateSettingsUI();

    }
);


window.addEventListener(
    "storage",
    function (event) {

        if (
            event.key ===
                "wfesc_theme" ||

            event.key ===
                "wfesc_animation_enabled"
        ) {

            WFESCGlobalSettings.apply();

            updateSettingsUI();

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateSettingsUI();

</script>

<!-- =====================================================
     LOGGED IN ACCOUNT UI
     ===================================================== -->

<script>

"use strict";

(function () {

    function getElement(id) {

        return document.getElementById(id);

    }


    function getFallbackLetter(username) {

        const text =
            String(username || "W").trim();

        if (!text) {
            return "W";
        }

        return text.charAt(0).toUpperCase();

    }


    function updateLoggedInUI() {

        const accountButtons =
            getElement("accountButtons");

        const loggedInAccount =
            getElement("loggedInAccount");

        const loggedInAvatar =
            getElement("loggedInAvatar");

        const loggedInAvatarFallback =
            getElement("loggedInAvatarFallback");

        const loggedInUsername =
            getElement("loggedInUsername");


        if (
            !accountButtons ||
            !loggedInAccount ||
            !loggedInAvatar ||
            !loggedInAvatarFallback ||
            !loggedInUsername
        ) {
            return;
        }


        const auth =
            window.WFESCSettingsAuth;


        if (!auth) {

            accountButtons.style.display =
                "grid";

            loggedInAccount.style.display =
                "none";

            return;

        }


        const user =
            auth.getUser();


        if (!user) {

            accountButtons.style.display =
                "grid";

            loggedInAccount.style.display =
                "none";

            loggedInAvatar.removeAttribute(
                "src"
            );

            loggedInAvatar.style.display =
                "none";

            loggedInAvatarFallback.style.display =
                "flex";

            loggedInAvatarFallback.textContent =
                "W";

            loggedInUsername.textContent =
                "مستخدم WFESC";

            return;

        }


        const profile =
            auth.getProfile() || {};


        const metadata =
            user.user_metadata || {};


        const username =
            profile.username ||
            metadata.username ||
            (
                user.email
                    ? user.email.split("@")[0]
                    : "مستخدم WFESC"
            );


        const avatar =
            profile.avatar_url ||
            "";


        accountButtons.style.display =
            "none";

        loggedInAccount.style.display =
            "block";


        loggedInUsername.textContent =
            username;


        loggedInAvatarFallback.textContent =
            getFallbackLetter(
                username
            );


        if (avatar) {

            loggedInAvatar.src =
                avatar;

            loggedInAvatar.style.display =
                "block";

            loggedInAvatarFallback.style.display =
                "none";

        } else {

            loggedInAvatar.removeAttribute(
                "src"
            );

            loggedInAvatar.style.display =
                "none";

            loggedInAvatarFallback.style.display =
                "flex";

        }

    }


    async function waitForAuth() {

        for (
            let i = 0;
            i < 100;
            i++
        ) {

            if (
                window.WFESCSettingsAuth
            ) {

                updateLoggedInUI();

                return;

            }

            await new Promise(
                function (resolve) {

                    setTimeout(
                        resolve,
                        50
                    );

                }
            );

        }

        updateLoggedInUI();

    }


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            waitForAuth();

        }
    );


    window.addEventListener(
        "WFESCAuthChanged",
        function () {

            setTimeout(
                function () {

                    updateLoggedInUI();

                },
                50
            );

        }
    );


    window.addEventListener(
        "WFESCProfileUpdated",
        function () {

            setTimeout(
                function () {

                    updateLoggedInUI();

                },
                50
            );

        }
    );


    const logoutButton =
        getElement(
            "logoutAccountButton"
        );


    if (logoutButton) {

        logoutButton.addEventListener(
            "click",
            async function () {

                const auth =
                    window.WFESCSettingsAuth;


                if (!auth) {
                    return;
                }


                logoutButton.disabled =
                    true;


                try {

                    await auth.signOut();


                    updateLoggedInUI();


                    if (
                        typeof showStatus ===
                        "function"
                    ) {

                        showStatus(
                            "تم تسجيل الخروج"
                        );

                    }

                } catch (error) {

                    console.error(
                        "WFESC logout error:",
                        error
                    );

                    if (
                        typeof showStatus ===
                        "function"
                    ) {

                        showStatus(
                            "تعذر تسجيل الخروج"
                        );

                    }

                } finally {

                    logoutButton.disabled =
                        false;

                }

            }
        );

    }

    updateLoggedInUI();

})();

</script>
