<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الإعدادات - WFESC</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #050505;
            color: #eee;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            min-height: 100vh;

            padding-bottom: 100px;

            transition:
                background .3s ease,
                color .3s ease;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* =================================================
           PAGE
        ================================================= */

        .settings-page {

            width: min(100%, 760px);

            margin: auto;

            padding:
                25px
                16px
                40px;
        }


        .settings-header {
            margin-bottom: 25px;
        }


        .settings-header h1 {

            font-size: 30px;

            margin-bottom: 7px;
        }


        .settings-header p {

            color: #999;

            font-size: 14px;
        }


        /* =================================================
           SECTION
        ================================================= */

        .settings-section {

            margin-bottom: 22px;
        }


        .section-title {

            font-size: 14px;

            color: #888;

            margin:
                0
                8px
                9px;
        }


        /* =================================================
           SETTINGS CARD
        ================================================= */

        .settings-card {

            background: #111;

            border:
                1px solid
                #242424;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0
                8px
                30px
                rgba(0,0,0,.18);

            transition:
                background .3s ease,
                border-color .3s ease,
                box-shadow .3s ease,
                backdrop-filter .3s ease,
                -webkit-backdrop-filter .3s ease;
        }


        /* =================================================
           ROW
        ================================================= */

        .setting-row {

            min-height: 72px;

            padding:
                14px
                17px;

            display: flex;

            align-items: center;

            gap: 14px;

            border-bottom:
                1px solid
                #222;

            transition:
                background .3s ease,
                border-color .3s ease;
        }


        .setting-row:last-child {
            border-bottom: none;
        }


        .setting-icon {

            width: 42px;
            height: 42px;

            min-width: 42px;

            border-radius: 13px;

            background: #1b1b1b;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 20px;

            transition:
                background .3s ease,
                border .3s ease,
                box-shadow .3s ease;
        }


        .setting-info {

            flex: 1;

            min-width: 0;
        }


        .setting-name {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 4px;
        }


        .setting-description {

            color: #888;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =================================================
           SWITCH
        ================================================= */

        .switch {

            position: relative;

            width: 48px;
            height: 27px;

            flex-shrink: 0;
        }


        .switch input {
            display: none;
        }


        .slider {

            position: absolute;

            inset: 0;

            background: #333;

            border-radius: 30px;

            cursor: pointer;

            transition: .25s ease;
        }


        .slider::before {

            content: "";

            position: absolute;

            width: 21px;
            height: 21px;

            top: 3px;
            right: 3px;

            background: #fff;

            border-radius: 50%;

            transition: .25s ease;
        }


        .switch input:checked + .slider {
            background: #fff;
        }


        .switch input:checked + .slider::before {

            transform:
                translateX(-21px);

            background: #050505;
        }


        /* =================================================
           THEME
        ================================================= */

        .theme-buttons {

            display: flex;

            gap: 10px;

            padding: 15px;
        }


        .theme-button {

            flex: 1;

            min-height: 70px;

            border:
                1px solid
                #292929;

            background: #171717;

            color: #ddd;

            border-radius: 14px;

            padding:
                13px
                10px;

            cursor: pointer;

            transition:
                .25s ease,
                background .3s ease,
                border .3s ease,
                color .3s ease;
        }


        .theme-button:hover {
            background: #222;
        }


        .theme-button.active {

            background: #eee;

            color: #050505;

            border-color: #eee;
        }


        .theme-icon {

            display: block;

            font-size: 21px;

            margin-bottom: 6px;
        }


        .theme-text {

            font-size: 13px;

            font-weight: bold;
        }


        /* =================================================
           ACCOUNT
        ================================================= */

        #settingsAccountApp {
            width: 100%;
        }


        .account-buttons {

            padding: 15px;

            display: grid;

            gap: 10px;
        }


        .account-button {

            width: 100%;

            min-height: 52px;

            border:
                1px solid
                #292929;

            background: #171717;

            color: #eee;

            border-radius: 14px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            transition:
                .25s ease,
                background .3s ease,
                border .3s ease;
        }


        .account-button:hover {
            background: #222;
        }


        .account-button:disabled {

            opacity: .55;

            cursor: not-allowed;
        }


        .account-button.primary {

            background: #eee;

            color: #050505;

            border-color: #eee;
        }


        .account-button.primary:hover {
            background: #fff;
        }


        .account-button.forgot {

            color: #aaa;

            font-size: 13px;

            font-weight: normal;
        }


        /* =================================================
           LOGGED IN
        ================================================= */

        .logged-in-account {

            padding: 18px;
        }


        .logged-in-profile {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 15px;
        }


        .logged-in-avatar-wrap {

            width: 68px;
            height: 68px;

            min-width: 68px;

            border-radius: 50%;

            overflow: hidden;

            background: #1b1b1b;

            border:
                2px solid
                #333;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .logged-in-avatar {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }


        .logged-in-avatar-fallback {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 24px;

            font-weight: bold;

            color: #eee;
        }


        .logged-in-info {

            min-width: 0;

            flex: 1;
        }


        .logged-in-username {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 6px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .logged-in-status {

            color: #999;

            font-size: 13px;
        }


        /* =================================================
           STATUS
        ================================================= */

        .settings-status {

            position: fixed;

            left: 50%;

            bottom: 92px;

            transform:
                translate(
                    -50%,
                    20px
                );

            background: #eee;

            color: #050505;

            padding:
                11px
                17px;

            border-radius: 12px;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition: .3s ease;

            z-index: 10000;

            max-width:
                calc(100% - 30px);

            text-align: center;
        }


        .settings-status.show {

            opacity: 1;

            transform:
                translate(
                    -50%,
                    0
                );
        }


        /* =================================================
           MODAL
        ================================================= */

        .modal {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.72);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition: .25s ease;

            z-index: 20000;
        }


        .modal.show {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        .modal-box {

            width:
                min(
                    100%,
                    430px
                );

            max-height:
                calc(
                    100vh - 40px
                );

            overflow-y: auto;

            background: #111;

            border:
                1px solid
                #292929;

            border-radius: 22px;

            padding: 22px;

            transform:
                translateY(20px)
                scale(.97);

            transition: .25s ease;
        }


        .modal.show .modal-box {

            transform:
                translateY(0)
                scale(1);
        }


        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 20px;
        }


        .modal-header h2 {
            font-size: 21px;
        }


        .close-modal {

            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 50%;

            background: #222;

            color: #fff;

            font-size: 18px;

            cursor: pointer;
        }


        .form-group {
            margin-bottom: 13px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #aaa;

            font-size: 13px;
        }


        .form-input {

            width: 100%;

            height: 48px;

            border:
                1px solid
                #292929;

            border-radius: 13px;

            outline: none;

            background: #191919;

            color: #fff;

            padding:
                0
                14px;

            font-size: 14px;
        }


        .form-input:focus {
            border-color: #555;
        }


        .modal-action {

            width: 100%;

            height: 50px;

            margin-top: 6px;

            border: none;

            border-radius: 13px;

            background: #eee;

            color: #050505;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .modal-action:disabled {
            opacity: .55;
        }


        .modal-note {

            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 12px;

            line-height: 1.6;
        }


        /* =================================================
           ABOUT
        ================================================= */

        .about-card {
            text-align: center;
        }


        .about-image-wrap {

            padding:
                25px
                20px
                18px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .about-image {

            width: 110px;
            height: 110px;

            object-fit: cover;

            border-radius: 50%;

            display: block;

            border:
                1px solid
                #292929;

            box-shadow:
                0
                8px
                30px
                rgba(0,0,0,.3);
        }


        .about-name {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .about-rights {

            padding:
                0
                20px
                22px;

            color: #888;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =================================================
           LIQUID GLASS
        ================================================= */

        html.wfesc-liquid-glass {

            --wfesc-glass-bg:
                rgba(255,255,255,.055);

            --wfesc-glass-border:
                rgba(255,255,255,.13);

            --wfesc-glass-highlight:
                rgba(255,255,255,.08);

            --wfesc-glass-shadow:
                rgba(0,0,0,.30);
        }


        html.wfesc-liquid-glass
        .settings-card {

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border-color:
                rgba(255,255,255,.13);

            box-shadow:
                0
                12px
                40px
                rgba(0,0,0,.28),
                inset
                0
                1px
                0
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(24px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(24px)
                saturate(150%);
        }


        html.wfesc-liquid-glass
        .setting-row {

            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025),
                    transparent
                );

            border-color:
                rgba(255,255,255,.08);
        }


        html.wfesc-liquid-glass
        .setting-icon {

            background:
                rgba(255,255,255,.065);

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                inset
                0
                1px
                0
                rgba(255,255,255,.07);
        }


        html.wfesc-liquid-glass
        .theme-button,
        html.wfesc-liquid-glass
        .account-button {

            background:
                rgba(255,255,255,.045);

            border-color:
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(18px)
                saturate(145%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(145%);

            box-shadow:
                inset
                0
                1px
                0
                rgba(255,255,255,.06);
        }


        html.wfesc-liquid-glass
        .theme-button:hover,
        html.wfesc-liquid-glass
        .account-button:hover {

            background:
                rgba(255,255,255,.085);

            border-color:
                rgba(255,255,255,.17);
        }


        html.wfesc-liquid-glass
        .account-button.primary,
        html.wfesc-liquid-glass
        .modal-action {

            background:
                rgba(255,255,255,.88);

            color: #050505;

            border-color:
                rgba(255,255,255,.8);

            box-shadow:
                inset
                0
                1px
                0
                rgba(255,255,255,.8),
                0
                8px
                25px
                rgba(0,0,0,.2);
        }


        html.wfesc-liquid-glass
        .form-input {

            background:
                rgba(255,255,255,.045);

            border-color:
                rgba(255,255,255,.13);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            box-shadow:
                inset
                0
                1px
                0
                rgba(255,255,255,.05);
        }


        html.wfesc-liquid-glass
        .logged-in-avatar-wrap {

            background:
                rgba(255,255,255,.055);

            border-color:
                rgba(255,255,255,.15);

            box-shadow:
                0
                8px
                25px
                rgba(0,0,0,.25),
                inset
                0
                1px
                0
                rgba(255,255,255,.08);
        }


        html.wfesc-liquid-glass
        .modal-box {

            background:
                linear-gradient(
                    135deg,
                    rgba(25,25,25,.88),
                    rgba(10,10,10,.82)
                );

            border-color:
                rgba(255,255,255,.14);

            box-shadow:
                0
                25px
                70px
                rgba(0,0,0,.5),
                inset
                0
                1px
                0
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(30px)
                saturate(155%);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(155%);
        }


        html.wfesc-liquid-glass
        .close-modal {

            background:
                rgba(255,255,255,.07);

            border:
                1px solid
                rgba(255,255,255,.10);
        }


        html.wfesc-liquid-glass
        .settings-status {

            background:
                rgba(245,245,245,.88);

            box-shadow:
                0
                10px
                35px
                rgba(0,0,0,.3);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }


        html.wfesc-liquid-glass
        .about-image {

            border-color:
                rgba(255,255,255,.18);

            box-shadow:
                0
                12px
                35px
                rgba(0,0,0,.35),
                inset
                0
                1px
                0
                rgba(255,255,255,.12);
        }


        /* =================================================
           LIGHT MODE
        ================================================= */

        html.wfesc-light-mode body {

            background: #f3f3f3;

            color: #111;
        }


        html.wfesc-light-mode
        .settings-header p {
            color: #666;
        }


        html.wfesc-light-mode
        .section-title {
            color: #666;
        }


        html.wfesc-light-mode
        .settings-card {

            background: #fff;

            border-color: #ddd;

            box-shadow:
                0
                8px
                30px
                rgba(0,0,0,.07);
        }


        html.wfesc-light-mode
        .setting-row {
            border-color: #e8e8e8;
        }


        html.wfesc-light-mode
        .setting-icon {
            background: #f0f0f0;
        }


        html.wfesc-light-mode
        .setting-description {
            color: #777;
        }


        html.wfesc-light-mode
        .theme-button,
        html.wfesc-light-mode
        .account-button {

            background: #f5f5f5;

            color: #111;

            border-color: #ddd;
        }


        html.wfesc-light-mode
        .theme-button:hover,
        html.wfesc-light-mode
        .account-button:hover {
            background: #e9e9e9;
        }


        html.wfesc-light-mode
        .theme-button.active {

            background: #111;

            color: #fff;

            border-color: #111;
        }


        html.wfesc-light-mode
        .account-button.primary {

            background: #111;

            color: #fff;

            border-color: #111;
        }


        html.wfesc-light-mode
        .modal-box {

            background: #fff;

            color: #111;

            border-color: #ddd;
        }


        html.wfesc-light-mode
        .close-modal {

            background: #eee;

            color: #111;
        }


        html.wfesc-light-mode
        .form-input {

            background: #f5f5f5;

            color: #111;

            border-color: #ddd;
        }


        html.wfesc-light-mode
        .form-group label {
            color: #666;
        }


        html.wfesc-light-mode
        .logged-in-avatar-wrap {

            background: #f0f0f0;

            border-color: #ddd;
        }


        html.wfesc-light-mode
        .logged-in-avatar-fallback {
            color: #111;
        }


        /* =================================================
           LIGHT + LIQUID GLASS
        ================================================= */

        html.wfesc-light-mode.wfesc-liquid-glass
        .settings-card {

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.72),
                    rgba(255,255,255,.48)
                );

            border-color:
                rgba(0,0,0,.10);

            box-shadow:
                0
                12px
                40px
                rgba(0,0,0,.10),
                inset
                0
                1px
                0
                rgba(255,255,255,.9);
        }


        html.wfesc-light-mode.wfesc-liquid-glass
        .setting-row {

            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.28),
                    transparent
                );

            border-color:
                rgba(0,0,0,.07);
        }


        html.wfesc-light-mode.wfesc-liquid-glass
        .setting-icon {

            background:
                rgba(255,255,255,.45);

            border-color:
                rgba(0,0,0,.07);
        }


        html.wfesc-light-mode.wfesc-liquid-glass
        .theme-button,
        html.wfesc-light-mode.wfesc-liquid-glass
        .account-button {

            background:
                rgba(255,255,255,.45);

            border-color:
                rgba(0,0,0,.10);

            box-shadow:
                inset
                0
                1px
                0
                rgba(255,255,255,.8);
        }


        html.wfesc-light-mode.wfesc-liquid-glass
        .form-input {

            background:
                rgba(255,255,255,.42);

            color: #111;

            border-color:
                rgba(0,0,0,.10);
        }


        html.wfesc-light-mode.wfesc-liquid-glass
        .modal-box {

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.88),
                    rgba(245,245,245,.78)
                );

            border-color:
                rgba(0,0,0,.10);

            box-shadow:
                0
                25px
                70px
                rgba(0,0,0,.18),
                inset
                0
                1px
                0
                rgba(255,255,255,.95);
        }


        /* =================================================
           ANIMATION OFF
        ================================================= */

        html.wfesc-animation-off *,
        html.wfesc-animation-off *::before,
        html.wfesc-animation-off *::after {

            animation-duration:
                0s !important;

            animation-delay:
                0s !important;

            transition-duration:
                0s !important;

            scroll-behavior:
                auto !important;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 500px) {

            .settings-page {

                padding:
                    20px
                    12px
                    35px;
            }


            .settings-header h1 {
                font-size: 26px;
            }


            .setting-row {
                padding: 13px;
            }


            .setting-name {
                font-size: 15px;
            }


            .theme-buttons {

                gap: 7px;

                padding: 12px;
            }


            .theme-button {
                padding: 11px 6px;
            }


            .logged-in-account {
                padding: 15px;
            }


            .logged-in-avatar-wrap {

                width: 58px;
                height: 58px;

                min-width: 58px;
            }


            .logged-in-username {
                font-size: 16px;
            }


            .about-image {

                width: 95px;
                height: 95px;
            }

        }

    </style>


    <!-- =================================================
         تطبيق الإعدادات المحفوظة قبل ظهور الصفحة
    ================================================== -->

    <script>

        (function () {

            try {

                const theme =
                    localStorage.getItem(
                        "wfesc-theme"
                    );

                if (theme === "light") {

                    document.documentElement
                        .classList
                        .add(
                            "wfesc-light-mode"
                        );

                } else {

                    document.documentElement
                        .classList
                        .add(
                            "wfesc-dark-mode"
                        );

                }


                const glass =
                    localStorage.getItem(
                        "wfesc-liquid-glass"
                    );


                if (
                    glass === null ||
                    glass === "on"
                ) {

                    document.documentElement
                        .classList
                        .add(
                            "wfesc-liquid-glass"
                        );

                }

            } catch (error) {

                document.documentElement
                    .classList
                    .add(
                        "wfesc-dark-mode"
                    );

                document.documentElement
                    .classList
                    .add(
                        "wfesc-liquid-glass"
                    );

            }

        })();

    </script>

</head>


<body>


<main class="settings-page">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="settings-header">

        <h1>

<!-- =================================================
     SETTINGS THEME
================================================== -->

<script>

(function () {

    "use strict";


    const THEME_KEY =
        "wfesc-theme";


    const darkButton =
        document.getElementById(
            "darkThemeButton"
        );


    const lightButton =
        document.getElementById(
            "lightThemeButton"
        );


    function getTheme() {

        try {

            const saved =
                localStorage.getItem(
                    THEME_KEY
                );


            if (
                saved === "light" ||
                saved === "dark"
            ) {

                return saved;

            }

        } catch (error) {

            console.warn(
                "WFESC Theme:",
                error
            );

        }


        return "dark";

    }


    function applyTheme(theme) {

        if (
            theme !== "light" &&
            theme !== "dark"
        ) {

            theme = "dark";

        }


        const html =
            document.documentElement;


        if (theme === "light") {

            html.classList.add(
                "wfesc-light-mode"
            );

            html.classList.remove(
                "wfesc-dark-mode"
            );

        } else {

            html.classList.add(
                "wfesc-dark-mode"
            );

            html.classList.remove(
                "wfesc-light-mode"
            );

        }


        try {

            localStorage.setItem(
                THEME_KEY,
                theme
            );

        } catch (error) {

            console.warn(
                "WFESC Theme Save:",
                error
            );

        }


        updateButtons(theme);

    }


    function updateButtons(theme) {

        if (darkButton) {

            darkButton.classList.toggle(
                "active",
                theme === "dark"
            );

        }


        if (lightButton) {

            lightButton.classList.toggle(
                "active",
                theme === "light"
            );

        }

    }


    if (darkButton) {

        darkButton.addEventListener(
            "click",
            function () {

                applyTheme("dark");

            }
        );

    }


    if (lightButton) {

        lightButton.addEventListener(
            "click",
            function () {

                applyTheme("light");

            }
        );

    }


    applyTheme(
        getTheme()
    );


    window.WFESCTheme = {

        getTheme: getTheme,

        setTheme: applyTheme

    };


})();

</script>


<!-- =================================================
     ANIMATION SETTING
================================================== -->

<script>

(function () {

    "use strict";


    const toggle =
        document.getElementById(
            "animationToggle"
        );


    if (!toggle) {
        return;
    }


    let saved = null;


    try {

        saved =
            localStorage.getItem(
                "wfesc-animation"
            );

    } catch (error) {}


    if (saved === "off") {

        toggle.checked = false;

        document.documentElement
            .classList
            .add(
                "wfesc-animation-off"
            );

    } else {

        toggle.checked = true;

    }


    toggle.addEventListener(
        "change",
        function () {

            if (toggle.checked) {

                document.documentElement
                    .classList
                    .remove(
                        "wfesc-animation-off"
                    );


                try {

                    localStorage.setItem(
                        "wfesc-animation",
                        "on"
                    );

                } catch (error) {}

            } else {

                document.documentElement
                    .classList
                    .add(
                        "wfesc-animation-off"
                    );


                try {

                    localStorage.setItem(
                        "wfesc-animation",
                        "off"
                    );

                } catch (error) {}

            }

        }
    );


})();

</script>


<!-- =================================================
     LIQUID GLASS SETTING
================================================== -->

<script>

(function () {

    "use strict";


    const GLASS_KEY =
        "wfesc-liquid-glass";


    const toggle =
        document.getElementById(
            "liquidGlassToggle"
        );


    if (!toggle) {
        return;
    }


    function getGlassState() {

        try {

            const saved =
                localStorage.getItem(
                    GLASS_KEY
                );


            if (saved === "off") {
                return false;
            }

        } catch (error) {}


        return true;

    }


    function applyLiquidGlass(enabled) {

        const html =
            document.documentElement;


        html.classList.toggle(
            "wfesc-liquid-glass",
            enabled
        );


        toggle.checked =
            enabled;


        try {

            localStorage.setItem(
                GLASS_KEY,
                enabled
                    ? "on"
                    : "off"
            );

        } catch (error) {}


        /*
         * إرسال الحالة إلى نظام الحساب
         * settings-auth-ui.js
         */

        if (
            typeof window.WFESCSetAuthLiquidGlass ===
            "function"
        ) {

            try {

                window.WFESCSetAuthLiquidGlass(
                    enabled
                );

            } catch (error) {

                console.warn(
                    "WFESC Liquid Glass Auth:",
                    error
                );

            }

        }


        window.dispatchEvent(
            new CustomEvent(
                "WFESCLiquidGlassChanged",
                {
                    detail: {
                        enabled: enabled
                    }
                }
            )
        );

    }


    const initialState =
        getGlassState();


    toggle.checked =
        initialState;


    applyLiquidGlass(
        initialState
    );


    toggle.addEventListener(
        "change",
        function () {

            applyLiquidGlass(
                toggle.checked
            );

        }
    );


    window.WFESCGetLiquidGlass =
        function () {

            return getGlassState();

        };


    window.WFESCSetLiquidGlass =
        function (enabled) {

            applyLiquidGlass(
                Boolean(enabled)
            );

        };


})();

</script>
