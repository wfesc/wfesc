<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>منشورات WFESC</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #fff;
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =========================
           شاشة التحميل
        ========================= */

        #posts-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;

            transition:
                opacity .7s ease,
                visibility .7s ease;
        }

        #posts-loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .loader-logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;

            animation:
                logoPulse
                1.8s
                ease-in-out
                infinite;
        }

        .loader-subtitle {
            margin-top: 12px;

            color: #777;

            font-size: 11px;
            letter-spacing: 4px;
        }

        .loader-line {
            width: 100%;
            height: 2px;

            margin-top: 30px;

            background: #171717;

            overflow: hidden;
            border-radius: 20px;
        }

        .loader-line::after {
            content: "";

            display: block;

            width: 35%;
            height: 100%;

            background: #fff;

            animation:
                loadingLine
                1.4s
                ease-in-out
                infinite;
        }

        .loader-text {
            margin-top: 15px;

            color: #666;

            font-size: 12px;
        }

        @keyframes logoPulse {

            0%,
            100% {
                opacity: .45;
                transform: scale(.98);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes loadingLine {

            0% {
                transform: translateX(350%);
            }

            100% {
                transform: translateX(-350%);
            }
        }


        /* =========================
           الهيدر
        ========================= */

        .posts-header {
            position: fixed;

            top: 0;
            right: 0;
            left: 0;

            height: 65px;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: rgba(5, 5, 5, .88);

            border-bottom: 1px solid #202020;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .posts-logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
        }


        /* =========================
           زر النشر
        ========================= */

        .publish-button {
            position: absolute;

            left: 20px;

            border: 1px solid #292929;

            background: #101010;

            color: #fff;

            padding: 8px 15px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13px;

            transition:
                background .25s ease,
                border-color .25s ease,
                transform .25s ease;
        }

        .publish-button:hover {
            background: #fff;
            color: #000;
            border-color: #fff;

            transform: translateY(-1px);
        }


        /* =========================
           زر الرئيسية
        ========================= */

        .back-button {
            border: 1px solid #292929;

            background: #101010;

            color: #fff;

            padding: 8px 14px;

            border-radius: 9px;

            cursor: pointer;

            text-decoration: none;

            font-size: 13px;

            transition: .25s;
        }

        .back-button:hover {
            background: #fff;
            color: #000;
        }


        /* =========================
           المنشورات
        ========================= */

        .posts-container {

            width: 100%;
            max-width: 600px;

            margin: auto;

            padding-top: 65px;
        }

        .post {

            min-height: calc(100vh - 65px);

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 20px 14px 35px;

            border-bottom: 1px solid #202020;

            opacity: 0;
            transform: translateY(35px);

            animation:
                postAppear
                .8s
                ease
                forwards;
        }

        @keyframes postAppear {

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           الصور
        ========================= */

        .post-media {

            width: 100%;
            max-height: 72vh;

            object-fit: contain;

            background: #090909;

            border-radius: 16px;

            display: block;

            transition:
                transform .4s ease,
                filter .4s ease;
        }

        .post-media:hover {
            transform: scale(1.01);
            filter: brightness(1.08);
        }


        /* =========================
           الفيديو
        ========================= */

        .post-video {

            width: 100%;
            max-height: 72vh;

            border-radius: 16px;

            background: #000;

            display: block;
        }


        /* =========================
           معلومات المنشور
        ========================= */

        .post-info {
            padding: 18px 5px 0;
        }

        .post-title {
            font-size: 19px;
            margin-bottom: 9px;
        }

        .post-text {
            color: #aaa;
            font-size: 14px;
            line-height: 1.8;
        }

        .post-meta {
            margin-top: 12px;
            color: #666;
            font-size: 11px;
        }


        /* =========================
           أزرار المنشور
        ========================= */

        .post-actions {

            display: flex;

            gap: 8px;

            margin-top: 16px;
        }

        .post-action {

            border: 1px solid #252525;

            background: #0c0c0c;

            color: #aaa;

            padding: 8px 13px;

            border-radius: 9px;

            font-size: 12px;

            cursor: pointer;

            transition: .25s;
        }

        .post-action:hover {

            background: #151515;

            color: #fff;

            border-color: #444;
        }


        /* =========================
           شاشة تسجيل الدخول
        ========================= */

        #login-overlay {

            position: fixed;

            inset: 0;

            z-index: 100000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, .82);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .35s ease,
                visibility .35s ease;
        }

        #login-overlay.show {

            opacity: 1;
            visibility: visible;
        }


        /* =========================
           صندوق الدخول
        ========================= */

        .login-box {

            width: 100%;

            max-width: 380px;

            padding: 30px 25px;

            background: #080808;

            border: 1px solid #252525;

            border-radius: 18px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .7);

            transform:
                translateY(30px)
                scale(.96);

            transition:
                transform .4s ease;
        }

        #login-overlay.show
        .login-box {

            transform:
                translateY(0)
                scale(1);
        }


        /* =========================
           شعار الدخول
        ========================= */

        .login-logo {

            text-align: center;

            font-size: 30px;

            font-weight: bold;

            letter-spacing: 7px;

            margin-bottom: 8px;
        }

        .login-subtitle {

            text-align: center;

            color: #666;

            font-size: 11px;

            letter-spacing: 2px;

            margin-bottom: 28px;
        }


        /* =========================
           الحقول
        ========================= */

        .login-label {

            display: block;

            color: #888;

            font-size: 12px;

            margin-bottom: 7px;
        }

        .login-input {

            width: 100%;

            height: 46px;

            padding: 0 13px;

            margin-bottom: 17px;

            border-radius: 10px;

            border: 1px solid #252525;

            outline: none;

            background: #0e0e0e;

            color: #fff;

            font-size: 14px;

            transition:
                border-color .25s ease,
                background .25s ease;
        }

        .login-input:focus {

            border-color: #555;

            background: #121212;
        }


        /* =========================
           أزرار الدخول
        ========================= */

        .login-buttons {

            display: flex;

            gap: 9px;

            margin-top: 5px;
        }

        .login-submit,
        .login-cancel {

            flex: 1;

            height: 44px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 13px;

            transition: .25s;
        }

        .login-submit {

            border: 1px solid #fff;

            background: #fff;

            color: #000;
        }

        .login-submit:hover {

            background: #ddd;
        }

        .login-cancel {

            border: 1px solid #292929;

            background: #101010;

            color: #aaa;
        }

        .login-cancel:hover {

            color: #fff;

            border-color: #444;
        }


        /* =========================
           رسالة الدخول
        ========================= */

        .login-message {

            min-height: 18px;

            margin-top: 15px;

            text-align: center;

            color: #777;

            font-size: 12px;
        }


        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 600px) {

            .posts-header {
                padding: 0 13px;
            }

            .posts-logo {
                font-size: 16px;
            }

            .publish-button {
                left: 13px;
                padding: 8px 12px;
            }

            .post {
                padding:
                    15px
                    10px
                    30px;
            }

            .post-media,
            .post-video {
                border-radius: 13px;
            }

            .post-title {
                font-size: 17px;
            }

            .post-text {
                font-size: 13px;
            }

            .login-box {
                padding: 26px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         شاشة التحميل
    ========================= -->

    <div id="posts-loader">

        <div class="loader-content">

            <div class="loader-logo">
                WFESC
            </div>

            <div class="loader-subtitle">
                POSTS
            </div>

            <div class="loader-line"></div>

            <div class="loader-text">
                جاري تحميل المنشورات...
            </div>

        </div>

    </div>


    <!-- =========================
         الهيدر
    ========================= -->

    <header class="posts-header">

        <div class="posts-logo">
            WFESC
        </div>

        <button
            class="publish-button"
            id="publishButton"
            type="button"
        >
            + نشر
        </button>

        <a
            class="back-button"
            href="./index.html"
        >
            الرئيسية
        </a>

    </header>


    <!-- =========================
         المنشورات
    ========================= -->

    <main class="posts-container">


        <section class="post">

            <img
                class="post-media"
                src="./sorg.jpg"
                alt="WFESC"
            >

            <div class="post-info">

                <h2 class="post-title">
                    مرحباً بكم في WFESC
                </h2>

                <p class="post-text">
                    ذاكرة العراق بصورة مختلفة.
                    هنا تبدأ رحلة المنشورات والمحتوى الخاص بـ WFESC.
                </p>

                <div class="post-meta">
                    WFESC
                </div>

                <div class="post-actions">

                    <button
                        class="post-action"
                        type="button"
                    >
                        ♡ إعجاب
                    </button>

                    <button
                        class="post-action"
                        type="button"
                    >
                        💬 تعليق
                    </button>

                </div>

            </div>

        </section>


    </main>


    <!-- =========================
         تسجيل الدخول
    ========================= -->

    <div
        id="login-overlay"
        aria-hidden="true"
    >

        <div class="login-box">

            <div class="login-logo">
                WFESC
            </div>

            <div class="login-subtitle">
                PUBLISHER ACCESS
            </div>


            <form id="loginForm">

                <label
                    class="login-label"
                    for="username"
                >
                    اسم المستخدم
                </label>

                <input
                    class="login-input"
                    id="username"
                    type="text"
                    placeholder="أدخل اسم المستخدم"
                    autocomplete="username"
                    required
                >


                <label
                    class="login-label"
                    for="password"
                >
                    كلمة المرور
                </label>

                <input
                    class="login-input"
                    id="password"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >


                <div class="login-buttons">

                    <button
                        class="login-submit"
                        type="submit"
                    >
                        تسجيل الدخول
                    </button>

                    <button
                        class="login-cancel"
                        id="loginCancel"
                        type="button"
                    >
                        إلغاء
                    </button>

                </div>

                <div
                    class="login-message"
                    id="loginMessage"
                ></div>

            </form>

        </div>

    </div>


    <script>


        /* =========================
           شاشة التحميل
        ========================= */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        const loader =
                            document.getElementById(
                                "posts-loader"
                            );

                        if (loader) {

                            loader.classList.add("hide");

                        }

                    },
                    1300
                );

            }
        );


        /* =========================
           فتح تسجيل الدخول
        ========================= */

        const publishButton =
            document.getElementById(
                "publishButton"
            );

        const loginOverlay =
            document.getElementById(
                "login-overlay"
            );

        const loginCancel =
            document.getElementById(
                "loginCancel"
            );

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        publishButton.addEventListener(
            "click",
            function () {

                loginOverlay.classList.add("show");

                loginOverlay.setAttribute(
                    "aria-hidden",
                    "false"
                );

                setTimeout(
                    function () {

                        document
                            .getElementById("username")
                            .focus();

                    },
                    300
                );

            }
        );


        /* =========================
           إغلاق تسجيل الدخول
        ========================= */

        loginCancel.addEventListener(
            "click",
            function () {

                closeLogin();

            }
        );


        loginOverlay.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === loginOverlay
                ) {

                    closeLogin();

                }

            }
        );


        function closeLogin() {

            loginOverlay.classList.remove("show");

            loginOverlay.setAttribute(
                "aria-hidden",
                "true"
            );

            loginMessage.textContent = "";

            loginForm.reset();

        }


        /* =========================
           تسجيل الدخول
        ========================= */
loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const email = loginUsername.value.trim();
        const password = loginPassword.value;

        loginMessage.textContent = "جاري تسجيل الدخول...";

        if (!window.supabaseClient) {
            loginMessage.textContent =
                "الاتصال بالخادم غير جاهز، حاول مرة أخرى.";
            return;
        }

        const { data, error } =
            await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            loginMessage.textContent =
                "فشل تسجيل الدخول: " + error.message;
            return;
        }

        loginMessage.textContent =
            "تم تسجيل الدخول بنجاح.";

        setTimeout(() => {
            loginOverlay.classList.remove("show");
        }, 800);

        console.log("WFESC: Logged in", data.user);
    }
);

        /* =========================
           أزرار المنشورات
        ========================= */

        
        document
            .querySelectorAll(".post-action")
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            /*
                             * سيتم ربط نظام
                             * الإعجاب والتعليقات لاحقاً.
                             */

                        }
                    );

                }
            );

    </script>
<script src="./posts-system.js"></script>

</body>

</html>
