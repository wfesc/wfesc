<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WFESC Posts</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #eee;
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
        }

        /* =========================
           LOADING
        ========================= */

        #posts-loader {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .6s ease;
        }

        #posts-loader.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loader-box {
            width: 85%;
            max-width: 380px;
            text-align: center;
        }

        .loader-logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;
            margin-bottom: 25px;
        }

        .loader-text {
            color: #777;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .loader-line {
            width: 100%;
            height: 2px;
            background: #1b1b1b;
            overflow: hidden;
        }

        .loader-line div {
            width: 35%;
            height: 100%;
            background: #fff;
            animation: loaderMove 1.2s infinite ease-in-out;
        }

        @keyframes loaderMove {
            from {
                transform: translateX(300%);
            }

            to {
                transform: translateX(-300%);
            }
        }

        /* =========================
           HEADER
        ========================= */

        .posts-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;

            background: rgba(5, 5, 5, .92);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #181818;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1000;
        }

        .posts-title {
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .publish-button,
        .back-button {
            position: fixed;
            top: 13px;

            height: 38px;
            padding: 0 16px;

            border: 1px solid #292929;
            background: #101010;
            color: #fff;

            border-radius: 20px;

            cursor: pointer;
            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;

            z-index: 1100;
        }

        .publish-button {
            left: 12px;
        }

        .back-button {
            right: 12px;
        }

        .publish-button:hover,
        .back-button:hover {
            background: #181818;
        }

        /* =========================
           POSTS
        ========================= */

        .posts-container {
            width: 100%;
            max-width: 600px;

            margin: auto;
            padding: 90px 12px 40px;
        }

        .post {
            background: #0c0c0c;
            border: 1px solid #181818;

            border-radius: 14px;
            overflow: hidden;

            margin-bottom: 22px;
        }

        .post-media {
            width: 100%;
            background: #000;
        }

        .post-media img,
        .post-media video {
            display: block;
            width: 100%;
            max-height: 650px;
            object-fit: contain;
            background: #000;
        }

        .post-info {
            padding: 15px;
        }

        .post-user {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .post-content {
            color: #aaa;
            font-size: 14px;
            line-height: 1.8;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            padding: 0 15px 15px;
        }

        .post-action {
            border: 1px solid #222;
            background: #111;
            color: #ddd;

            border-radius: 18px;

            padding: 8px 13px;

            cursor: pointer;
            font-size: 13px;
        }

        .post-action:hover {
            background: #1a1a1a;
        }

        .post-action.active {
            background: #fff;
            color: #000;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-posts {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        /* =========================
           LOGIN OVERLAY
        ========================= */

        #login-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .82);
            backdrop-filter: blur(10px);

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 9999999;

            padding: 20px;
        }

        #login-overlay.show {
            display: flex;
        }

        .login-box {
            width: 100%;
            max-width: 390px;

            background: #0b0b0b;
            border: 1px solid #222;

            border-radius: 18px;

            padding: 25px;

            box-shadow: 0 20px 80px rgba(0, 0, 0, .6);
        }

        .login-logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .auth-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
        }

        .auth-tab {
            flex: 1;

            border: 1px solid #222;
            background: #111;
            color: #888;

            padding: 10px;
            border-radius: 10px;

            cursor: pointer;
        }

        .auth-tab.active {
            background: #fff;
            color: #000;
        }

        .auth-input {
            width: 100%;

            background: #111;
            color: #fff;

            border: 1px solid #242424;

            border-radius: 10px;

            padding: 13px;

            margin-bottom: 10px;

            outline: none;
            font-size: 14px;
        }

        .auth-input:focus {
            border-color: #555;
        }

        .auth-submit {
            width: 100%;

            border: none;
            background: #fff;
            color: #000;

            padding: 13px;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .auth-cancel {
            width: 100%;

            border: 1px solid #222;
            background: #111;
            color: #aaa;

            padding: 12px;

            border-radius: 10px;

            cursor: pointer;

            margin-top: 8px;
        }

        #auth-message {
            min-height: 20px;

            color: #999;

            text-align: center;

            font-size: 12px;

            line-height: 1.6;

            margin-top: 14px;
        }

        .logged-user {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);

            background: #0c0c0c;
            border: 1px solid #202020;

            padding: 7px 13px;

            border-radius: 20px;

            color: #999;
            font-size: 11px;

            z-index: 900;
        }

        /* =========================
           COMMENTS
        ========================= */

        .comments-box {
            display: none;
            padding: 0 15px 15px;
        }

        .comments-box.show {
            display: block;
        }

        .comment-input-row {
            display: flex;
            gap: 7px;
        }

        .comment-input {
            flex: 1;

            background: #111;
            color: #fff;

            border: 1px solid #222;

            border-radius: 10px;

            padding: 10px;
            outline: none;
        }

        .comment-send {
            border: 1px solid #222;
            background: #171717;
            color: #fff;

            border-radius: 10px;

            padding: 0 13px;

            cursor: pointer;
        }

        .comments-list {
            margin-top: 12px;
        }

        .comment {
            background: #111;
            border-radius: 10px;

            padding: 9px 11px;

            margin-top: 7px;

            font-size: 12px;
        }

        .comment-user {
            color: #fff;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .comment-text {
            color: #aaa;
        }

    </style>
</head>

<body>

    <!-- =========================
         LOADING
    ========================= -->

    <div id="posts-loader">

        <div class="loader-box">

            <div class="loader-logo">
                WFESC
            </div>

            <div class="loader-text">
                جاري تحميل المنشورات...
            </div>

            <div class="loader-line">
                <div></div>
            </div>

        </div>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="posts-header">

        <div class="posts-title">
            POSTS
        </div>

    </header>


    <button
        class="publish-button"
        id="publish-button">
        + نشر
    </button>


    <a
        class="back-button"
        href="./index.html">
        الرئيسية
    </a>


    <!-- =========================
         CURRENT USER
    ========================= -->

    <div
        class="logged-user"
        id="logged-user"
        style="display:none;">
    </div>


    <!-- =========================
         POSTS
    ========================= -->

    <main class="posts-container" id="posts-container">

        <article class="post">

            <div class="post-media">

                <img
                    src="./sorg.jpg"
                    alt="WFESC">

            </div>

            <div class="post-info">

                <div class="post-user">
                    WFESC
                </div>

                <div class="post-title">
                    أهلاً بكم في منشورات WFESC
                </div>

                <div class="post-content">
                    هنا ستظهر المنشورات والمحتوى الذي يتم نشره
                    من المستخدمين.
                </div>

            </div>

            <div class="post-actions">

                <button
                    class="post-action like-button">
                    ♡ إعجاب
                </button>

                <button
                    class="post-action comment-button">
                    💬 تعليق
                </button>

            </div>

            <div class="comments-box">

                <div class="comment-input-row">

                    <input
                        class="comment-input"
                        type="text"
                        placeholder="اكتب تعليقك...">

                    <button
                        class="comment-send">
                        إرسال
                    </button>

                </div>

                <div class="comments-list"></div>

            </div>

        </article>

    </main>


    <!-- =========================
         AUTH
    ========================= -->

    <div id="login-overlay">

        <div class="login-box">

            <div class="login-logo">
                WFESC
            </div>

            <div class="login-subtitle">
                سجّل دخولك للتفاعل والنشر
            </div>


            <div class="auth-tabs">

                <button
                    class="auth-tab active"
                    id="login-tab">
                    تسجيل الدخول
                </button>

                <button
                    class="auth-tab"
                    id="register-tab">
                    إنشاء حساب
                </button>

            </div>


            <!-- LOGIN -->

            <form id="login-form">

                <input
                    class="auth-input"
                    id="login-email"
                    type="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="email"
                    required>

                <input
                    class="auth-input"
                    id="login-password"
                    type="password"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                    required>

                <button
                    class="auth-submit"
                    type="submit">
                    تسجيل الدخول
                </button>

            </form>


            <!-- REGISTER -->

            <form
                id="register-form"
                style="display:none;">

                <input
                    class="auth-input"
                    id="register-username"
                    type="text"
                    placeholder="اسم المستخدم"
                    autocomplete="username"
                    maxlength="30"
                    required>

                <input
                    class="auth-input"
                    id="register-email"
                    type="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="email"
                    required>

                <input
                    class="auth-input"
                    id="register-password"
                    type="password"
                    placeholder="كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    required>

                <button
                    class="auth-submit"
                    type="submit">
                    إنشاء الحساب
                </button>

            </form>


            <button
                class="auth-cancel"
                id="auth-cancel">
                إلغاء
            </button>


            <div id="auth-message"></div>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://mcgbzfgbaxwmutniorlw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_5b7pTbiGY2D6vDLRsWgVzA_X926lBeM";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           ELEMENTS
        ========================= */

        const loader =
            document.getElementById("posts-loader");

        const publishButton =
            document.getElementById("publish-button");

        const loginOverlay =
            document.getElementById("login-overlay");

        const loginForm =
            document.getElementById("login-form");

        const registerForm =
            document.getElementById("register-form");

        const loginTab =
            document.getElementById("login-tab");

        const registerTab =
            document.getElementById("register-tab");

        const authCancel =
            document.getElementById("auth-cancel");

        const authMessage =
            document.getElementById("auth-message");

        const loggedUser =
            document.getElementById("logged-user");


        /* =========================
           LOADING
        ========================= */

        window.addEventListener("load", function () {

            setTimeout(function () {

                loader.classList.add("hide");

            }, 1300);

        });


        /* =========================
           AUTH WINDOW
        ========================= */

        function openAuth() {

            loginOverlay.classList.add("show");

            authMessage.textContent = "";

        }


        function closeAuth() {

            loginOverlay.classList.remove("show");

            authMessage.textContent = "";

        }


        publishButton.addEventListener(
            "click",
            async function () {

                const {
                    data: {
                        user
                    }
                } = await supabaseClient.auth.getUser();


                if (!user) {

                    openAuth();

                    return;

                }


                alert(
                    "تم تسجيل الدخول. نظام إنشاء المنشور سنضيفه بالخطوة التالية."
                );

            }
        );


        authCancel.addEventListener(
            "click",
            closeAuth
        );


        loginOverlay.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === loginOverlay
                ) {

                    closeAuth();

                }

            }
        );


        /* =========================
           TABS
        ========================= */

        loginTab.addEventListener(
            "click",
            function () {

                loginTab.classList.add("active");
                registerTab.classList.remove("active");

                loginForm.style.display = "block";
                registerForm.style.display = "none";

                authMessage.textContent = "";

            }
        );


        registerTab.addEventListener(
            "click",
            function () {

                registerTab.classList.add("active");
                loginTab.classList.remove("active");

                loginForm.style.display = "none";
                registerForm.style.display = "block";

                authMessage.textContent = "";

            }
        );


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                    .getElementById("login-email")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("login-password")
                    .value;


                authMessage.textContent =
                    "جاري تسجيل الدخول...";


                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                if (error) {

                    authMessage.textContent =
                        error.message;

                    return;

                }


                authMessage.textContent =
                    "تم تسجيل الدخول بنجاح.";


                updateUser(data.user);


                setTimeout(
                    closeAuth,
                    700
                );

            }
        );


        /* =========================
           REGISTER
        ========================= */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                    .getElementById("register-username")
                    .value
                    .trim();


                const email =
                    document
                    .getElementById("register-email")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("register-password")
                    .value;


                if (username.length < 3) {

                    authMessage.textContent =
                        "اسم المستخدم يجب أن يكون 3 أحرف أو أكثر.";

                    return;

                }


                authMessage.textContent =
                    "جاري إنشاء الحساب...";


                /* CHECK USERNAME */

                const {
                    data: existingProfile,
                    error: usernameCheckError
                } =
                await supabaseClient
                    .from("profiles")
                    .select("username")
                    .eq("username", username)
                    .maybeSingle();


                if (usernameCheckError) {

                    authMessage.textContent =
                        "حدث خطأ أثناء فحص اسم المستخدم.";

                    console.error(
                        usernameCheckError
                    );

                    return;

                }


                if (existingProfile) {

                    authMessage.textContent =
                        "اسم المستخدم مستخدم مسبقاً.";

                    return;

                }


                /* CREATE AUTH USER */

                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


                if (error) {

                    authMessage.textContent =
                        error.message;

                    return;

                }


                if (!data.user) {

                    authMessage.textContent =
                        "تعذر إنشاء الحساب.";

                    return;

                }


                /* CREATE PROFILE */

                const {
                    error: profileError
                } =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        id: data.user.id,

                        username: username

                    });


                if (profileError) {

                    authMessage.textContent =
                        "تم إنشاء الحساب لكن تعذر إنشاء الملف الشخصي.";

                    console.error(
                        profileError
                    );

                    return;

                }


                if (
                    data.session
                ) {

                    authMessage.textContent =
                        "تم إنشاء الحساب وتسجيل الدخول.";

                    updateUser(data.user);

                    setTimeout(
                        closeAuth,
                        900
                    );

                } else {

                    authMessage.textContent =
                        "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتفعيل الحساب.";

                }

            }
        );


        /* =========================
           USER
        ========================= */

        async function updateUser(user) {

            if (!user) {

                loggedUser.style.display =
                    "none";

                return;

            }


            const {
                data: profile
            } =
            await supabaseClient
                .from("profiles")
                .select("username")
                .eq("id", user.id)
                .maybeSingle();


            if (profile) {

                loggedUser.textContent =
                    "مرحباً " + profile.username;

            } else {

                loggedUser.textContent =
                    "مرحباً بك";

            }


            loggedUser.style.display =
                "block";

        }


        /* =========================
           CHECK SESSION
        ========================= */

        async function checkSession() {

            const {
                data: {
                    session
                }
            } =
            await supabaseClient.auth.getSession();


            if (session) {

                updateUser(session.user);

            }

        }


        checkSession();


        supabaseClient.auth.onAuthStateChange(
            function (
                event,
                session
            ) {

                if (session) {

                    updateUser(
                        session.user
                    );

                } else {

                    loggedUser.style.display =
                        "none";

                }

            }
        );


        /* =========================
           LIKE / COMMENT LOGIN
        ========================= */

        document
            .querySelectorAll(".like-button")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    async function () {

                        const {
                            data: {
                                user
                            }
                        } =
                        await supabaseClient
                            .auth
                            .getUser();


                        if (!user) {

                            openAuth();

                            return;

                        }


                        button.classList.toggle(
                            "active"
                        );

                    }
                );

            });


        document
            .querySelectorAll(".comment-button")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    async function () {

                        const {
                            data: {
                                user
                            }
                        } =
                        await supabaseClient
                            .auth
                            .getUser();


                        if (!user) {

                            openAuth();

                            return;

                        }


                        const post =
                            button.closest(".post");

                        const comments =
                            post.querySelector(
                                ".comments-box"
                            );

                        comments.classList.toggle(
                            "show"
                        );

                    }
                );

            });


    </script>

</body>
