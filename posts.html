<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WFESC Posts</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

html{
    scroll-behavior:smooth
}

body{
    background:#050505;
    color:#eee;
    font-family:Arial,Tahoma,sans-serif;
    min-height:100vh;
    padding-bottom:95px
}

button,
input,
textarea,
select{
    font-family:inherit
}

button{
    cursor:pointer
}

button:disabled{
    opacity:.55;
    cursor:not-allowed
}

.hidden{
    display:none!important
}

body.no-animation *,
body.no-animation *::before,
body.no-animation *::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important
}

/* =====================================================
   INTERNAL LOADER
===================================================== */

#posts-loader{
    display:none!important
}

#posts-loader.hide{
    display:none!important
}

.loader-box,
.loader-logo,
.loader-text,
.loader-line{
    display:none!important
}

/* =====================================================
   HEADER
===================================================== */

.posts-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    background:rgba(5,5,5,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid #181818;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000
}

.posts-title{
    font-size:19px;
    font-weight:bold;
    letter-spacing:3px
}

.header-left,
.header-right{
    position:absolute;
    top:0;
    height:64px;
    display:flex;
    align-items:center;
    gap:6px
}

.header-left{
    left:10px
}

.header-right{
    right:10px
}

.header-button{
    width:38px;
    height:38px;
    border:1px solid #222;
    border-radius:50%;
    background:#101010;
    color:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px
}

.header-button:hover{
    background:#181818
}

/* =====================================================
   USER
===================================================== */

.logged-user{
    position:fixed;
    top:76px;
    right:15px;
    background:#0c0c0c;
    border:1px solid #202020;
    padding:6px 10px;
    border-radius:20px;
    color:#999;
    font-size:10px;
    z-index:850;
    display:none
}

/* =====================================================
   CONTAINER
===================================================== */

.posts-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:88px 12px 30px
}

/* =====================================================
   TOOLBAR
===================================================== */

.posts-toolbar{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:14px
}

.toolbar-button{
    flex:1 1 auto;
    min-height:38px;
    border:1px solid #202020;
    background:#0e0e0e;
    color:#ddd;
    border-radius:20px;
    padding:8px 13px;
    font-size:12px
}

.toolbar-button.active{
    background:#fff;
    color:#000;
    border-color:#fff
}

.toolbar-button.publish-button{
    background:#171717;
    border-color:#303030
}

/* =====================================================
   SEARCH
===================================================== */

.search-box{
    display:none;
    margin-bottom:13px
}

.search-box.show{
    display:flex
}

.search-box input{
    width:100%;
    height:42px;
    background:#0b0b0b;
    border:1px solid #222;
    border-radius:22px;
    color:#eee;
    outline:none;
    padding:0 15px;
    font-size:13px
}

.search-box input:focus{
    border-color:#555
}

/* =====================================================
   SEARCH RESULTS
===================================================== */

.wfesc-search-results{
    display:none;
    margin-bottom:14px;
    background:#0b0b0b;
    border:1px solid #181818;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.18)
}

.wfesc-search-results.show{
    display:block
}

.wfesc-search-section{
    padding:11px 13px;
    color:#777;
    font-size:11px;
    border-bottom:1px solid #171717;
    background:#0d0d0d
}

.wfesc-search-user{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 13px;
    border:0;
    border-bottom:1px solid #151515;
    background:transparent;
    color:#eee;
    text-align:right;
    cursor:pointer;
    transition:.2s ease
}

.wfesc-search-user:hover{
    background:#121212
}

.wfesc-search-user-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#171717;
    border:1px solid #292929;
    flex:0 0 auto
}

.wfesc-search-user-info{
    min-width:0;
    flex:1
}

.wfesc-search-user-name{
    font-size:12px;
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
}

.wfesc-search-user-username{
    margin-top:3px;
    color:#666;
    font-size:10px
}

.wfesc-search-post{
    width:100%;
    display:block;
    padding:12px 13px;
    border:0;
    border-bottom:1px solid #151515;
    background:transparent;
    color:#eee;
    text-align:right;
    cursor:pointer;
    transition:.2s ease
}

.wfesc-search-post:hover{
    background:#121212
}

.wfesc-search-post-title{
    font-size:12px;
    font-weight:bold;
    line-height:1.5
}

.wfesc-search-post-content{
    margin-top:5px;
    color:#777;
    font-size:10px;
    line-height:1.7
}

.wfesc-search-post-date{
    margin-top:5px;
    color:#555;
    font-size:9px
}

.wfesc-search-empty,
.wfesc-search-loading,
.wfesc-search-error{
    padding:18px;
    text-align:center;
    color:#666;
    font-size:11px;
    line-height:1.7
}

.wfesc-search-error{
    color:#c99
}

/* =====================================================
   POST
===================================================== */

.post{
    background:#0c0c0c;
    border:1px solid #181818;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:22px;
    animation:wfescPostIn .22s ease
}

@keyframes wfescPostIn{
    from{
        opacity:0;
        transform:translateY(7px)
    }
    to{
        opacity:1;
        transform:translateY(0)
    }
}

.post-media{
    position:relative;
    width:100%;
    background:#000
}

.post-media img,
.post-media video{
    display:block;
    width:100%;
    max-height:650px;
    object-fit:contain;
    background:#000
}

.post-expired-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    color:#ddd;
    font-size:13px;
    font-weight:bold
}

.post-info{
    padding:15px
}

.post-user-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:13px
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#171717;
    border:1px solid #292929
}

.post-user{
    font-size:14px;
    font-weight:bold
}

.post-user-sub{
    display:block;
    color:#666;
    font-size:10px;
    margin-top:3px
}

.post-date{
    display:block;
    color:#666;
    font-size:10px;
    margin-top:3px
}

.post-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
    line-height:1.5
}

.post-content{
    color:#aaa;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word
}

.post-visibility{
    display:inline-flex;
    margin-top:10px;
    padding:4px 8px;
    border-radius:12px;
    background:#141414;
    border:1px solid #242424;
    color:#777;
    font-size:9px
}

.post-expiry{
    display:block;
    color:#777;
    font-size:9px;
    margin-top:7px
}

/* =====================================================
   ACTIONS
===================================================== */

.post-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    padding:0 15px 15px
}

.post-action{
    border:1px solid #222;
    background:#111;
    color:#ddd;
    border-radius:18px;
    padding:8px 12px;
    font-size:12px
}

.post-action:hover{
    background:#171717
}

.post-action.active{
    background:#fff;
    color:#000;
    border-color:#fff
}

.post-action.danger{
    color:#e88;
    border-color:#382020
}

.post-action .count{
    margin-right:4px;
    color:inherit
}

/* =====================================================
   STATS
===================================================== */

.post-stats{
    display:flex;
    gap:12px;
    padding:0 15px 11px;
    color:#666;
    font-size:10px
}

.post-stats span{
    white-space:nowrap
}

/* =====================================================
   COMMENTS
===================================================== */

.comments-wrap{
    display:none;
    border-top:1px solid #171717;
    padding:14px 15px 16px
}

.comments-wrap.show{
    display:block
}

.comments-loading,
.comments-empty{
    color:#666;
    text-align:center;
    padding:15px 5px;
    font-size:11px
}

.comment-form{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px
}

.comment-form textarea{
    width:100%;
    min-height:78px;
    resize:vertical;
    background:#090909;
    border:1px solid #202020;
    border-radius:12px;
    color:#eee;
    outline:none;
    padding:10px;
    font-size:12px;
    line-height:1.7
}

.comment-form textarea:focus{
    border-color:#444
}

.comment-form-row{
    display:flex;
    justify-content:flex-start;
    gap:7px
}

.comment-submit{
    border:1px solid #fff;
    background:#fff;
    color:#000;
    border-radius:18px;
    padding:8px 13px;
    font-size:11px
}

.comment-cancel{
    border:1px solid #222;
    background:#111;
    color:#aaa;
    border-radius:18px;
    padding:8px 13px;
    font-size:11px
}

.comment{
    border:1px solid #191919;
    background:#0a0a0a;
    border-radius:12px;
    padding:11px;
    margin-bottom:8px
}

.comment.reply{
    margin-right:25px;
    background:#0d0d0d
}

.comment-head{
    display:flex;
    align-items:center;
    gap:8px
}

.comment-avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid #222
}

.comment-user{
    font-size:11px;
    font-weight:bold
}

.comment-date{
    display:block;
    color:#5c5c5c;
    font-size:9px;
    margin-top:2px
}

.comment-content{
    color:#bbb;
    font-size:12px;
    line-height:1.7;
    white-space:pre-wrap;
    margin-top:8px;
    word-break:break-word
}

.comment-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:9px
}

.comment-button{
    border:1px solid #202020;
    background:#111;
    color:#aaa;
    border-radius:15px;
    padding:5px 8px;
    font-size:9px
}

.comment-button.active{
    background:#fff;
    color:#000;
    border-color:#fff
}

/* =====================================================
   PUBLISH / EDIT MODAL
===================================================== */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100000
}

.modal-backdrop.show{
    display:flex
}

.modal{
    width:min(95vw,520px);
    max-height:90vh;
    overflow:auto;
    background:#0d0d0d;
    border:1px solid #252525;
    border-radius:17px;
    box-shadow:0 20px 80px rgba(0,0,0,.55);
    padding:16px
}

.modal-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:15px
}

.modal-field{
    margin-bottom:12px
}

.modal-field label{
    display:block;
    margin-bottom:6px;
    color:#888;
    font-size:10px
}

.modal-field input,
.modal-field textarea,
.modal-field select{
    width:100%;
    background:#090909;
    color:#eee;
    border:1px solid #222;
    border-radius:11px;
    outline:none;
    padding:10px;
    font-size:12px
}

.modal-field textarea{
    min-height:120px;
    resize:vertical;
    line-height:1.8
}

.modal-field input:focus,
.modal-field textarea:focus,
.modal-field select:focus{
    border-color:#444
}

.modal-help{
    color:#666;
    font-size:9px;
    line-height:1.7;
    margin-top:5px
}

.modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:16px
}

.modal-button{
    min-width:90px;
    border:1px solid #222;
    background:#111;
    color:#ddd;
    border-radius:18px;
    padding:9px 13px;
    font-size:11px
}

.modal-button.primary{
    background:#fff;
    color:#000;
    border-color:#fff
}

.modal-button.danger{
    color:#f08b8b;
    border-color:#412525
}

/* =====================================================
   PROFILE / MENU
===================================================== */

.profile-summary{
    display:none!important;
    background:#0c0c0c;
    border:1px solid #181818;
    border-radius:14px;
    padding:15px;
    margin-bottom:14px
}

.profile-summary.show{
    display:none!important
}

.profile-summary-avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid #252525
}

.profile-summary-info{
    padding-right:10px
}

.profile-summary-name{
    font-size:14px;
    font-weight:bold
}

.profile-summary-bio{
    margin-top:5px;
    color:#777;
    font-size:11px;
    line-height:1.6
}

/* =====================================================
   EMPTY / ERROR
===================================================== */

.empty-posts{
    text-align:center;
    padding:80px 20px;
    color:#666;
    font-size:12px
}

.error-posts{
    color:#c99
}

.error-detail{
    margin-top:14px;
    padding:12px;
    background:#090909;
    border:1px solid #352020;
    border-radius:10px;
    color:#d99;
    font-size:10px;
    line-height:1.8;
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere
}

.retry-button{
    margin-top:13px;
    border:1px solid #333;
    background:#111;
    color:#ddd;
    border-radius:18px;
    padding:8px 14px;
    font-size:11px
}

/* =====================================================
   TOAST
===================================================== */

#toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(30px);
    background:#fff;
    color:#000;
    padding:12px 18px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:99999999;
    max-width:90%;
    text-align:center
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0)
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:480px){

    .posts-container{
        padding-left:9px;
        padding-right:9px
    }

    .posts-title{
        font-size:16px
    }

    .post-title{
        font-size:16px
    }

    .post-content{
        font-size:13px
    }

    .post-action{
        padding:8px 10px
    }
}
</style>
</head>

<body>

<!-- =====================================================
     OLD INTERNAL LOADER
===================================================== -->

<div id="posts-loader" aria-hidden="true">
    <div class="loader-box">
        <div class="loader-logo">WFESC</div>
        <div class="loader-text">جاري تحميل المنشورات...</div>
        <div class="loader-line">
            <div></div>
        </div>
    </div>
</div>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="posts-header">

    <div class="header-left">

        <button
            type="button"
            class="header-button"
            id="search-toggle"
            aria-label="بحث">
            🔎
        </button>

        <button
            type="button"
            class="header-button"
            id="refresh-posts"
            aria-label="تحديث">
            ↻
        </button>

    </div>

    <div class="posts-title">POSTS</div>

    <div class="header-right">

        <button
            type="button"
            class="header-button"
            id="open-publish-top"
            aria-label="نشر">
            ＋
        </button>

    </div>

</header>

<!-- =====================================================
     LOGGED USER
===================================================== -->

<div id="logged-user" class="logged-user"></div>

<!-- =====================================================
     MAIN
===================================================== -->

<main id="posts-container" class="posts-container">

    <div class="posts-toolbar">

        <button
            type="button"
            class="toolbar-button active"
            data-feed="public">
            الرئيسية
        </button>

        <button
            type="button"
            class="toolbar-button"
            data-feed="friends">
            الأصدقاء
        </button>

        <button
            type="button"
            class="toolbar-button"
            data-feed="trending">
            الرائج
        </button>

        <button
            type="button"
            class="toolbar-button"
            data-feed="saved">
            المحفوظات
        </button>

    </div>

    <div
        id="search-box"
        class="search-box">

        <input
            id="post-search-input"
            type="search"
            placeholder="ابحث في المنشورات والمستخدمين..."
            autocomplete="off">

    </div>

    <div
        id="profile-summary"
        class="profile-summary">

        <img
            id="profile-summary-avatar"
            class="profile-summary-avatar"
            src="./sorg.jpg"
            alt="">

        <div class="profile-summary-info">

            <div
                id="profile-summary-name"
                class="profile-summary-name">
            </div>

            <div
                id="profile-summary-bio"
                class="profile-summary-bio">
            </div>

        </div>

    </div>

    <div
        id="posts-list">

        <div class="empty-posts">
            جاري تحميل المنشورات...
        </div>

    </div>

</main>

<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>

<!-- =====================================================
     PUBLISH / EDIT MODAL
===================================================== -->

<div
    id="post-modal-backdrop"
    class="modal-backdrop">

    <div class="modal">

        <div
            id="post-modal-title"
            class="modal-title">
            إنشاء منشور
        </div>

        <form id="post-form">

            <div class="modal-field">

                <label for="post-title-input">
                    عنوان المنشور
                </label>

                <input
                    id="post-title-input"
                    type="text"
                    maxlength="180"
                    required
                    placeholder="اكتب عنوان المنشور">

            </div>

            <div class="modal-field">

                <label for="post-content-input">
                    المحتوى
                </label>

                <textarea
                    id="post-content-input"
                    maxlength="20000"
                    placeholder="اكتب محتوى المنشور...">
                </textarea>

            </div>

            <div class="modal-field">

                <label for="post-media-url-input">
                    رابط الصورة أو الفيديو
                </label>

                <input
                    id="post-media-url-input"
                    type="url"
                    placeholder="https://...">

                <div class="modal-help">
                    حاليًا يعتمد النظام على رابط الوسائط.
                    رفع الملفات إلى Storage سيتم ربطه لاحقًا من قسم النشر.
                </div>

            </div>

            <div class="modal-field">

                <label for="post-media-type-input">
                    نوع الوسائط
                </label>

                <select id="post-media-type-input">

                    <option value="image">
                        صورة
                    </option>

                    <option value="video">
                        فيديو
                    </option>

                </select>

            </div>

            <div class="modal-field">

                <label for="post-visibility-input">
                    الخصوصية
                </label>

                <select id="post-visibility-input">

                    <option value="public">
                        عام
                    </option>

                    <option value="friends">
                        الأصدقاء
                    </option>

                    <option value="private">
                        خاص
                    </option>

                </select>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    id="post-modal-close"
                    class="modal-button">
                    إلغاء
                </button>

                <button
                    type="submit"
                    id="post-submit"
                    class="modal-button primary">
                    نشر
                </button>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const loggedUser =

const toast =

const loader =

const searchToggle =

const refreshPosts =

/* =========================================================
   COMMON HELPERS
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            character => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "\"":"&quot;",
                "'":"&#039;"
            }[character])
        );
}


function showToast(message){

    if(!toast){
        return;
    }

    toast.textContent =
        String(message ?? "");

    toast.classList.add("show");

    clearTimeout(
        window.__wfescToastTimer
    );

    window.__wfescToastTimer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            3000
        );
}


function formatDate(date){

    if(!date){
        return "";
    }

    const parsed =
        new Date(date);

    if(
        Number.isNaN(
            parsed.getTime()
        )
    ){
        return "";
    }

    return parsed.toLocaleString(
        "ar-IQ",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );
}


function profileAvatar(profile){

    return profile?.avatar_url
        ||
        "./sorg.jpg";
}


function getRpcRow(data){

    if(
        Array.isArray(data)
    ){
        return data[0] || null;
    }

    return data || null;
}


function getArray(data){

    if(
        Array.isArray(data)
    ){
        return data;
    }

    if(
        data &&
        Array.isArray(data.data)
    ){
        return data.data;
    }

    return [];
}


function boolValue(value){

    if(
        value === true ||
        value === false
    ){
        return value;
    }

    if(
        value === 1 ||
        value === "1" ||
        value === "true" ||
        value === "TRUE"
    ){
        return true;
    }

    return false;
}


function numericValue(
    value,
    fallback = 0
){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : fallback;
}


function visibilityLabel(value){

    const map = {
        public:"عام",
        friends:"الأصدقاء",
        private:"خاص"
    };

    return (
        map[value]
        ||
        "غير معروف"
    );
}


function postTypeLabel(value){

    if(value === "text"){
        return "نصي";
    }

    if(value === "video"){
        return "فيديو";
    }

    return "صورة";
}


function isVideoExpired(post){

    return (
        post?.post_type === "video" &&
        post?.expires_at &&
        new Date(post.expires_at).getTime()
            <= Date.now()
    );
}


function escapeUrl(url){

    const value =
        String(url ?? "").trim();

    if(!value){
        return "";
    }

    try{

        const parsed =
            new URL(value);

        if(
            parsed.protocol !== "https:" &&
            parsed.protocol !== "http:"
        ){
            return "";
        }

        return parsed.toString();

    }catch{

        return "";
    }
}

async function getProfile(userId){

    if(!userId){
        return null;
    }

    if(
        profilesCache[userId]
    ){
        return profilesCache[userId];
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id",userId)
            .maybeSingle();

    if(error){

        console.warn(
            "WFESC profile error:",
            error
        );

        return null;
    }

    if(data){

        profilesCache[userId] =
            data;
    }

    return data || null;
}


async function enrichPostProfile(post){

    if(
        post?.username ||
        post?.display_name ||
        post?.avatar_url
    ){

        return {
            id:post.user_id,
            username:post.username,
            display_name:post.display_name,
            avatar_url:post.avatar_url,
            bio:post.bio || ""
        };
    }

    return getProfile(
        post?.user_id
    );
}

/* =========================================================
   RPC HELPER
========================================================= */

async function callRpc(
    functionName,
    params = {}
){

    const response =
        await supabaseClient.rpc(
            functionName,
            params
        );

    if(response.error){

        const rpcError =
            response.error;

        console.error(
            `WFESC RPC error: ${functionName}`,
            rpcError
        );

        const details = [
            rpcError.message,
            rpcError.details,
            rpcError.hint,
            rpcError.code
                ? `code: ${rpcError.code}`
                : ""
        ]
        .filter(Boolean)
        .join("\n");

        const error =
            new Error(
                details
                ||
                `حدث خطأ أثناء استدعاء ${functionName}`
            );

        error.code =
            rpcError.code || "";

        error.details =
            rpcError.details || "";

        error.hint =
            rpcError.hint || "";

        error.functionName =
            functionName;

        error.original =
            rpcError;

        throw error;
    }

    return response.data;
}


/* =========================================================
   POST STATS
========================================================= */

async function getPostStats(
    postId
){

    try{

        const data =
            await callRpc(
                "wfesc_post_stats",
                {
                    target_post_id:postId
                }
            );

        const row =
            getRpcRow(data);

        if(!row){

            return {
                likes:0,
                dislikes:0,
                comments:0,
                viewerLiked:false,
                viewerDisliked:false
            };
        }

        return {

            likes:
                numericValue(
                    row.likes_count
                    ??
                    row.likes
                    ??
                    row.like_count
                ),

            dislikes:
                numericValue(
                    row.dislikes_count
                    ??
                    row.dislikes
                    ??
                    row.dislike_count
                ),

            comments:
                numericValue(
                    row.comments_count
                    ??
                    row.comments
                    ??
                    row.comment_count
                ),

            viewerLiked:
                boolValue(
                    row.viewer_liked
                    ??
                    row.liked_by_user
                    ??
                    row.user_liked
                ),

            viewerDisliked:
                boolValue(
                    row.viewer_disliked
                    ??
                    row.disliked_by_user
                    ??
                    row.user_disliked
                )
        };

    }catch(error){

        console.warn(
            "WFESC post stats error:",
            error
        );

        return {

            likes:0,
            dislikes:0,
            comments:0,
            viewerLiked:false,
            viewerDisliked:false
        };
    }
}


/* =========================================================
   SAVED STATUS
========================================================= */

async function getSavedStatus(
    postId
){

    if(!currentUser){
        return false;
    }

    try{

        const result =
            await callRpc(
                "wfesc_is_post_saved",
                {
                    target_post_id:postId
                }
            );

        if(
            typeof result === "boolean"
        ){
            return result;
        }

        const row =
            getRpcRow(result);

        if(
            typeof row === "boolean"
        ){
            return row;
        }

        if(row){

            return boolValue(
                row.is_saved
                ??
                row.saved
                ??
                row.result
            );
        }

        return boolValue(
            result
        );

    }catch(error){

        console.warn(
            "WFESC saved status error:",
            error
        );

        return false;
    }
}


/* =========================================================
   MEDIA
========================================================= */

function mediaMarkup(post){

    if(!post?.media_url){
        return "";
    }

    const mediaUrl =
        esc(post.media_url);

    if(
        post.post_type === "video" ||
        post.media_type === "video" ||
        String(post.media_type || "").startsWith("video/")
    ){

        if(isVideoExpired(post)){

            return `
                <div class="post-media">
                    <div class="post-expired-overlay">
                        انتهت مدة عرض هذا الفيديو
                    </div>
                </div>
            `;
        }

        return `
            <div class="post-media">

                <video
                    controls
                    preload="metadata"
                    src="${mediaUrl}">
                </video>

            </div>
        `;
    }

    if(
        post.post_type === "image" ||
        post.media_type === "image" ||
        String(post.media_type || "").startsWith("image/")
    ){

        return `
            <div class="post-media">

                <img
                    loading="lazy"
                    src="${mediaUrl}"
                    alt="منشور WFESC">

            </div>
        `;
    }

    return "";
}

/* =========================================================
   FEED RPC
========================================================= */

async function fetchFeed(
    feedName,
    offset = 0,
    limit = 30
){

    switch(feedName){

        case "friends":

            return callRpc(
                "wfesc_get_friends_posts",
                {
                    p_limit:limit,
                    p_offset:offset
                }
            );

        case "trending":

            return callRpc(
                "wfesc_get_trending_posts",
                {
                    p_limit:limit,
                    p_offset:offset
                }
            );

        case "saved":

            return callRpc(
                "wfesc_get_saved_posts",
                {
                    p_limit:limit,
                    p_offset:offset
                }
            );

        case "public":

        default:

            return callRpc(
                "wfesc_get_public_posts",
                {
                    result_limit:limit,
                    result_offset:offset
                }
            );
    }
}


/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts(
    options = {}
){

    const {
        feed = currentFeed,
        offset = 0,
        searchText = ""
    } = options;

    currentFeed =
        feed;

    postsList.innerHTML =
        `
        <div class="empty-posts">
            جاري تحميل المنشورات...
        </div>
        `;

    postsList.style.display =
        "";

    loadedPostIds.clear();

    try{

        let data;

        if(
            searchText.trim()
        ){

            data =
                await callRpc(
                    "wfesc_search_posts_feed",
                    {
                        search_text:
                            searchText.trim(),
                        p_limit:30,
                        p_offset:0
                    }
                );

        }else{

            data =
                await fetchFeed(
                    feed,
                    offset,
                    30
                );
        }

        let posts =
            getArray(
                data
            );

        posts =
            posts.filter(
                post =>
                    post &&
                    !post.deleted_at
            );

        postsCache =
            posts;

        if(!posts.length){

            postsList.innerHTML =
                `
                <div class="empty-posts">

                    ${
                        searchText.trim()
                        ?
                        "لا توجد منشورات مطابقة."
                        :
                        "لا توجد منشورات لعرضها حالياً."
                    }

                </div>
                `;

            return;
        }

        postsList.innerHTML =
            "";

        for(
            const post of posts
        ){

            if(
                loadedPostIds.has(
                    String(post.id)
                )
            ){
                continue;
            }

            loadedPostIds.add(
                String(post.id)
            );

            const article =
                await createPostElement(
                    post
                );

            postsList.appendChild(
                article
            );
        }

    }catch(error){

        console.error(
            "WFESC loadPosts error:",
            error
        );

        const errorMessage =
            error?.message
            ||
            error?.details
            ||
            String(error)
            ||
            "خطأ غير معروف";

        postsList.innerHTML =
            `
            <div class="empty-posts error-posts">

                تعذر تحميل المنشورات.

                <br>

                <button
                    type="button"
                    class="retry-button"
                    id="retry-posts-button">
                    إعادة المحاولة
                </button>

                <div class="error-detail">
                    ${esc(errorMessage)}
                </div>

            </div>
            `;

        document
            .getElementById(
                "retry-posts-button"
            )
            ?.addEventListener(
                "click",
                () => loadPosts({
                    feed:currentFeed
                })
            );
    }
}

/* =========================================================
   USER SEARCH
========================================================= */

async function searchProfiles(
    text
){

    const results =
        new Map();

    /*
     * نحاول أولاً RPC البحث الموجود مسبقاً
     * داخل نظام WFESC.
     */
    try{

        const rpcResult =
            await supabaseClient.rpc(
                "search_users",
                {
                    search_text:text
                }
            );

        if(!rpcResult.error){

            const rows =
                getArray(
                    rpcResult.data
                );

            rows.forEach(
                entry => {

                    const user =
                        entry?.user
                        ||
                        entry;

                    const id =
                        user?.id
                        ||
                        user?.user_id;

                    if(
                        id &&
                        !results.has(
                            String(id)
                        )
                    ){

                        results.set(
                            String(id),
                            {
                                id:id,
                                username:
                                    user.username
                                    ||
                                    "",
                                display_name:
                                    user.display_name
                                    ||
                                    user.name
                                    ||
                                    "",
                                avatar_url:
                                    user.avatar_url
                                    ||
                                    "",
                                bio:
                                    user.bio
                                    ||
                                    ""
                            }
                        );
                    }
                }
            );
        }

    }catch(error){

        console.warn(
            "WFESC search_users RPC unavailable:",
            error
        );
    }

    /*
     * fallback مباشر على profiles.
     */
    try{

        const [
            usernameResult,
            displayNameResult
        ] =
        await Promise.all([

            supabaseClient
                .from("profiles")
                .select(
                    "id,username,display_name,avatar_url,bio"
                )
                .ilike(
                    "username",
                    `%${text}%`
                )
                .limit(15),

            supabaseClient
                .from("profiles")
                .select(
                    "id,username,display_name,avatar_url,bio"
                )
                .ilike(
                    "display_name",
                    `%${text}%`
                )
                .limit(15)

        ]);

        if(
            !usernameResult.error
        ){

            getArray(
                usernameResult.data
            ).forEach(
                user => {

                    if(
                        user?.id &&
                        !results.has(
                            String(user.id)
                        )
                    ){

                        results.set(
                            String(user.id),
                            user
                        );
                    }
                }
            );
        }

        if(
            !displayNameResult.error
        ){

            getArray(
                displayNameResult.data
            ).forEach(
                user => {

                    if(
                        user?.id &&
                        !results.has(
                            String(user.id)
                        )
                    ){

                        results.set(
                            String(user.id),
                            user
                        );
                    }
                }
            );
        }

    }catch(error){

        console.warn(
            "WFESC profile search fallback error:",
            error
        );
    }

    return Array.from(
        results.values()
    );
}


/* =========================================================
   COMBINED SEARCH
========================================================= */

async function searchUsersAndPosts(
    text
){

    const cleanText =
        String(text || "").trim();

    if(!cleanText){

        hideSearchResultsBox();

        postsList.style.display =
            "";

        return;
    }

    const box =
        showSearchResultsBox();

    postsList.style.display =
        "none";

    box.innerHTML =
        `
        <div class="wfesc-search-loading">
            جاري البحث...
        </div>
        `;

    try{

        const postsPromise =
            supabaseClient.rpc(
                "wfesc_search_posts_feed",
                {
                    search_text:cleanText,
                    p_limit:30,
                    p_offset:0
                }
            );

        const usersPromise =
            searchProfiles(
                cleanText
            );

        const [
            postsResponse,
            users
        ] =
            await Promise.all([
                postsPromise,
                usersPromise
            ]);

        if(postsResponse.error){

            throw postsResponse.error;
        }

        const posts =
            getArray(
                postsResponse.data
            )
            .filter(
                post =>
                    post &&
                    !post.deleted_at
            );

        box.innerHTML =
            "";

        if(
            !users.length &&
            !posts.length
        ){

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "wfesc-search-empty";

            empty.textContent =
                "لا توجد نتائج مطابقة.";

            box.appendChild(
                empty
            );

            return;
        }

        if(users.length){

            box.appendChild(
                renderSearchSectionTitle(
                    "المستخدمون"
                )
            );

            users.forEach(
                user => {

                    box.appendChild(
                        renderUserSearchResult(
                            user
                        )
                    );
                }
            );
        }

        if(posts.length){

            box.appendChild(
                renderSearchSectionTitle(
                    "المنشورات"
                )
            );

            posts.forEach(
                post => {

                    box.appendChild(
                        renderPostSearchResult(
                            post,
                            cleanText
                        )
                    );
                }
            );
        }

    }catch(error){

        console.error(
            "WFESC combined search error:",
            error
        );

        box.innerHTML =
            `
            <div class="wfesc-search-error">

                تعذر تنفيذ البحث.

                <br>

                ${esc(
                    error?.message
                    ||
                    ""
                )}

            </div>
            `;
    }
}

async function reactPost(
    postId,
    type
){

    if(!currentUser){

        showToast(
            "سجّل الدخول أولاً للتفاعل مع المنشور"
        );

        return;
    }

    if(operationLock){
        return;
    }

    operationLock =
        true;

    const article =
        document.querySelector(
            `.post[data-id="${CSS.escape(String(postId))}"]`
        );

    const button =
        article
        ? (
            type === "like" ||
            type === "unlike"
            ?
            article.querySelector(
                ".like-button"
            )
            :
            article.querySelector(
                ".dislike-button"
            )
        )
        : null;

    if(button){

        button.disabled =
            true;
    }

    try{

        switch(type){

            case "like":

                await callRpc(
                    "wfesc_like_post",
                    {
                        target_post_id:postId
                    }
                );

                break;

            case "unlike":

                await callRpc(
                    "wfesc_unlike_post",
                    {
                        target_post_id:postId
                    }
                );

                break;

            case "dislike":

                await callRpc(
                    "wfesc_dislike_post",
                    {
                        target_post_id:postId
                    }
                );

                break;

            case "undislike":

                await callRpc(
                    "wfesc_undislike_post",
                    {
                        target_post_id:postId
                    }
                );

                break;

            default:
                return;
        }

        if(article){

            await refreshSinglePostStats(
                article,
                postId
            );
        }

    }catch(error){

        console.error(
            "WFESC reaction error:",
            error
        );

        showToast(
            error.message
            ||
            "تعذر تحديث التفاعل"
        );

    }finally{

        if(button){

            button.disabled =
                false;
        }

        operationLock =
            false;
    }
}


/* =========================================================
   REFRESH SINGLE POST STATS
========================================================= */

async function refreshSinglePostStats(
    article,
    postId
){

    if(!article){
        return;
    }

    const stats =
        await getPostStats(
            postId
        );

    const likeButton =
        article.querySelector(
            ".like-button"
        );

    const dislikeButton =
        article.querySelector(
            ".dislike-button"
        );

    const commentButton =
        article.querySelector(
            ".comment-toggle"
        );

    if(likeButton){

        likeButton.classList.toggle(
            "active",
            stats.viewerLiked
        );

        const count =
            likeButton.querySelector(
                ".count"
            );

        if(count){
            count.textContent =
                stats.likes;
        }
    }

    if(dislikeButton){

        dislikeButton.classList.toggle(
            "active",
            stats.viewerDisliked
        );

        const count =
            dislikeButton.querySelector(
                ".count"
            );

        if(count){
            count.textContent =
                stats.dislikes;
        }
    }

    if(commentButton){

        const count =
            commentButton.querySelector(
                ".count"
            );

        if(count){
            count.textContent =
                stats.comments;
        }
    }

    const statNodes =
        article.querySelectorAll(
            ".post-stats span"
        );

    if(statNodes[0]){

        statNodes[0].textContent =
            `❤️ ${stats.likes}`;
    }

    if(statNodes[1]){

        statNodes[1].textContent =
            `👎 ${stats.dislikes}`;
    }

    if(statNodes[2]){

        statNodes[2].textContent =
            `💬 ${stats.comments}`;
    }
}

async function loadCommentsIntoPost(
    article,
    postId
){

    const list =
        article.querySelector(
            ".comments-list"
        );

    if(!list){
        return;
    }

    list.innerHTML =
        `
        <div class="comments-loading">
            جاري تحميل التعليقات...
        </div>
        `;

    try{

        const data =
            await callRpc(
                "wfesc_get_post_comments",
                {
                    target_post_id:postId,
                    result_limit:50,
                    result_offset:0
                }
            );

        const comments =
            getArray(
                data
            );

        if(!comments.length){

            list.innerHTML =
                `
                <div class="comments-empty">
                    لا توجد تعليقات حتى الآن.
                </div>
                `;

            return;
        }

        list.innerHTML =
            "";

        for(
            const comment of comments
        ){

            const element =
                await createCommentElement(
                    comment,
                    postId,
                    article
                );

            list.appendChild(
                element
            );
        }

    }catch(error){

        console.error(
            "WFESC comments error:",
            error
        );

        list.innerHTML =
            `
            <div class="comments-empty">

                تعذر تحميل التعليقات.

                <br>

                ${esc(
                    error?.message
                    ||
                    ""
                )}

            </div>
            `;
    }
}

/* =========================================================
   COMMENT STATS
========================================================= */

async function getCommentStats(
    commentId
){

    try{

        const data =
            await callRpc(
                "wfesc_comment_stats",
                {
                    target_comment_id:commentId
                }
            );

        const row =
            getRpcRow(data);

        if(!row){

            return {
                likes:0,
                dislikes:0,
                replies:0,
                liked:false,
                disliked:false
            };
        }

        return {

            likes:
                numericValue(
                    row.likes_count
                    ??
                    row.likes
                    ??
                    row.like_count
                ),

            dislikes:
                numericValue(
                    row.dislikes_count
                    ??
                    row.dislikes
                    ??
                    row.dislike_count
                ),

            replies:
                numericValue(
                    row.replies_count
                    ??
                    row.replies
                    ??
                    row.reply_count
                ),

            liked:
                boolValue(
                    row.is_liked
                    ??
                    row.viewer_liked
                    ??
                    row.liked_by_user
                ),

            disliked:
                boolValue(
                    row.is_disliked
                    ??
                    row.viewer_disliked
                    ??
                    row.disliked_by_user
                )
        };

    }catch(error){

        console.warn(
            "WFESC comment stats error:",
            error
        );

        return {

            likes:0,
            dislikes:0,
            replies:0,
            liked:false,
            disliked:false
        };
    }
}

async function createCommentElement(

){

        );

        : "comment";

    wrapper.dataset.id =
        comment.id;

        avatar_url:
            comment.avatar_url,

        username:
            comment.username,

        display_name:
            comment.display_name
            ||
            comment.full_name,

        bio:
            comment.bio
    };

    const stats =
        await getCommentStats(
            comment.id
        );

    const isOwner =
        boolValue(
            comment.is_owner
        )
        ||
        (
            currentUser &&
            String(
                comment.user_id
            ) ===
            String(
                currentUser.id
            )
        );

    wrapper.innerHTML = `

        <div class="comment-head">

            <img
                class="comment-avatar"
                src="${esc(profileAvatar(profile))}"
                alt="">

            <div>

                <div class="comment-user">
                    ${
                        esc(
                            profile.display_name
                            ||
                            profile.username
                            ||
                            "مستخدم"
                        )
                    }
                </div>

                <span class="comment-date">
                    ${esc(
                        formatDate(
                            comment.created_at
                        )
                    )}
                </span>

            </div>

        </div>

        <div class="comment-content">
            ${esc(comment.content)}
        </div>

        <div class="comment-meta">

            <button
                type="button"
                class="comment-button comment-like ${
                    stats.liked
                    ? "active"
                    : ""
                }">

                ❤️
                ${stats.likes}

            </button>

            <button
                type="button"
                class="comment-button comment-dislike ${
                    stats.disliked
                    ? "active"
                    : ""
                }">

                👎
                ${stats.dislikes}

            </button>

            ${
                !isReply
                ?
                `
                <button
                    type="button"
                    class="comment-button reply-button">
                    رد
                </button>
                `
                :
                ""
            }

            ${
                stats.replies > 0 && !isReply
                ?
                `
                <button
                    type="button"
                    class="comment-button replies-button">
                    الردود ${stats.replies}
                </button>
                `
                :
                ""
            }

            ${
                isOwner
                ?
                `
                <button
                    type="button"
                    class="comment-button edit-comment-button">
                    تعديل
                </button>
                `
                :
                ""
            }

        </div>

        ${
            !isReply
            ?
            `
            <div
                class="replies-list hidden">
            </div>
            `
            :
            ""
        }

    `;


    wrapper
        .querySelector(
            ".comment-like"
        )
        ?.addEventListener(
            "click",
            async event => {

                await reactToComment(
                    comment.id,
                    "like",
                    wrapper,
                    event.currentTarget
                );

            }
        );


    wrapper
        .querySelector(
            ".comment-dislike"
        )
        ?.addEventListener(
            "click",
            async event => {

                await reactToComment(
                    comment.id,
                    "dislike",
                    wrapper,
                    event.currentTarget
                );

            }
        );


    wrapper
        .querySelector(
            ".reply-button"
        )
        ?.addEventListener(
            "click",
            () => {

                if(!currentUser){

                    showToast(
                        "سجّل الدخول أولاً للرد"
                    );

                    return;

                    article.querySelector(

            ".edit-comment-button"

        ?.addEventListener(

            async () => {

                await editCommentFlow(

async function reactToComment(

    wrapper,
    clickedButton = null
){

    if(!currentUser){

        );

    try{

        if(type === "like"){

            const {
                data:current,
                error:currentError
            } =
                await supabaseClient
                    .from("comment_likes")
                    .select("id")
                    .eq(
                        "comment_id",
                        commentId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();

            if(currentError){

                throw currentError;
            }

            if(current){

                const {
                    error
                } =
                    await supabaseClient
                        .from("comment_likes")
                        .delete()
                        .eq(
                            "id",
                            current.id
                        );

                if(error){

                    throw error;
                }

            }else{

                const {
                    error:deleteDislikeError
                } =
                    await supabaseClient
                        .from("comment_dislikes")
                        .delete()
                        .eq(
                            "comment_id",
                            commentId
                        )
                        .eq(
                            "user_id",
                            currentUser.id
                        );

                if(deleteDislikeError){

                    throw deleteDislikeError;
                }

                const {
                    error:upsertLikeError
                } =
                    await supabaseClient
                        .from("comment_likes")
                        .upsert(
                            {
                                comment_id:
                                    commentId,
                                user_id:
                                    currentUser.id
                            },
                            {
                                onConflict:
                                    "user_id,comment_id"
                            }
                        );

                if(upsertLikeError){

                    throw upsertLikeError;
                }
            }

        }else{

            const {
                data:current,
                error:currentError
            } =
                await supabaseClient
                    .from("comment_dislikes")
                    .select("id")
                    .eq(
                        "comment_id",
                        commentId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();

            if(currentError){

                throw currentError;
            }

            if(current){

                const {
                    error
                } =
                    await supabaseClient
                        .from("comment_dislikes")
                        .delete()
                        .eq(
                            "id",
                            current.id
                        );

                if(error){

                    throw error;
                }

            }else{

                const {
                    error:deleteLikeError
                } =
                    await supabaseClient
                        .from("comment_likes")
                        .delete()
                        .eq(
                            "comment_id",
                            commentId
                        )
                        .eq(
                            "user_id",
                            currentUser.id
                        );

                if(deleteLikeError){

                    throw deleteLikeError;
                }

                const {
                    error:upsertDislikeError
                } =
                    await supabaseClient
                        .from("comment_dislikes")
                        .upsert(
                            {
                                comment_id:
                                    commentId,
                                user_id:
                                    currentUser.id
                            },
                            {
                                onConflict:
                                    "user_id,comment_id"
                            }
                        );

                if(upsertDislikeError){

                    throw upsertDislikeError;
                }
            }
        }

        const stats =
            await getCommentStats(
                commentId
            );

        const likeButton =
            wrapper.querySelector(
                ".comment-like"
            );

        const dislikeButton =
            wrapper.querySelector(
                ".comment-dislike"
            );

        if(likeButton){

            likeButton.classList.toggle(
                "active",
                stats.liked
            );

            likeButton.textContent =
                `❤️ ${stats.likes}`;
        }

        if(dislikeButton){

            dislikeButton.classList.toggle(
                "active",
                stats.disliked
            );

            dislikeButton.textContent =
                `👎 ${stats.dislikes}`;
        }

    }catch(error){

        console.error(
            "WFESC comment reaction error:",
            error
        );

        showToast(
            error.message
            ||
            "تعذر تحديث التفاعل"
        );

    }finally{

        if(clickedButton){

            clickedButton.disabled =
                false;
        }
    }
}


/* =========================================================
   LOAD REPLIES
========================================================= */

async function loadReplies(
    wrapper,
    commentId
){

    const repliesList =
        wrapper.querySelector(
            ".replies-list"
        );

    if(!repliesList){
        return;
    }

    const opening =
        repliesList.classList.contains(
            "hidden"
        );

    if(!opening){

        repliesList.classList.add(
            "hidden"
        );

        return;
    }

    repliesList.classList.remove(
        "hidden"
    );

    repliesList.innerHTML =
        `
        <div class="comments-loading">
            جاري تحميل الردود...
        </div>
        `;

    try{

        const data =
            await callRpc(
                "wfesc_get_comment_replies",
                {
                    target_comment_id:commentId,
                    result_limit:50,
                    result_offset:0
                }
            );

        const replies =
            getArray(
                data
            );

        if(!replies.length){

            repliesList.innerHTML =
                `
                <div class="comments-empty">
                    لا توجد ردود.
                </div>
                `;

            return;
        }

        repliesList.innerHTML =
            "";

        for(
            const reply of replies
        ){

            const element =
                await createCommentElement(
                    reply,
                    reply.post_id,
                    wrapper.closest(".post"),
                    true
                );

            repliesList.appendChild(
                element
            );
        }

    }catch(error){

        console.error(
            "WFESC replies error:",
            error
        );

        repliesList.innerHTML =
            `
            <div class="comments-empty">

                تعذر تحميل الردود.

                <br>

                ${esc(
                    error?.message
                    ||
                    ""
                )}

            </div>
            `;
    }
}


/* =========================================================
   EDIT COMMENT
========================================================= */

async function editCommentFlow(
    comment,
    article
){

    if(!currentUser){
        return;
    }

    const value =
        window.prompt(
            "تعديل التعليق:",
            comment.content || ""
        );

    if(value === null){
        return;
    }

    const content =
        value.trim();

    if(!content){

        showToast(
            "التعليق لا يمكن أن يكون فارغًا"
        );

        return;
    }

    try{

        await callRpc(
            "wfesc_update_comment",
            {
                target_comment_id:
                    comment.id,
                new_content:
                    content
            }
        );

        const postArticle =
            article.closest(
                ".post"
            );

        const postId =
            postArticle?.dataset.id;

        if(
            postId &&
            postArticle
        ){

            await loadCommentsIntoPost(
                postArticle,
                postId
            );

            await refreshSinglePostStats(
                postArticle,
                postId
            );
        }

        showToast(
            "تم تعديل التعليق"
        );

    }catch(error){

        console.error(
            "WFESC comment update error:",
            error
        );

        showToast(
            error.message
            ||
            "تعذر تعديل التعليق"
        );
    }
}

/* =========================================================
   MEDIA VALIDATION
========================================================= */

async function validateMedia(
    url,
    type
){

    if(
        !url &&
        type
    ){

        throw new Error(
            "رابط الوسائط مطلوب."
        );
    }

    const safeUrl =
        escapeUrl(url);

    if(!safeUrl){

        throw new Error(
            "رابط الوسائط غير صالح."
        );
    }

    try{

        await callRpc(
            "wfesc_validate_post_media",
            {
                media_url:safeUrl,
                media_type:type
            }
        );

    }catch(error){

        throw new Error(
            error.message
            ||
            "الوسائط غير صالحة."
        );
    }

    return safeUrl;
}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost(){

    if(!currentUser){

        throw new Error(
            "سجّل الدخول أولاً لإنشاء منشور."
        );
    }

    const title =
        postTitleInput.value.trim();

    const content =
        postContentInput.value.trim();

    const mediaType =
        postMediaTypeInput.value;

    const visibility =
        postVisibilityInput.value;

    const mediaUrl =
        await validateMedia(
            postMediaUrlInput.value.trim(),
            mediaType
        );

    if(!title){

        throw new Error(
            "عنوان المنشور مطلوب."
        );
    }

    await callRpc(
        "wfesc_create_post",
        {
            post_title:title,
            post_content:content,
            post_media_url:mediaUrl,
            post_media_type:mediaType,
            post_type:mediaType,
            post_visibility:visibility
        }
    );
}


/* =========================================================
   UPDATE POST
========================================================= */

async function updatePost(){

    if(!currentUser){

        throw new Error(
            "سجّل الدخول أولاً."
        );
    }

    if(!editingPostId){

        throw new Error(
            "لم يتم تحديد المنشور."
        );
    }

    const title =
        postTitleInput.value.trim();

    const content =
        postContentInput.value.trim();

    const visibility =
        postVisibilityInput.value;

    if(!title){

        throw new Error(
            "عنوان المنشور مطلوب."
        );
    }

    await callRpc(
        "wfesc_update_post",
        {
            target_post_id:
                editingPostId,
            new_title:
                title,
            new_content:
                content,
            new_visibility:
                visibility
        }
    );
}


/* =========================================================
   FORM
========================================================= */

postForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(postSubmit.disabled){
            return;
        }

        postSubmit.disabled =
            true;

        const wasEditing =
            Boolean(
                editingPostId
            );

        postSubmit.textContent =
            wasEditing
            ? "جاري الحفظ..."
            : "جاري النشر...";

        try{

            if(wasEditing){

                await updatePost();

                showToast(
                    "تم تعديل المنشور"
                );

            }else{

                await createPost();

                showToast(
                    "تم نشر المنشور"
                );
            }

            closePostModal();

            await loadPosts({
                feed:currentFeed
            });

        }catch(error){

            console.error(
                "WFESC publish/update error:",
                error
            );

            showToast(
                error.message
                ||
                "تعذر إكمال العملية"
            );

        }finally{

            postSubmit.disabled =
                false;

            postSubmit.textContent =
                wasEditing
                ? "حفظ التعديل"
                : "نشر";
        }
    }
);


/* =========================================================
   DELETE POST - SOFT DELETE
========================================================= */

async function deletePost(
    postId
){

    if(!currentUser){

        showToast(
            "سجّل الدخول أولاً"
        );

        return;
    }

    const confirmed =
        window.confirm(
            "هل تريد حذف المنشور؟\n\nسيتم الحذف من الواجهة باستخدام الحذف الناعم، ولن يتم حذف السجل مباشرة من قاعدة البيانات."
        );

    if(!confirmed){
        return;
    }

    try{

        await callRpc(
            "wfesc_delete_post",
            {
                target_post_id:
                    postId
            }
        );

        const article =
            document.querySelector(
                `.post[data-id="${CSS.escape(String(postId))}"]`
            );

        if(article){

            article.remove();
        }

        postsCache =
            postsCache.filter(
                post =>
                    String(post.id) !==
                    String(postId)
            );

        showToast(
            "تم حذف المنشور من العرض"
        );

    }catch(error){

        console.error(
            "WFESC delete post error:",
            error
        );

        showToast(
            error.message
            ||
            "تعذر حذف المنشور"
        );
    }
}

async function updateLoggedUser(){

){

}

/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();

    if(error){

        console.error(
            "WFESC getSession error:",
            error
        );

        const sessionError =
            new Error(
                [
                    error.message,
                    error.details,
                    error.hint,
                    error.code
                        ? `code: ${error.code}`
                        : ""
                ]
                .filter(Boolean)
                .join("\n")
            );

        sessionError.code =
            error.code || "";

        sessionError.details =
            error.details || "";

        sessionError.hint =
            error.hint || "";

        throw sessionError;
    }

    currentUser =
        data?.session?.user
        ||
        null;

    await updateLoggedUser();

    await loadPosts({
        feed:currentFeed
    });
}
