<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>النشر | WFESC</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- نظام تنقل WFESC -->
    <script src="./navigation/navigation-loader.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #171717 0%,
                    #080808 45%,
                    #030303 100%
                );

            color: #fff;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            padding-bottom: 105px;
        }

        button,
        textarea,
        select,
        input {
            font-family:
                Arial,
                Tahoma,
                sans-serif;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .publish-page {
            width: 100%;
            min-height: 100vh;
            padding: 25px 14px 115px;
        }

        .publish-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* =========================
           HEADER
        ========================= */

        .publish-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
        }

        .publish-title-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .publish-title {
            font-size: 27px;
            font-weight: 800;
        }

        .publish-subtitle {
            color: #888;
            font-size: 13px;
        }

        .publish-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.08);

            font-size: 25px;
        }

        /* =========================
           CARD
        ========================= */

        .publish-card {
            width: 100%;

            padding: 18px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid
                rgba(255,255,255,0.075);

            box-shadow:
                0 20px 70px
                rgba(0,0,0,0.3);
        }

        /* =========================
           USER
        ========================= */

        .publish-user {
            display: flex;
            align-items: center;
            gap: 11px;

            margin-bottom: 17px;
        }

        .publish-avatar {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #2b2b2b,
                    #090909
                );

            border:
                1px solid
                rgba(255,255,255,0.1);

            font-weight: 800;
            font-size: 19px;
        }

        .publish-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }

        .publish-user-name {
            font-size: 14px;
            font-weight: 700;
        }

        .publish-user-label {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
        }

        /* =========================
           TEXT
        ========================= */

        .publish-text {
            width: 100%;
            min-height: 155px;

            resize: vertical;

            padding: 15px;

            border-radius: 16px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(0,0,0,0.25);

            color: #fff;

            font-size: 14px;

            line-height: 1.8;
        }

        .publish-text::placeholder {
            color: #666;
        }

        .publish-text:focus {
            border-color:
                rgba(255,255,255,0.22);
        }

        /* =========================
           MEDIA AREA
        ========================= */

        .publish-media-area {
            display: block;
            margin-top: 13px;
        }

        .publish-media-area.hidden {
            display: none;
        }

        .publish-preview {
            display: none;

            position: relative;

            margin-top: 13px;

            border-radius: 16px;

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #080808;
        }

        .publish-preview.show {
            display: block;
        }

        .publish-preview img,
        .publish-preview video {
            width: 100%;
            max-height: 420px;

            object-fit: contain;

            display: block;

            background: #000;
        }

        .remove-media {
            position: absolute;

            top: 9px;
            left: 9px;

            z-index: 3;

            width: 35px;
            height: 35px;

            border: 0;

            border-radius: 50%;

            background:
                rgba(0,0,0,0.78);

            color: #fff;

            cursor: pointer;

            font-size: 16px;
        }

        /* =========================
           MEDIA BUTTON
        ========================= */

        .publish-tools {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;

            margin-top: 13px;
        }

        .publish-tool {
            height: 47px;

            border-radius: 13px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color: #fff;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                opacity 0.15s ease;
        }

        .publish-tool:active {
            transform: scale(0.97);
        }

        .publish-tool:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #mediaInput {
            display: none;
        }

        /* =========================
           TYPE INFO
        ========================= */

        .publish-type-info {
            margin-top: 9px;

            color: #777;

            font-size: 11px;

            line-height: 1.7;

            text-align: center;
        }

        /* =========================
           SETTINGS
        ========================= */

        .publish-settings {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;

            margin-top: 13px;
        }

        .publish-setting {
            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .publish-setting label {
            color: #888;

            font-size: 11px;
        }

        .publish-select {
            width: 100%;
            height: 44px;

            padding: 0 12px;

            border-radius: 12px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                #111;

            color: #fff;

            font-size: 12px;
        }

        .publish-select:focus {
            border-color:
                rgba(255,255,255,0.2);
        }

        /* =========================
           BOTTOM
        ========================= */

        .publish-bottom {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 13px;
        }

        .character-count {
            color: #777;

            font-size: 11px;
        }

        .publish-button {
            min-width: 135px;
            height: 48px;

            padding:
                0 25px;

            border: 0;

            border-radius: 14px;

            background:
                #fff;

            color: #050505;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .publish-button:active {
            transform: scale(0.96);
        }

        .publish-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        .publish-status {
            display: none;

            margin-top: 13px;

            padding: 12px 14px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.07);

            color: #bbb;

            font-size: 12px;

            line-height: 1.7;

            text-align: center;
        }

        .publish-status.show {
            display: block;
        }

        .publish-status.success {
            border-color:
                rgba(100,255,150,0.2);

            color: #b9ffd0;
        }

        .publish-status.error {
            border-color:
                rgba(255,80,80,0.22);

            color: #ffb2b2;
        }

        .publish-status.loading {
            color: #ddd;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .publish-page {
                padding:
                    20px 11px 110px;
            }

            .publish-title {
                font-size: 24px;
            }

            .publish-card {
                padding: 14px;

                border-radius: 19px;
            }

            .publish-settings {
                grid-template-columns:
                    1fr 1fr;
            }

            .publish-bottom {
                align-items: stretch;
            }

            .publish-button {
                padding:
                    0 18px;
            }

        }

    </style>

</head>


<body>

    <main class="publish-page">

        <div class="publish-container">

            <!-- HEADER -->

            <header class="publish-header">

                <div class="publish-title-box">

                    <h1 class="publish-title">
                        النشر
                    </h1>

                    <p class="publish-subtitle">
                        أنشئ منشورك وشاركه على WFESC
                    </p>

                </div>

                <div
                    class="publish-icon"
                    aria-hidden="true"
                >
                    ＋
                </div>

            </header>


            <!-- PUBLISH CARD -->

            <section class="publish-card">

                <!-- USER -->

                <div class="publish-user">

                    <div class="publish-avatar">

                        <span id="publishAvatarLetter">
                            W
                        </span>

                        <img
                            id="publishAvatarImage"
                            alt="صورة الحساب"
                        >

                    </div>

                    <div>

                        <div
                            id="publishUserName"
                            class="publish-user-name"
                        >
                            WFESC
                        </div>

                        <div class="publish-user-label">
                            إنشاء منشور جديد
                        </div>

                    </div>

                </div>


                <!-- TEXT -->

                <textarea
                    id="publishText"
                    class="publish-text"
                    maxlength="5000"
                    placeholder="اكتب منشورك هنا..."
                ></textarea>


                <!-- MEDIA AREA -->

                <div
                    id="publishMediaArea"
                    class="publish-media-area"
                >

                    <!-- MEDIA PREVIEW -->

                    <div
                        id="publishPreview"
                        class="publish-preview"
                    >

                        <img
                            id="previewImage"
                            alt="معاينة الصورة"
                        >

                        <video
                            id="previewVideo"
                            controls
                            playsinline
                            preload="metadata"
                        ></video>

                        <button
                            id="removeMedia"
                            class="remove-media"
                            type="button"
                            aria-label="إزالة الملف"
                        >
                            ×
                        </button>

                    </div>


                    <!-- TOOLS -->

                    <div class="publish-tools">

                        <button
                            id="mediaButton"
                            class="publish-tool"
                            type="button"
                        >
                            🖼️ إضافة صورة
                        </button>

                        <button
                            id="clearButton"
                            class="publish-tool"
                            type="button"
                        >
                            🗑️ مسح
                        </button>

                    </div>


                    <input
                        id="mediaInput"
                        type="file"
                        accept="image/jpeg,image/png,image/webp,image/gif"
                    >

                    <div
                        id="publishTypeInfo"
                        class="publish-type-info"
                    >
                        صورة واحدة فقط
                    </div>

                </div>


                <!-- SETTINGS -->

                <div class="publish-settings">

                    <!-- VISIBILITY -->

                    <div class="publish-setting">

                        <label for="visibilitySelect">
                            الخصوصية
                        </label>

                        <select
                            id="visibilitySelect"
                            class="publish-select"
                        >

                            <option value="public">
                                🌐 عام
                            </option>

                            <option value="friends">
                                👥 الأصدقاء
                            </option>

                            <option value="private">
                                🔒 خاص
                            </option>

                        </select>

                    </div>


                    <!-- POST TYPE -->

                    <div class="publish-setting">

                        <label for="typeSelect">
                            نوع المنشور
                        </label>

                        <select
                            id="typeSelect"
                            class="publish-select"
                        >

                            <option value="image">
                                🖼️ منشور صورة
                            </option>

                            <option value="text">
                                📝 منشور نصي
                            </option>

                            <option value="video">
                                🎥 منشور فيديو
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BOTTOM -->

                <div class="publish-bottom">

                    <span
                        id="characterCount"
                        class="character-count"
                    >
                        0 / 5000
                    </span>

                    <button
                        id="publishButton"
                        class="publish-button"
                        type="button"
                    >
                        نشر المنشور
                    </button>

                </div>


                <!-- STATUS -->

                <div
                    id="publishStatus"
                    class="publish-status"
                ></div>

            </section>

        </div>

    </main>


    <script>

        /* =========================================================
           WFESC PUBLISH CORE
           القسم الثاني - نظام النشر النهائي
        ========================================================= */


        /* =========================================================
           SUPABASE
        ========================================================= */

        const WFESC_SUPABASE_URL =
            "https://mcgbzfgbaxwmutniorlw.supabase.co";

        const WFESC_SUPABASE_KEY =
            "sb_publishable_5b7pTbiGY2D6vDLRsWgVzA_X926lBeM";


        const supabaseClient =
            window.supabase.createClient(
                WFESC_SUPABASE_URL,
                WFESC_SUPABASE_KEY
            );


        /* =========================================================
           STORAGE
        ========================================================= */

        const POST_MEDIA_BUCKET =
            "posts-media";


        /* =========================================================
           LIMITS
        ========================================================= */

        const MAX_IMAGE_SIZE =
            10 * 1024 * 1024;

        const MAX_VIDEO_SIZE =
            100 * 1024 * 1024;


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const publishText =
            document.getElementById(
                "publishText"
            );

        const characterCount =
            document.getElementById(
                "characterCount"
            );

        const mediaArea =
            document.getElementById(
                "publishMediaArea"
            );

        const mediaButton =
            document.getElementById(
                "mediaButton"
            );

        const mediaInput =
            document.getElementById(
                "mediaInput"
            );

        const publishPreview =
            document.getElementById(
                "publishPreview"
            );

        const previewImage =
            document.getElementById(
                "previewImage"
            );

        const previewVideo =
            document.getElementById(
                "previewVideo"
            );

        const removeMedia =
            document.getElementById(
                "removeMedia"
            );

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const publishButton =
            document.getElementById(
                "publishButton"
            );

        const publishStatus =
            document.getElementById(
                "publishStatus"
            );

        const visibilitySelect =
            document.getElementById(
                "visibilitySelect"
            );

        const typeSelect =
            document.getElementById(
                "typeSelect"
            );

        const publishTypeInfo =
            document.getElementById(
                "publishTypeInfo"
            );

        const publishUserName =
            document.getElementById(
                "publishUserName"
            );

        const publishAvatarLetter =
            document.getElementById(
                "publishAvatarLetter"
            );

        const publishAvatarImage =
            document.getElementById(
                "publishAvatarImage"
            );


        /* =========================================================
           STATE
        ========================================================= */

        let selectedMediaFile =
            null;

        let selectedMediaPreviewURL =
            null;

        let selectedMediaKind =
            null;

        let isPublishing =
            false;


        /* =========================================================
           STATUS
        ========================================================= */

        function showStatus(
            message,
            type = ""
        ) {

            publishStatus.textContent =
                message;

            publishStatus.className =
                "publish-status show";

            if (type) {

                publishStatus.classList.add(
                    type
                );

            }

        }


        function hideStatus() {

            publishStatus.textContent =
                "";

            publishStatus.className =
                "publish-status";

        }


        /* =========================================================
           CHARACTER COUNT
        ========================================================= */

        function updateCharacterCount() {

            const length =
                publishText.value.length;

            characterCount.textContent =
                length +
                " / 5000";

        }


        publishText.addEventListener(
            "input",
            updateCharacterCount
        );


        /* =========================================================
           AUTH
        ========================================================= */

        async function getCurrentUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();


            if (error) {
                return null;
            }


            return (
                data?.user ||
                null
            );

        }


        /* =========================================================
           PROFILE
        ========================================================= */

        async function loadCurrentProfile(
            user
        ) {

            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "username, avatar_url"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (error) {

                publishUserName.textContent =
                    user.email ||
                    "مستخدم WFESC";

                return;

            }


            const username =
                data?.username ||
                user.user_metadata?.username ||
                user.email ||
                "مستخدم WFESC";


            publishUserName.textContent =
                username;


            if (
                data?.avatar_url
            ) {

                publishAvatarImage.src =
                    data.avatar_url;

                publishAvatarImage.style.display =
                    "block";

                publishAvatarLetter.style.display =
                    "none";

            } else {

                const firstLetter =
                    username
                        .trim()
                        .charAt(0)
                        .toUpperCase() ||
                    "W";


                publishAvatarLetter.textContent =
                    firstLetter;


                publishAvatarLetter.style.display =
                    "block";

            }

        }


        /* =========================================================
           POST TYPE UI
        ========================================================= */

        function updatePostTypeUI() {

            const postType =
                typeSelect.value;


            removeSelectedMedia();


            /*
             * TEXT
             */

            if (
                postType === "text"
            ) {

                mediaArea.classList.add(
                    "hidden"
                );


                publishText.placeholder =
                    "اكتب منشورك النصي هنا...";


                publishTypeInfo.textContent =
                    "المنشور النصي يقبل النص فقط بدون صورة أو فيديو.";


                return;

            }


            /*
             * IMAGE
             */

            if (
                postType === "image"
            ) {

                mediaArea.classList.remove(
                    "hidden"
                );


                mediaButton.textContent =
                    "🖼️ إضافة صورة";


                mediaInput.accept =
                    "image/jpeg,image/png,image/webp,image/gif";


                publishText.placeholder =
                    "اكتب وصفاً للصورة...";


                publishTypeInfo.textContent =
                    "صورة واحدة فقط. الفيديو غير مسموح في منشور الصورة.";


                return;

            }


            /*
             * VIDEO
             */

            if (
                postType === "video"
            ) {

                mediaArea.classList.remove(
                    "hidden"
                );


                mediaButton.textContent =
                    "🎥 إضافة فيديو";


                mediaInput.accept =
                    "video/mp4,video/webm,video/ogg,video/quicktime";


                publishText.placeholder =
                    "اكتب وصفاً للفيديو...";


                publishTypeInfo.textContent =
                    "فيديو واحد فقط. منشور الفيديو ينتهي بعد 24 ساعة.";


                return;

            }

        }


        typeSelect.addEventListener(
            "change",
            function () {

                updatePostTypeUI();

                hideStatus();

            }
        );


        /* =========================================================
           MEDIA BUTTON
        ========================================================= */

        mediaButton.addEventListener(
            "click",
            function () {

                if (
                    isPublishing
                ) {
                    return;
                }


                if (
                    typeSelect.value ===
                    "text"
                ) {
                    return;
                }


                mediaInput.click();

            }
        );


        /* =========================================================
           MEDIA SELECT
        ========================================================= */

        mediaInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files?.[0];


                if (!file) {
                    return;
                }


                const postType =
                    typeSelect.value;


                /*
                 * TEXT
                 */

                if (
                    postType === "text"
                ) {

                    this.value = "";

                    showStatus(
                        "المنشور النصي لا يقبل ملفات.",
                        "error"
                    );

                    return;

                }


                /*
                 * IMAGE
                 */

                if (
                    postType === "image"
                ) {

                    if (
                        !file.type.startsWith(
                            "image/"
                        )
                    ) {

                        this.value = "";

                        showStatus(
                            "منشور الصورة يقبل صورة فقط.",
                            "error"
                        );

                        return;

                    }


                    if (
                        file.size >
                        MAX_IMAGE_SIZE
                    ) {

                        this.value = "";

                        showStatus(
                            "حجم الصورة يجب ألا يتجاوز 10MB.",
                            "error"
                        );

                        return;

                    }

                }


                /*
                 * VIDEO
                 */

                if (
                    postType === "video"
                ) {

                    if (
                        !file.type.startsWith(
                            "video/"
                        )
                    ) {

                        this.value = "";

                        showStatus(
                            "منشور الفيديو يقبل فيديو فقط.",
                            "error"
                        );

                        return;

                    }


                    if (
                        file.size >
                        MAX_VIDEO_SIZE
                    ) {

                        this.value = "";

                        showStatus(
                            "حجم الفيديو يجب ألا يتجاوز 100MB.",
                            "error"
                        );

                        return;

                    }

                }


                selectedMediaFile =
                    file;


                selectedMediaKind =
                    postType;


                if (
                    selectedMediaPreviewURL
                ) {

                    URL.revokeObjectURL(
                        selectedMediaPreviewURL
                    );

                }


                selectedMediaPreviewURL =
                    URL.createObjectURL(
                        file
                    );


                /*
                 * IMAGE PREVIEW
                 */

                if (
                    postType === "image"
                ) {

                    previewVideo.pause();

                    previewVideo.removeAttribute(
                        "src"
                    );

                    previewVideo.load();

                    previewVideo.style.display =
                        "none";


                    previewImage.src =
                        selectedMediaPreviewURL;

                    previewImage.style.display =
                        "block";

                }


                /*
                 * VIDEO PREVIEW
                 */

                if (
                    postType === "video"
                ) {

                    previewImage.removeAttribute(
                        "src"
                    );

                    previewImage.style.display =
                        "none";


                    previewVideo.src =
                        selectedMediaPreviewURL;

                    previewVideo.style.display =
                        "block";

                }


                publishPreview.classList.add(
                    "show"
                );


                hideStatus();

            }
        );


        /* =========================================================
           REMOVE MEDIA
        ========================================================= */

        removeMedia.addEventListener(
            "click",
            function () {

                removeSelectedMedia();

            }
        );


        function removeSelectedMedia() {

            selectedMediaFile =
                null;


            selectedMediaKind =
                null;


            mediaInput.value =
                "";


            if (
                selectedMediaPreviewURL
            ) {

                URL.revokeObjectURL(
                    selectedMediaPreviewURL
                );

                selectedMediaPreviewURL =
                    null;

            }


            previewImage.removeAttribute(
                "src"
            );


            previewVideo.pause();

            previewVideo.removeAttribute(
                "src"
            );

            previewVideo.load();


            previewImage.style.display =
                "none";

            previewVideo.style.display =
                "none";


            publishPreview.classList.remove(
                "show"
            );

        }


        /* =========================================================
           CLEAR
        ========================================================= */

        clearButton.addEventListener(
            "click",
            function () {

                if (
                    isPublishing
                ) {
                    return;
                }


                publishText.value =
                    "";


                visibilitySelect.value =
                    "public";


                typeSelect.value =
                    "image";


                removeSelectedMedia();


                updatePostTypeUI();


                hideStatus();


                updateCharacterCount();

            }
        );


        /* =========================================================
           FILE EXTENSION
        ========================================================= */

        function getFileExtension(
            file
        ) {

            const name =
                file.name ||
                "";


            const parts =
                name.split(".");


            if (
                parts.length < 2
            ) {

                return (
                    selectedMediaKind ===
                    "video"
                        ? "mp4"
                        : "jpg"
                );

            }


            const extension =
                parts
                    .pop()
                    .toLowerCase()
                    .replace(
                        /[^a-z0-9]/g,
                        ""
                    );


            if (
                extension
            ) {

                return extension;

            }


            return (
                selectedMediaKind ===
                "video"
                    ? "mp4"
                    : "jpg"
            );

        }


        /* =========================================================
           STORAGE FILE NAME
        ========================================================= */

        function createStorageFileName(
            userId,
            file
        ) {

            const extension =
                getFileExtension(
                    file
                );


            const randomPart =
                Math.random()
                    .toString(36)
                    .slice(2);


            const time =
                Date.now();


            return (
                userId +
                "/" +
                time +
                "-" +
                randomPart +
                "." +
                extension
            );

        }


        /* =========================================================
           UPLOAD POST MEDIA
        ========================================================= */

        async function uploadPostMedia(
            userId,
            file
        ) {

            const filePath =
                createStorageFileName(
                    userId,
                    file
                );


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        POST_MEDIA_BUCKET
                    )
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                file.type
                        }
                    );


            if (
                uploadError
            ) {

                throw new Error(
                    uploadError.message ||
                    "فشل رفع الملف."
                );

            }


            const {
                data
            } =
                supabaseClient
                    .storage
                    .from(
                        POST_MEDIA_BUCKET
                    )
                    .getPublicUrl(
                        filePath
                    );


            if (
                !data?.publicUrl
            ) {

                throw new Error(
                    "تم رفع الملف ولكن تعذر الحصول على رابطه."
                );

            }


            return data.publicUrl;

        }


        /* =========================================================
           CREATE POST
        ========================================================= */

        async function createPost() {

            if (
                isPublishing
            ) {
                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {

                showStatus(
                    "يجب تسجيل الدخول أولاً حتى تتمكن من النشر.",
                    "error"
                );

                return;

            }


            const content =
                publishText.value.trim();


            const visibility =
                visibilitySelect.value;


            const postType =
                typeSelect.value;


            /* =====================================================
               TEXT
            ===================================================== */

            if (
                postType === "text"
            ) {

                if (
                    !content
                ) {

                    showStatus(
                        "اكتب محتوى المنشور النصي أولاً.",
                        "error"
                    );

                    return;

                }


                if (
                    selectedMediaFile
                ) {

                    showStatus(
                        "المنشور النصي لا يقبل صورة أو فيديو.",
                        "error"
                    );

                    removeSelectedMedia();

                    return;

                }

            }


            /* =====================================================
               IMAGE
            ===================================================== */

            if (
                postType === "image"
            ) {

                if (
                    !selectedMediaFile
                ) {

                    showStatus(
                        "منشور الصورة يحتاج إلى صورة واحدة.",
                        "error"
                    );

                    return;

                }


                if (
                    !selectedMediaFile.type.startsWith(
                        "image/"
                    )
                ) {

                    showStatus(
                        "منشور الصورة يقبل صورة فقط.",
                        "error"
                    );

                    return;

                }

            }


            /* =====================================================
               VIDEO
            ===================================================== */

            if (
                postType === "video"
            ) {

                if (
                    !selectedMediaFile
                ) {

                    showStatus(
                        "منشور الفيديو يحتاج إلى فيديو واحد.",
                        "error"
                    );

                    return;

                }


                if (
                    !selectedMediaFile.type.startsWith(
                        "video/"
                    )
                ) {

                    showStatus(
                        "منشور الفيديو يقبل فيديو فقط.",
                        "error"
                    );

                    return;

                }

            }


            if (
                content.length >
                5000
            ) {

                showStatus(
                    "المحتوى تجاوز الحد المسموح به.",
                    "error"
                );

                return;

            }


            isPublishing =
                true;


            publishButton.disabled =
                true;

            clearButton.disabled =
                true;

            mediaButton.disabled =
                true;


            showStatus(
                "جاري تجهيز المنشور...",
                "loading"
            );


            let mediaURL =
                null;


            let mediaType =
                null;


            try {

                /* =================================================
                   رفع الوسائط
                ================================================= */

                if (
                    selectedMediaFile
                ) {

                    if (
                        postType ===
                        "image"
                    ) {

                        showStatus(
                            "جاري رفع الصورة...",
                            "loading"
                        );

                    }


                    if (
                        postType ===
                        "video"
                    ) {

                        showStatus(
                            "جاري رفع الفيديو...",
                            "loading"
                        );

                    }


                    mediaURL =
                        await uploadPostMedia(
                            user.id,
                            selectedMediaFile
                        );


                    mediaType =
                        selectedMediaFile.type;

                }


                /* =================================================
                   TEXT
                   
                   ممنوع إرسال media
                ================================================= */

                if (
                    postType ===
                    "text"
                ) {

                    mediaURL =
                        null;

                    mediaType =
                        null;

                }


                /* =================================================
                   CREATE RPC
                ================================================= */

                showStatus(
                    "جاري إنشاء المنشور...",
                    "loading"
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .rpc(
                            "wfesc_create_post",
                            {
                                post_title:
                                    null,

                                post_content:
                                    content ||
                                    null,

                                post_media_url:
                                    mediaURL,

                                post_media_type:
                                    mediaType,

                                post_type:
                                    postType,

                                post_visibility:
                                    visibility
                            }
                        );


                if (
                    error
                ) {

                    throw new Error(
                        error.message ||
                        "فشل إنشاء المنشور."
                    );

                }


                console.log(
                    "WFESC POST CREATED:",
                    data
                );


                /* =================================================
                   SUCCESS
                ================================================= */

                showStatus(
                    postType === "video"
                        ? "تم نشر الفيديو. سيبقى متاحاً لمدة 24 ساعة."
                        : "تم نشر المنشور بنجاح.",
                    "success"
                );


                publishText.value =
                    "";


                removeSelectedMedia();


                visibilitySelect.value =
                    "public";


                typeSelect.value =
                    "image";


                updatePostTypeUI();


                updateCharacterCount();


                /*
                 * الانتقال إلى المنشورات
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "posts.html";

                    },
                    1000
                );


            } catch (
                error
            ) {

                console.error(
                    "WFESC PUBLISH ERROR:",
                    error
                );


                showStatus(
                    getPublishErrorMessage(
                        error
                    ),
                    "error"
                );


            } finally {

                isPublishing =
                    false;


                publishButton.disabled =
                    false;


                clearButton.disabled =
                    false;


                mediaButton.disabled =
                    typeSelect.value ===
                    "text";

            }

        }


        /* =========================================================
           ERROR HANDLER
        ========================================================= */

        function getPublishErrorMessage(
            error
        ) {

            const message =
                String(
                    error?.message ||
                    ""
                );


            const lowerMessage =
                message.toLowerCase();


            if (
                lowerMessage.includes(
                    "bucket"
                )
            ) {

                return (
                    "تعذر رفع الملف لأن Storage غير مضبوط حالياً. " +
                    "تأكد من اسم Bucket الخاص بالمنشورات."
                );

            }


            if (
                lowerMessage.includes(
                    "not authenticated"
                ) ||
                lowerMessage.includes(
                    "يجب تسجيل الدخول"
                )
            ) {

                return (
                    "انتهت جلسة تسجيل الدخول. سجل الدخول مرة أخرى."
                );

            }


            if (
                lowerMessage.includes(
                    "row-level security"
                )
            ) {

                return (
                    "تم رفض العملية من صلاحيات قاعدة البيانات."
                );

            }


            if (
                lowerMessage.includes(
                    "المنشور النصي لا يقبل"
                )
            ) {

                return (
                    "المنشور النصي يقبل النص فقط."
                );

            }


            if (
                lowerMessage.includes(
                    "منشور الصورة يقبل"
                )
            ) {

                return (
                    "منشور الصورة يقبل صورة واحدة فقط."
                );

            }


            if (
                lowerMessage.includes(
                    "منشور الفيديو يقبل"
                )
            ) {

                return (
                    "منشور الفيديو يقبل فيديو واحد فقط."
                );

            }


            if (
                lowerMessage.includes(
                    "يحتاج إلى فيديو"
                )
            ) {

                return (
                    "أضف فيديو واحد قبل النشر."
                );

            }


            if (
                lowerMessage.includes(
                    "يحتاج إلى صورة"
                )
            ) {

                return (
                    "أضف صورة واحدة قبل النشر."
                );

            }


            return (
                "تعذر نشر المنشور حالياً. " +
                (
                    message ||
                    "حدث خطأ غير معروف."
                )
            );

        }


        /* =========================================================
           PUBLISH BUTTON
        ========================================================= */

        publishButton.addEventListener(
            "click",
            createPost
        );


        /* =========================================================
           CTRL + ENTER
        ========================================================= */

        publishText.addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.key ===
                    "Enter" &&
                    event.ctrlKey
                ) {

                    event.preventDefault();

                    createPost();

                }

            }
        );


        /* =========================================================
           AUTH STATE
        ========================================================= */

        supabaseClient.auth.onAuthStateChange(
            async function (
                event,
                session
            ) {

                if (
                    session?.user
                ) {

                    publishButton.disabled =
                        false;

                    mediaButton.disabled =
                        typeSelect.value ===
                        "text";


                    await loadCurrentProfile(
                        session.user
                    );

                }

            }
        );


        /* =========================================================
           INITIALIZATION
        ========================================================= */

        async function initializePublishPage() {

            updateCharacterCount();


            updatePostTypeUI();


            const user =
                await getCurrentUser();


            if (!user) {

                showStatus(
                    "سجل الدخول أولاً حتى تتمكن من إنشاء منشور.",
                    "error"
                );


                publishButton.disabled =
                    true;


                mediaButton.disabled =
                    true;


                return;

            }


            publishButton.disabled =
                false;


            mediaButton.disabled =
                typeSelect.value ===
                "text";


            await loadCurrentProfile(
                user
            );

        }


        initializePublishPage();


        /* =========================================================
           EXTERNAL BRIDGE
           جاهز لاحقاً للنقل إلى:
           posts-featwres/publish/
        ========================================================= */

        window.WFESC_PUBLISH_CORE = {

            createPost,

            getCurrentUser,

            uploadPostMedia,

            removeSelectedMedia,

            updateCharacterCount,

            updatePostTypeUI,

            showStatus,

            supabase:
                supabaseClient,

            storageBucket:
                POST_MEDIA_BUCKET

        };

    </script>
