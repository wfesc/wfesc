<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>النشر | WFESC</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- نظام تنقل WFESC -->
    <script src="./navigation/navigation-loader.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #171717 0%,
                    #080808 45%,
                    #030303 100%
                );

            color: #fff;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            padding-bottom: 105px;
        }

        button,
        textarea,
        select,
        input {
            font-family:
                Arial,
                Tahoma,
                sans-serif;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .publish-page {
            width: 100%;
            min-height: 100vh;
            padding: 25px 14px 115px;
        }

        .publish-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* =========================
           HEADER
        ========================= */

        .publish-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
        }

        .publish-title-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .publish-title {
            font-size: 27px;
            font-weight: 800;
        }

        .publish-subtitle {
            color: #888;
            font-size: 13px;
        }

        .publish-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.08);

            font-size: 25px;
        }

        /* =========================
           CARD
        ========================= */

        .publish-card {
            width: 100%;

            padding: 18px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid
                rgba(255,255,255,0.075);

            box-shadow:
                0 20px 70px
                rgba(0,0,0,0.3);
        }

        /* =========================
           USER
        ========================= */

        .publish-user {
            display: flex;
            align-items: center;
            gap: 11px;

            margin-bottom: 17px;
        }

        .publish-avatar {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #2b2b2b,
                    #090909
                );

            border:
                1px solid
                rgba(255,255,255,0.1);

            font-weight: 800;
            font-size: 19px;
        }

        .publish-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }

        .publish-user-name {
            font-size: 14px;
            font-weight: 700;
        }

        .publish-user-label {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
        }

        /* =========================
           TEXT
        ========================= */

        .publish-text {
            width: 100%;
            min-height: 155px;

            resize: vertical;

            padding: 15px;

            border-radius: 16px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(0,0,0,0.25);

            color: #fff;

            font-size: 14px;

            line-height: 1.8;
        }

        .publish-text::placeholder {
            color: #666;
        }

        .publish-text:focus {
            border-color:
                rgba(255,255,255,0.22);
        }

        /* =========================
           MEDIA PREVIEW
        ========================= */

        .publish-preview {
            display: none;

            position: relative;

            margin-top: 13px;

            border-radius: 16px;

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #080808;
        }

        .publish-preview.show {
            display: block;
        }

        .publish-preview img {
            width: 100%;
            max-height: 420px;

            object-fit: contain;

            display: block;
        }

        .remove-image {
            position: absolute;

            top: 9px;
            left: 9px;

            width: 35px;
            height: 35px;

            border: 0;

            border-radius: 50%;

            background:
                rgba(0,0,0,0.75);

            color: #fff;

            cursor: pointer;

            font-size: 16px;
        }

        /* =========================
           TOOLS
        ========================= */

        .publish-tools {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;

            margin-top: 13px;
        }

        .publish-tool {
            height: 47px;

            border-radius: 13px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color: #fff;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .publish-tool:active {
            transform: scale(0.97);
        }

        .publish-tool:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #imageInput {
            display: none;
        }

        /* =========================
           SETTINGS
        ========================= */

        .publish-settings {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;

            margin-top: 13px;
        }

        .publish-setting {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .publish-setting label {
            color: #888;
            font-size: 11px;
        }

        .publish-select {
            width: 100%;
            height: 44px;

            padding: 0 12px;

            border-radius: 12px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                #111;

            color: #fff;

            font-size: 12px;
        }

        /* =========================
           BOTTOM
        ========================= */

        .publish-bottom {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 13px;
        }

        .character-count {
            color: #777;
            font-size: 11px;
        }

        .publish-button {
            min-width: 135px;
            height: 48px;

            padding:
                0 25px;

            border: 0;

            border-radius: 14px;

            background:
                #fff;

            color: #050505;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .publish-button:active {
            transform: scale(0.96);
        }

        .publish-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        .publish-status {
            display: none;

            margin-top: 13px;

            padding: 12px 14px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.07);

            color: #bbb;

            font-size: 12px;

            line-height: 1.7;

            text-align: center;
        }

        .publish-status.show {
            display: block;
        }

        .publish-status.success {
            border-color:
                rgba(100,255,150,0.2);

            color: #b9ffd0;
        }

        .publish-status.error {
            border-color:
                rgba(255,80,80,0.22);

            color: #ffb2b2;
        }

        .publish-status.loading {
            color: #ddd;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .publish-page {
                padding:
                    20px 11px 110px;
            }

            .publish-title {
                font-size: 24px;
            }

            .publish-card {
                padding: 14px;
                border-radius: 19px;
            }

            .publish-settings {
                grid-template-columns:
                    1fr 1fr;
            }

            .publish-bottom {
                align-items: stretch;
            }

            .publish-button {
                padding:
                    0 18px;
            }

        }

    </style>

</head>


<body>

    <main class="publish-page">

        <div class="publish-container">

            <!-- HEADER -->

            <header class="publish-header">

                <div class="publish-title-box">

                    <h1 class="publish-title">
                        النشر
                    </h1>

                    <p class="publish-subtitle">
                        أنشئ منشورك وشاركه على WFESC
                    </p>

                </div>

                <div
                    class="publish-icon"
                    aria-hidden="true"
                >
                    ＋
                </div>

            </header>


            <!-- PUBLISH CARD -->

            <section class="publish-card">

                <!-- USER -->

                <div class="publish-user">

                    <div
                        id="publishAvatar"
                        class="publish-avatar"
                    >

                        <span id="publishAvatarLetter">
                            W
                        </span>

                        <img
                            id="publishAvatarImage"
                            alt="صورة الحساب"
                        >

                    </div>

                    <div>

                        <div
                            id="publishUserName"
                            class="publish-user-name"
                        >
                            WFESC
                        </div>

                        <div class="publish-user-label">
                            إنشاء منشور جديد
                        </div>

                    </div>

                </div>


                <!-- TEXT -->

                <textarea
                    id="publishText"
                    class="publish-text"
                    maxlength="5000"
                    placeholder="بماذا تفكر؟ اكتب منشورك هنا..."
                ></textarea>


                <!-- IMAGE PREVIEW -->

                <div
                    id="publishPreview"
                    class="publish-preview"
                >

                    <img
                        id="previewImage"
                        alt="معاينة الصورة"
                    >

                    <button
                        id="removeImage"
                        class="remove-image"
                        type="button"
                        aria-label="إزالة الصورة"
                    >
                        ×
                    </button>

                </div>


                <!-- TOOLS -->

                <div class="publish-tools">

                    <button
                        id="imageButton"
                        class="publish-tool"
                        type="button"
                    >
                        🖼️ إضافة صورة
                    </button>

                    <button
                        id="clearButton"
                        class="publish-tool"
                        type="button"
                    >
                        🗑️ مسح
                    </button>

                </div>


                <input
                    id="imageInput"
                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                >


                <!-- SETTINGS -->

                <div class="publish-settings">

                    <div class="publish-setting">

                        <label for="visibilitySelect">
                            الخصوصية
                        </label>

                        <select
                            id="visibilitySelect"
                            class="publish-select"
                        >

                            <option value="public">
                                🌐 عام
                            </option>

                            <option value="friends">
                                👥 الأصدقاء
                            </option>

                            <option value="private">
                                🔒 خاص
                            </option>

                        </select>

                    </div>


                    <div class="publish-setting">

                        <label for="typeSelect">
                            نوع المنشور
                        </label>

                        <select
                            id="typeSelect"
                            class="publish-select"
                        >

                            <option value="image">
                                🖼️ منشور صورة
                            </option>

                            <option value="text">
                                📝 منشور نصي
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BOTTOM -->

                <div class="publish-bottom">

                    <span
                        id="characterCount"
                        class="character-count"
                    >
                        0 / 5000
                    </span>

                    <button
                        id="publishButton"
                        class="publish-button"
                        type="button"
                    >
                        نشر المنشور
                    </button>

                </div>


                <!-- STATUS -->

                <div
                    id="publishStatus"
                    class="publish-status"
                ></div>

            </section>

        </div>

    </main>


    <script>

        /* =========================================================
           WFESC PUBLISH CORE
           القسم الثاني - نظام النشر النهائي
        ========================================================= */


        /* =========================================================
           SUPABASE
        ========================================================= */

        const WFESC_SUPABASE_URL =
            "https://mcgbzfgbaxwmutniorlw.supabase.co";

        const WFESC_SUPABASE_KEY =
            "sb_publishable_5b7pTbiGY2D6vDLRsWgVzA_X926lBeM";


        const supabaseClient =
            window.supabase.createClient(
                WFESC_SUPABASE_URL,
                WFESC_SUPABASE_KEY
            );


        /* =========================================================
           STORAGE
           
           إذا كان Bucket الخاص بصور المنشورات عندك باسم آخر،
           نغير هذا السطر فقط.
        ========================================================= */

        const POST_MEDIA_BUCKET =
            "posts-media";


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const publishText =
            document.getElementById(
                "publishText"
            );

        const characterCount =
            document.getElementById(
                "characterCount"
            );

        const imageButton =
            document.getElementById(
                "imageButton"
            );

        const imageInput =
            document.getElementById(
                "imageInput"
            );

        const publishPreview =
            document.getElementById(
                "publishPreview"
            );

        const previewImage =
            document.getElementById(
                "previewImage"
            );

        const removeImage =
            document.getElementById(
                "removeImage"
            );

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const publishButton =
            document.getElementById(
                "publishButton"
            );

        const publishStatus =
            document.getElementById(
                "publishStatus"
            );

        const visibilitySelect =
            document.getElementById(
                "visibilitySelect"
            );

        const typeSelect =
            document.getElementById(
                "typeSelect"
            );

        const publishUserName =
            document.getElementById(
                "publishUserName"
            );

        const publishAvatarLetter =
            document.getElementById(
                "publishAvatarLetter"
            );

        const publishAvatarImage =
            document.getElementById(
                "publishAvatarImage"
            );


        /* =========================================================
           STATE
        ========================================================= */

        let selectedImageFile = null;

        let selectedImagePreviewURL = null;

        let isPublishing = false;


        /* =========================================================
           STATUS
        ========================================================= */

        function showStatus(
            message,
            type = ""
        ) {

            publishStatus.textContent =
                message;

            publishStatus.className =
                "publish-status show";

            if (type) {

                publishStatus.classList.add(
                    type
                );

            }

        }


        function hideStatus() {

            publishStatus.textContent = "";

            publishStatus.className =
                "publish-status";

        }


        /* =========================================================
           CHARACTER COUNT
        ========================================================= */

        function updateCharacterCount() {

            const length =
                publishText.value.length;

            characterCount.textContent =
                length + " / 5000";

        }


        publishText.addEventListener(
            "input",
            updateCharacterCount
        );


        /* =========================================================
           AUTH
        ========================================================= */

        async function getCurrentUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();

            if (error) {
                return null;
            }

            return data?.user || null;

        }


        /* =========================================================
           PROFILE
        ========================================================= */

        async function loadCurrentProfile(
            user
        ) {

            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "username, avatar_url"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (error) {

                publishUserName.textContent =
                    user.email ||
                    "مستخدم WFESC";

                return;

            }


            const username =
                data?.username ||
                user.user_metadata?.username ||
                user.email ||
                "مستخدم WFESC";


            publishUserName.textContent =
                username;


            if (
                data?.avatar_url
            ) {

                publishAvatarImage.src =
                    data.avatar_url;

                publishAvatarImage.style.display =
                    "block";

                publishAvatarLetter.style.display =
                    "none";

            } else {

                const firstLetter =
                    username
                        .trim()
                        .charAt(0)
                        .toUpperCase() ||
                    "W";

                publishAvatarLetter.textContent =
                    firstLetter;

            }

        }


        /* =========================================================
           IMAGE SELECT
        ========================================================= */

        imageButton.addEventListener(
            "click",
            function () {

                if (isPublishing) {
                    return;
                }

                imageInput.click();

            }
        );


        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files?.[0];


                if (!file) {
                    return;
                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    showStatus(
                        "الملف المحدد ليس صورة صالحة.",
                        "error"
                    );

                    this.value = "";

                    return;

                }


                const maxSize =
                    10 * 1024 * 1024;


                if (
                    file.size > maxSize
                ) {

                    showStatus(
                        "حجم الصورة يجب ألا يتجاوز 10MB.",
                        "error"
                    );

                    this.value = "";

                    return;

                }


                selectedImageFile =
                    file;


                if (
                    selectedImagePreviewURL
                ) {

                    URL.revokeObjectURL(
                        selectedImagePreviewURL
                    );

                }


                selectedImagePreviewURL =
                    URL.createObjectURL(
                        file
                    );


                previewImage.src =
                    selectedImagePreviewURL;


                publishPreview.classList.add(
                    "show"
                );


                hideStatus();

            }
        );


        /* =========================================================
           REMOVE IMAGE
        ========================================================= */

        removeImage.addEventListener(
            "click",
            function () {

                removeSelectedImage();

            }
        );


        function removeSelectedImage() {

            selectedImageFile =
                null;

            imageInput.value =
                "";


            if (
                selectedImagePreviewURL
            ) {

                URL.revokeObjectURL(
                    selectedImagePreviewURL
                );

                selectedImagePreviewURL =
                    null;

            }


            previewImage.src =
                "";


            publishPreview.classList.remove(
                "show"
            );

        }


        /* =========================================================
           CLEAR
        ========================================================= */

        clearButton.addEventListener(
            "click",
            function () {

                if (isPublishing) {
                    return;
                }


                publishText.value =
                    "";

                visibilitySelect.value =
                    "public";

                typeSelect.value =
                    "image";


                removeSelectedImage();


                hideStatus();


                updateCharacterCount();

            }
        );


        /* =========================================================
           FILE EXTENSION
        ========================================================= */

        function getFileExtension(
            file
        ) {

            const name =
                file.name || "";

            const parts =
                name.split(".");


            if (
                parts.length < 2
            ) {

                return "jpg";

            }


            return parts
                .pop()
                .toLowerCase()
                .replace(
                    /[^a-z0-9]/g,
                    ""
                ) || "jpg";

        }


        /* =========================================================
           SAFE FILE NAME
        ========================================================= */

        function createStorageFileName(
            userId,
            file
        ) {

            const extension =
                getFileExtension(
                    file
                );


            const randomPart =
                Math.random()
                    .toString(36)
                    .slice(2);


            const time =
                Date.now();


            return (
                userId +
                "/" +
                time +
                "-" +
                randomPart +
                "." +
                extension
            );

        }


        /* =========================================================
           UPLOAD IMAGE
        ========================================================= */

        async function uploadPostImage(
            userId,
            file
        ) {

            const filePath =
                createStorageFileName(
                    userId,
                    file
                );


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        POST_MEDIA_BUCKET
                    )
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                file.type
                        }
                    );


            if (
                uploadError
            ) {

                throw new Error(
                    uploadError.message ||
                    "فشل رفع الصورة."
                );

            }


            const {
                data
            } =
                supabaseClient
                    .storage
                    .from(
                        POST_MEDIA_BUCKET
                    )
                    .getPublicUrl(
                        filePath
                    );


            if (
                !data?.publicUrl
            ) {

                throw new Error(
                    "تم رفع الصورة ولكن تعذر الحصول على رابطها."
                );

            }


            return data.publicUrl;

        }


        /* =========================================================
           CREATE POST
        ========================================================= */

        async function createPost() {

            if (isPublishing) {
                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {

                showStatus(
                    "يجب تسجيل الدخول أولاً حتى تتمكن من النشر.",
                    "error"
                );

                return;

            }


            const content =
                publishText.value.trim();


            const visibility =
                visibilitySelect.value;


            const postType =
                typeSelect.value;


            if (
                !content &&
                !selectedImageFile
            ) {

                showStatus(
                    "اكتب محتوى أو أضف صورة قبل النشر.",
                    "error"
                );

                return;

            }


            if (
                content.length > 5000
            ) {

                showStatus(
                    "المحتوى تجاوز الحد المسموح به.",
                    "error"
                );

                return;

            }


            if (
                postType === "image" &&
                !selectedImageFile &&
                !content
            ) {

                showStatus(
                    "أضف صورة أو اكتب محتوى قبل النشر.",
                    "error"
                );

                return;

            }


            isPublishing =
                true;


            publishButton.disabled =
                true;

            clearButton.disabled =
                true;

            imageButton.disabled =
                true;


            showStatus(
                "جاري تجهيز المنشور...",
                "loading"
            );


            let mediaURL =
                null;

            let mediaType =
                null;


            try {

                /*
                 * رفع الصورة أولاً
                 */

                if (
                    selectedImageFile
                ) {

                    showStatus(
                        "جاري رفع الصورة...",
                        "loading"
                    );


                    mediaURL =
                        await uploadPostImage(
                            user.id,
                            selectedImageFile
                        );


                    mediaType =
                        selectedImageFile.type;

                }


                /*
                 * إنشاء المنشور عبر RPC
                 */

                showStatus(
                    "جاري إنشاء المنشور...",
                    "loading"
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .rpc(
                            "wfesc_create_post",
                            {
                                post_title:
                                    null,

                                post_content:
                                    content ||
                                    null,

                                post_media_url:
                                    mediaURL,

                                post_media_type:
                                    mediaType,

                                post_type:
                                    postType,

                                post_visibility:
                                    visibility
                            }
                        );


                if (
                    error
                ) {

                    throw new Error(
                        error.message ||
                        "فشل إنشاء المنشور."
                    );

                }


                /*
                 * نجاح
                 */

                showStatus(
                    "تم نشر المنشور بنجاح.",
                    "success"
                );


                /*
                 * تنظيف الواجهة
                 */

                publishText.value =
                    "";

                removeSelectedImage();

                visibilitySelect.value =
                    "public";

                typeSelect.value =
                    "image";

                updateCharacterCount();


                /*
                 * الانتقال للمنشورات بعد
                 * مدة قصيرة حتى تظهر الرسالة.
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "posts.html";

                    },
                    900
                );


            } catch (
                error
            ) {

                console.error(
                    "WFESC PUBLISH ERROR:",
                    error
                );


                showStatus(
                    getPublishErrorMessage(
                        error
                    ),
                    "error"
                );

            } finally {

                isPublishing =
                    false;

                publishButton.disabled =
                    false;

                clearButton.disabled =
                    false;

                imageButton.disabled =
                    false;

            }

        }


        /* =========================================================
           ERROR MESSAGE
        ========================================================= */

        function getPublishErrorMessage(
            error
        ) {

            const message =
                String(
                    error?.message ||
                    ""
                );


            if (
                message
                    .toLowerCase()
                    .includes(
                        "bucket"
                    )
            ) {

                return (
                    "تعذر رفع الصورة لأن Storage غير مضبوط حالياً. " +
                    "تأكد من اسم Bucket الخاص بصور المنشورات."
                );

            }


            if (
                message
                    .toLowerCase()
                    .includes(
                        "not authenticated"
                    )
            ) {

                return (
                    "انتهت جلسة تسجيل الدخول. سجل الدخول مرة أخرى."
                );

            }


            if (
                message
                    .toLowerCase()
                    .includes(
                        "row-level security"
                    )
            ) {

                return (
                    "تم رفض العملية من صلاحيات قاعدة البيانات. " +
                    "تحقق من صلاحيات النشر في Supabase."
                );

            }


            return (
                "تعذر نشر المنشور حالياً. " +
                message
            );

        }


        /* =========================================================
           PUBLISH BUTTON
        ========================================================= */

        publishButton.addEventListener(
            "click",
            createPost
        );


        /* =========================================================
           ENTER SAFETY
           
           Ctrl + Enter / Enter مع ضغط Ctrl
           يمكنه نشر المنشور.
        ========================================================= */

        publishText.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    event.ctrlKey
                ) {

                    event.preventDefault();

                    createPost();

                }

            }
        );


        /* =========================================================
           TYPE CONTROL
        ========================================================= */

        typeSelect.addEventListener(
            "change",
            function () {

                /*
                 * إذا اختار المستخدم منشوراً نصياً
                 * لا نحذف الصورة الموجودة تلقائياً.
                 * يمكنه إزالتها بنفسه.
                 */

                if (
                    this.value === "text"
                ) {

                    imageButton.style.opacity =
                        "0.65";

                } else {

                    imageButton.style.opacity =
                        "1";

                }

            }
        );


        /* =========================================================
           AUTH STATE
        ========================================================= */

        supabaseClient.auth.onAuthStateChange(
            async function (
                event,
                session
            ) {

                if (
                    session?.user
                ) {

                    await loadCurrentProfile(
                        session.user
                    );

                }

            }
        );


        /* =========================================================
           INITIALIZATION
        ========================================================= */

        async function initializePublishPage() {

            updateCharacterCount();


            const user =
                await getCurrentUser();


            if (!user) {

                showStatus(
                    "سجل الدخول أولاً حتى تتمكن من إنشاء منشور.",
                    "error"
                );

                publishButton.disabled =
                    true;

                imageButton.disabled =
                    true;

                clearButton.disabled =
                    false;

                return;

            }


            publishButton.disabled =
                false;

            imageButton.disabled =
                false;


            await loadCurrentProfile(
                user
            );

        }


        initializePublishPage();


        /* =========================================================
           EXTERNAL BRIDGE
           
           جاهز لاحقاً لنقله إلى:
           posts-featwres/publish/
        ========================================================= */

        window.WFESC_PUBLISH_CORE = {

            createPost,

            getCurrentUser,

            uploadPostImage,

            removeSelectedImage,

            updateCharacterCount,

            showStatus,

            supabase:
                supabaseClient,

            storageBucket:
                POST_MEDIA_BUCKET

        };


    </script>

</body>

</html>
